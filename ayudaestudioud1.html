<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#123d42"><title>Technology Lab · Study & Exam</title><style>

0}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}.panel{background:var(--paper);border:1px solid var(--border);border-radius:22px;padding:26px;box-shadow:0 8px 30px #17323808}.sectionTitle{font-size:24px;line-height:1.25;letter-spacing:-.5px;margin:0 0 10px}.sub{color:var(--muted);margin:0 0 20px}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:20px 0}.control{display:grid;gap:6px;min-width:170px;flex:1}.control label{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.control select,.control input{padding:12px;border:1px solid var(--border);border-radius:10px;width:100%;background:white;color:var(--ink)}.btn{background:var(--accent);border:1px solid var(--accent);color:white;border-radius:12px;padding:12px 18px;font-weight:800;min-height:45px}.btn.secondary{background:white;color:var(--ink);border-color:var(--border)}.btn.ghost{background:var(--accent2);color:var(--ink);border-color:var(--accent2)}.btn.danger{background:#fbebeb;border-color:#f1cccc;color:#952e30}.btn:disabled{opacity:.45;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f4f9f8;border-radius:13px;padding:12px;text-align:center}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}.progress{height:9px;background:#e2eded;border-radius:30px;overflow:hidden;margin:16px 0}.progress i{display:block;height:100%;background:var(--accent);border-radius:30px;transition:width .2s}.flash{width:100%;min-height:280px;border:2px solid var(--border);background:linear-gradient(145deg,#fff,#f6fbf9);border-radius:21px;padding:30px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--ink);box-shadow:0 10px 25px #2c525109;transition:transform .2s}.flash:hover{transform:translateY(-2px)}.flash .question{font-size:clamp(20px,3vw,29px);font-weight:800;line-height:1.36;white-space:pre-line}.flash .answer{font-size:clamp(19px,2.5vw,25px);font-weight:800;color:var(--good)}.flash .hint{color:var(--muted);font-size:13px}.pill{display:inline-block;padding:5px 11px;background:var(--accent2);border-radius:99px;font-size:12px;font-weight:850;color:#146d63}.cardactions{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:17px}.qtag{font-weight:850;color:var(--accent);font-size:13px;letter-spacing:.5px;text-transform:uppercase}.examQ{font-size:clamp(20px,2.7vw,25px);line-height:1.36;margin:10px 0 20px}.choice{display:flex;gap:12px;border:1px solid var(--border);border-radius:13px;padding:14px;margin:9px 0;cursor:pointer;align-items:flex-start}.choice:has(input:checked){border-color:var(--accent);background:#eaf7f2}.choice input{accent-color:var(--accent);width:19px;height:19px;flex:none;margin-top:3px}.pairs{display:grid;gap:12px}.pair{background:#f6faf9;border-radius:12px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,1fr);align-items:center;gap:10px}.pair select{width:100%;min-width:0;border:1px solid var(--border);background:white;border-radius:10px;padding:10px;color:var(--ink)}.legend{border:1px solid var(--border);border-radius:13px;padding:14px;margin-top:15px;background:#fbfdfd}.legend div+div{margin-top:8px}.legend .code{color:var(--accent);font-weight:900;margin-right:8px}.longinput{width:100%;min-height:125px;resize:vertical;border-radius:13px;border:1px solid var(--border);padding:14px;color:var(--ink)}.shortinput{width:100%;padding:13px;border:1px solid var(--border);border-radius:12px}.feedback{padding:16px;background:#f4faf7;border:1px solid #cce8dd;border-radius:13px;margin:14px 0;white-space:pre-wrap}.feedback.wrong{background:#fff5f3;border-color:#f0cdcb}.review{padding:15px;border:1px solid var(--border);border-radius:14px;margin:12px 0}.review h3{font-size:16px;margin:0 0 6px}.review p{margin:6px 0}.review .model{color:var(--good);font-weight:700}.review .mine{color:var(--muted);white-space:pre-wrap}.review .self{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.review .self button.selected{background:var(--ink);color:white}.summary{font-size:38px;font-weight:900;line-height:1.2}.small{font-size:12px;color:var(--muted)}.empty{border:2px dashed var(--border);padding:22px;border-radius:14px;text-align:center;color:var(--muted)}.checkrow{display:flex;gap:10px;align-items:center;margin:12px 0}.checkrow input{accent-color:var(--accent);width:17px;height:17px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:25px}.hidden{display:none!important}@media(max-width:650px){.shell{padding:12px 12px 42px}.hero{padding:22px}.panel{padding:18px}.top{align-items:flex-start}.language{margin-left:auto}.nav{display:grid;grid-template-columns:1fr 1fr}.tab{padding:11px 8px}.cardactions{display:grid;grid-template-columns:1fr 1fr}.cardactions .btn{padding:10px}.pair{grid-template-columns:1fr}.stats{gap:5px}.stat{padding:8px}.flash{min-height:320px;padding:18px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="logo">⚙</div><div><span class="eyebrow">1.º ESO · 2026–2027</span><b>Technology Study Lab</b></div></div><div class="language"><button id="esBtn" class="active" onclick="setLang('es')">ES</button><button id="enBtn" onclick="setLang('en')">EN</button></div></header><section class="hero"><small id="heroSmall"></small><h1 id="heroTitle"></h1><p id="heroText"></p></section><nav class="nav"><button class="tab active" id="tabStudy" onclick="setTab('study')"></button><button class="tab" id="tabExam" onclick="setTab('exam')"></button></nav><main id="app" aria-live="polite"></main><footer class="footer" id="footer"></footer></div><script>
const QUESTIONS=[{"id": 1, "kind": "mcq", "en": {"q": "Which of the following formulas correctly defines Technology?", "details": [], "options": ["Science + Art + Mathematics", "Science + Technique + Skill", "Computing + Drawing + Tools", "Technical + Electricity + Manuals"], "answer": "Science + Technique + Skill"}, "correct": 1, "es": {"q": "¿Qué fórmula define correctamente la tecnología?", "details": [], "options": ["Ciencia + Arte + Matemáticas", "Ciencia + Técnica + Destreza", "Informática + Dibujo + Herramientas", "Técnica + Electricidad + Manuales"], "answer": "Ciencia + Técnica + Destreza"}}, {"id": 2, "kind": "tf", "en": {"q": "Basic needs are those on which human survival depends, such as food, housing, and health.", "details": [], "options": ["True", "False"], "answer": "True"}, "correct": 0, "es": {"q": "Las necesidades básicas son aquellas de las que depende nuestra supervivencia, como la alimentación, la vivienda y la salud.", "details": [], "options": ["Verdadero", "Falso"], "answer": "Verdadero"}}, {"id": 3, "kind": "mcq", "en": {"q": "What type of need do transport, entertainment, and communication belong to?", "details": [], "options": ["Primary needs", "Basic needs", "Secondary needs", "Biological needs"], "answer": "Secondary needs"}, "correct": 2, "es": {"q": "¿A qué tipo de necesidades pertenecen el transporte, el entretenimiento y la comunicación?", "details": [], "options": ["Necesidades primarias", "Necesidades básicas", "Necesidades secundarias", "Necesidades biológicas"], "answer": "Necesidades secundarias"}}, {"id": 4, "kind": "match", "en": {"q": "Match each type of technological product with its corresponding example:", "details": ["Goods (Physical objects)", "Services (Intangibles)", "Processes (Systems)"], "options": ["Wi-Fi network and public transport", "Plastic recycling", "Mobile phone and bicycle"], "answer": "1–C, 2–A, 3–B"}, "correct": [2, 0, 1], "es": {"q": "Relaciona cada tipo de producto tecnológico con su ejemplo.", "details": ["Bienes (objetos físicos)", "Servicios (intangibles)", "Procesos (sistemas)"], "options": ["Red wifi y transporte público", "Reciclaje del plástico", "Teléfono móvil y bicicleta"], "answer": "1–C, 2–A, 3–B"}}, {"id": 5, "kind": "open", "en": {"q": "Define Technology.", "details": [], "options": [], "answer": "Technology is the combination of knowledge, techniques and skills that allows us to solve problems and satisfy human needs."}, "correct": null, "es": {"q": "Define qué es la tecnología.", "details": [], "options": [], "answer": "La tecnología es el conjunto de conocimientos, técnicas y destrezas que permite resolver problemas y satisfacer necesidades humanas."}}, {"id": 6, "kind": "open", "en": {"q": "Briefly explain the difference between a basic need and a secondary need, giving an example of each.", "details": [], "options": [], "answer": "Basic: essential for survival (e.g., water/health). Secondary: improves quality of life (e.g., mobile phone/entertainment)."}, "correct": null, "es": {"q": "Explica brevemente la diferencia entre necesidad básica y secundaria, e incluye un ejemplo de cada una.", "details": [], "options": [], "answer": "Básica: imprescindible para sobrevivir (agua o salud). Secundaria: mejora la calidad de vida (teléfono móvil u ocio)."}}, {"id": 7, "kind": "mcq", "en": {"q": "What does the 'anatomical analysis' of a technological object analyze?", "details": [], "options": ["Its price and market", "Its usefulness and main function", "Its physical form and the parts that make it up", "The materials used"], "answer": "Its physical form and the parts that make it up"}, "correct": 2, "es": {"q": "¿Qué estudia el análisis anatómico de un objeto tecnológico?", "details": [], "options": ["Su precio y su mercado", "Su utilidad y función principal", "Su forma física y las partes que lo componen", "Los materiales empleados"], "answer": "Su forma física y las partes que lo componen"}}, {"id": 8, "kind": "tf", "en": {"q": "Technical analysis is responsible for studying the environmental impact and the selling price of a product.", "details": [], "options": ["True", "False"], "answer": "False"}, "correct": 1, "es": {"q": "El análisis técnico se encarga de estudiar el impacto ambiental y el precio de venta de un producto.", "details": [], "options": ["Verdadero", "Falso"], "answer": "Falso"}}, {"id": 9, "kind": "mcq", "en": {"q": "If we ask ourselves 'What is this object for and what is its main use?', what kind of analysis are we performing?", "details": [], "options": ["Anatomical Analysis", "Functional Analysis", "Aesthetic Analysis", "Economic Analysis"], "answer": "Functional Analysis"}, "correct": 1, "es": {"q": "Si nos preguntamos «¿para qué sirve este objeto y cuál es su uso principal?», ¿qué análisis hacemos?", "details": [], "options": ["Análisis anatómico", "Análisis funcional", "Análisis estético", "Análisis económico"], "answer": "Análisis funcional"}}, {"id": 10, "kind": "keyword", "en": {"q": "The __________ analysis evaluates aspects such as color, beauty, and the exterior finish of the object.", "details": [], "options": [], "answer": "Aesthetic"}, "correct": null, "es": {"q": "El análisis __________ valora el color, la belleza y el acabado exterior de un objeto.", "details": [], "options": [], "answer": "Estético"}}, {"id": 11, "kind": "match", "en": {"q": "Indicate which question corresponds to each type of technical analysis about a backpack:", "details": ["What materials is it made of?", "What shape and pockets does it have?", "How much does it cost and what is its environmental impact?", "What does it look like?"], "options": ["Anatomical Analysis", "Technical Analysis", "Aesthetic Analysis", "Economic and Social Analysis"], "answer": "1–B, 2–A, 3–D, 4–C"}, "correct": [1, 0, 3, 2], "es": {"q": "Relaciona cada pregunta sobre una mochila con el tipo de análisis correspondiente.", "details": ["¿De qué materiales está hecha?", "¿Qué forma y bolsillos tiene?", "¿Cuánto cuesta y qué impacto ambiental tiene?", "¿Qué aspecto tiene?"], "options": ["Análisis anatómico", "Análisis técnico", "Análisis estético", "Análisis económico y social"], "answer": "1–B, 2–A, 3–D, 4–C"}}, {"id": 12, "kind": "open", "en": {"q": "Apply the 5 lenses of technological analysis (Anatomical, Technical, Functional, Aesthetic and Economic-Social) to a conventional pen.", "details": [], "options": [], "answer": "Anatomical: body, cartridge, cap; Technical: plastic and ink; Functional: writing; Aesthetic: transparent/blue; Economic-social: <€1, recyclable."}, "correct": null, "es": {"q": "Aplica los cinco tipos de análisis tecnológico (anatómico, técnico, funcional, estético y económico-social) a un bolígrafo convencional.", "details": [], "options": [], "answer": "Anatómico: cuerpo, cartucho y capuchón. Técnico: plástico y tinta. Funcional: escribir. Estético: transparente o azul. Económico-social: cuesta menos de 1 € y es reciclable."}}, {"id": 13, "kind": "mcq", "en": {"q": "What is the first phase of the Technological Process or Project Method?", "details": [], "options": ["Search for information", "Design", "Identify the need or problem", "Build the prototype"], "answer": "Identify the need or problem"}, "correct": 2, "es": {"q": "¿Cuál es la primera fase del proceso tecnológico o método de proyectos?", "details": [], "options": ["Buscar información", "Diseñar", "Identificar la necesidad o el problema", "Construir el prototipo"], "answer": "Identificar la necesidad o el problema"}}, {"id": 14, "kind": "mcq", "en": {"q": "At what stage of the technological process do we draw the first sketches and plans of the object?", "details": [], "options": ["Plan", "Design", "Evaluate", "Information search"], "answer": "Design"}, "correct": 1, "es": {"q": "¿En qué fase del proceso tecnológico realizamos los primeros bocetos y planos del objeto?", "details": [], "options": ["Planificación", "Diseño", "Evaluación", "Búsqueda de información"], "answer": "Diseño"}}, {"id": 15, "kind": "tf", "en": {"q": "In the 'Planning' phase we choose the tools, divide the tasks and calculate the time before we start building.", "details": [], "options": ["True", "False"], "answer": "True"}, "correct": 0, "es": {"q": "En la fase de planificación elegimos herramientas, repartimos las tareas y calculamos el tiempo antes de construir.", "details": [], "options": ["Verdadero", "Falso"], "answer": "Verdadero"}}, {"id": 16, "kind": "order", "en": {"q": "Order the following phases of the Technological Process chronologically from 1 to 8:", "details": ["Design", "Identify need", "Build", "Search for information", "Present report", "Generate ideas and choose", "Evaluate", "Plan"], "options": [], "answer": "Identify need → Search for information → Generate ideas and choose → Design → Plan → Build → Evaluate → Present report"}, "correct": [1, 3, 5, 0, 7, 2, 6, 4], "es": {"q": "Ordena cronológicamente las ocho fases del proceso tecnológico.", "details": ["Diseñar", "Identificar la necesidad", "Construir", "Buscar información", "Presentar la memoria", "Generar ideas y elegir", "Evaluar", "Planificar"], "options": [], "answer": "Identificar la necesidad → Buscar información → Generar ideas y elegir → Diseñar → Planificar → Construir → Evaluar → Presentar la memoria"}}, {"id": 17, "kind": "mcq", "en": {"q": "What should we do in the 'Evaluation' phase if the constructed object does not function correctly?", "details": [], "options": ["Throw it in the trash and approve", "Modify the design, correct errors, or find another solution", "Pass the project on to another group", "Change teachers"], "answer": "Modify the design, correct errors, or find another solution"}, "correct": 1, "es": {"q": "¿Qué debemos hacer durante la evaluación si el objeto construido no funciona bien?", "details": [], "options": ["Tirarlo a la basura y darlo por bueno", "Modificar el diseño, corregir errores o buscar otra solución", "Pasar el proyecto a otro grupo", "Cambiar de profesor"], "answer": "Modificar el diseño, corregir errores o buscar otra solución"}}, {"id": 18, "kind": "keyword", "en": {"q": "What is the name of the final technical document compiling all project work?", "details": [], "options": [], "answer": "Final Report"}, "correct": null, "es": {"q": "¿Cómo se llama el documento técnico final que reúne todo el trabajo del proyecto?", "details": [], "options": [], "answer": "Memoria final"}}, {"id": 19, "kind": "mcq", "en": {"q": "In the activity 'The Broken Circuit', a group notices that the neighborhood dogs are cold. Indicate which phase corresponds to the action 'Search the internet for standard dog measurements'.", "details": [], "options": ["Identify need", "Search for information", "Construction", "Budget"], "answer": "Search for information"}, "correct": 1, "es": {"q": "En la actividad «El circuito roto», un grupo observa que los perros del barrio pasan frío. ¿A qué fase corresponde buscar en internet las medidas habituales de los perros?", "details": [], "options": ["Identificar la necesidad", "Buscar información", "Construcción", "Presupuesto"], "answer": "Buscar información"}}, {"id": 20, "kind": "open", "en": {"q": "Why is it said that the Technological Process is not a straight line but a cycle? Explain briefly.", "details": [], "options": [], "answer": "Because after evaluating the prototype, if faults or improvements are detected, the process must be redesigned or corrected."}, "correct": null, "es": {"q": "¿Por qué decimos que el proceso tecnológico es un ciclo y no una línea recta?", "details": [], "options": [], "answer": "Porque después de evaluar un prototipo, si aparecen fallos o posibles mejoras, debemos revisar y corregir el diseño o volver a fases anteriores."}}, {"id": 21, "kind": "mcq", "en": {"q": "How many fundamental rotating roles are established for teamwork in the Technology workshop?", "details": [], "options": ["2 roles", "3 roles", "4 roles", "6 roles"], "answer": "4 roles"}, "correct": 2, "es": {"q": "¿Cuántos roles rotatorios fundamentales se establecen para el trabajo en equipo en el taller?", "details": [], "options": ["2 roles", "3 roles", "4 roles", "6 roles"], "answer": "4 roles"}}, {"id": 22, "kind": "match", "en": {"q": "Match each team role with its main function in the workshop:", "details": ["Coordinator/Secretary", "Materials and Tools Manager", "Order, Cleanliness, and Safety Manager", "Quality and Workplace Relations Manager"], "options": ["Ensure the table is clean and the rules are followed.", "Leads the team, makes decisions, and completes documents", "Encourage respect and check that the work is done well", "Monitor, collect, distribute and ensure the good condition of the instruments"], "answer": "1–B, 2–D, 3–A, 4–C"}, "correct": [1, 3, 0, 2], "es": {"q": "Relaciona cada rol del equipo con su función principal en el taller.", "details": ["Coordinador/a y secretario/a", "Responsable de materiales y herramientas", "Responsable de orden, limpieza y seguridad", "Responsable de calidad y relaciones del grupo"], "options": ["Comprueba que la mesa esté limpia y que se cumplan las normas", "Dirige el grupo, toma decisiones y completa documentos", "Fomenta el respeto y comprueba la calidad del trabajo", "Solicita, reparte, recoge y cuida los instrumentos"], "answer": "1–B, 2–D, 3–A, 4–C"}}, {"id": 23, "kind": "tf", "en": {"q": "In the Technology workshop, team roles are fixed for the entire course and no student should change their role.", "details": [], "options": ["True", "False"], "answer": "False"}, "correct": 1, "es": {"q": "En el taller de Tecnología, los roles del equipo son fijos todo el curso y nadie debe cambiar de función.", "details": [], "options": ["Verdadero", "Falso"], "answer": "Falso"}}, {"id": 24, "kind": "mcq", "en": {"q": "Who is responsible for requesting tools from the panel and verifying that they are returned clean and tidy?", "details": [], "options": ["The Coordinator", "The Materials and Tools Manager", "The Quality Manager", "All individually without warning"], "answer": "The Materials and Tools Manager"}, "correct": 1, "es": {"q": "¿Quién solicita las herramientas del panel y verifica que se devuelven limpias y ordenadas?", "details": [], "options": ["El coordinador", "El responsable de materiales y herramientas", "El responsable de calidad", "Cada alumno por separado y sin avisar"], "answer": "El responsable de materiales y herramientas"}}, {"id": 25, "kind": "keyword", "en": {"q": "The 'superpower' of the person in charge of Order, Cleanliness and Security is __________, ensuring that the table is clear.", "details": [], "options": [], "answer": "prevention"}, "correct": null, "es": {"q": "El «superpoder» de la persona responsable del orden, la limpieza y la seguridad es la __________.", "details": [], "options": [], "answer": "Prevención"}}, {"id": 26, "kind": "open", "en": {"q": "Why is it important that in the Technology workshop we work as a team and not individually or 'alone'?", "details": [], "options": [], "answer": "Teamwork allows us to distribute tasks, cooperate and help one another."}, "correct": null, "es": {"q": "¿Por qué es importante trabajar en equipo en el taller de Tecnología y no cada uno por su cuenta?", "details": [], "options": [], "answer": "Porque podemos repartir tareas, colaborar y ayudarnos mutuamente."}}, {"id": 27, "kind": "mcq", "en": {"q": "In what correct order should the basic operations be performed in the workshop to manufacture a part?", "details": [], "options": ["Cut -> Measure -> Pierce -> Mark -> Finish", "Measure -> Mark -> Cut -> Drill -> Assemble -> Finish", "Mounts -> Drills -> Cuts -> Marks -> Measures", "Cuts -> Measures -> Assembles -> Finishes"], "answer": "Measure -> Mark -> Cut -> Drill -> Assemble -> Finish"}, "correct": 1, "es": {"q": "¿En qué orden se realizan normalmente las operaciones básicas para fabricar una pieza en el taller?", "details": [], "options": ["Cortar → Medir → Perforar → Marcar → Acabar", "Medir → Marcar → Cortar → Taladrar → Mon , "Destornillador"], "answer": "Segueta o sierra de marquetería"}}, {"id": 32, "kind": "keyword", "en": {"q": "To make holes in wood we use the drill with specific drill bits, such as the __________ drill bit for wide holes.  (1)", "details": [], "options": [], "answer": "Forstner"}, "correct": null, "es": {"q": "Para abrir agujeros anchos en madera con el taladro, podemos utilizar una broca de tipo __________.", "details": [], "options": [], "answer": "Forstner"}}, {"id": 33, "kind": "match", "en": {"q": "Classify the following tools according to their function:", "details": ["Hammer", "Sandpaper and file", "Hot glue gun / Silicone gun", "Bench Vise"], "options": ["Hold", "To hit", "Join", "Finish"], "answer": "1–B, 2–D, 3–C, 4–A"}, "correct": [1, 3, 2, 0], "es": {"q": "Clasifica estas herramientas según su función.", "details": ["Martillo", "Papel de lija y lima", "Pistola de silicona termofusible", "Tornillo de banco"], "options": ["Sujetar", "Golpear", "Unir", "Acabar"], "answer": "1–B, 2–D, 3–C, 4–A"}}, {"id": 34, "kind": "mcq", "en": {"q": "What is the function of sandpaper and files in the final stage of work?", "details": [], "options": ["Join pieces under pressure", "Reduce hard edges and smooth surfaces", "Mark cutting lines", "Drill holes"], "answer": "Reduce hard edges and smooth surfaces"}, "correct": 1, "es": {"q": "¿Para qué se utilizan el papel de lija y las limas al finalizar un trabajo?", "details": [], "options": ["Unir piezas a presión", "Eliminar aristas y suavizar superficies", "Marcar líneas de corte", "Taladrar agujeros"], "answer": "Eliminar aristas y suavizar superficies"}}, {"id": 35, "kind": "mcq", "en": {"q": "A student needs to cut a wooden strip, but it moves a lot on the table. What tool should they use immediately before sawing?", "details": [], "options": ["A hammer", "A clamp or vise (or bench vise)", "A file", "A squadron"], "answer": "A clamp or vise (or bench vise)"}, "correct": 1, "es": {"q": "Un alumno va a cortar un listón, p let lang=load('tls-lang','es'),tab='study',known=load('tls-known',{}),studyList=[],cardIndex=0,flipped=false,exam=null,examPage=0,finished=false,filter='all',shuffle=true,onlyReview=false,amount=20;
function t(k){return TXT[lang][k]}function content(q){return q[lang]}function block(q){return q.id<=12?1:q.id<=20?2:q.id<=26?3:q.id<=42?4:5}function group(){return QUESTIONS.filter(q=>(filter==='all'||block(q)===+filter)&&(!onlyReview||!known[q.id]))}function shuffleArr(a){return [...a].sort(()=>Math.random()-.5)}function button(label,fn,cl=''){return `<button class="btn ${cl}" onclick="${fn}">${label}</button>`}function setLang(v){lang=v;save('tls-lang',v);updateHeader();render()}function updateHeader(){$('esBtn').classList.toggle('active',lang==='es');$('enBtn').classList.toggle('active',lang==='en');document.documentElement.lang=lang;$('heroSmall').textContent=t('tag');$('heroTitle').textContent=t('hero');$('heroText').textContent=t('intro');$('tabStudy').textContent=t('study');$('tabExam').textContent=t('exam');$('footer').textContent=t('footer')}function setTab(v){tab=v;finished=false;exam=null;$('tabStudy').classList.toggle('active',v==='study');$('tabExam').classList.toggle('active',v==='exam');render()}function changeFilter(v){filter=v;cardIndex=0;flipped=false;render()}function topicSelect(){return `<div class="control"><label>${t('section')}</label><select onchange="changeFilter(this.value)"><option value="all" ${filter==='all'?'selected':''}>${t('mix')}</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${filter===String(n)?'selected':''}>${t('b'+n)}</option>`).join('')}</select></div>`}function studyInit(){studyList=group();if(cardIndex>=studyList.length)cardIndex=0}function render(){updateHeader();if(tab==='study')renderStudy();else if(finished)renderResults();else if(exam)renderExam();else renderSetup()}
function renderStudy(){studyInit();const count=studyList.length;const mastered=studyList.filter(q=>known[q.id]).length;let out=`<section class="panel"><h2 class="sectionTitle">${t('studyTitle')}</h2><p class="sub">${t('studyDesc')}</p><div class="controls">${topicSelect()}<label class="checkrow"><input type="checkbox" ${onlyReview?'checked':''} onchange="onlyReview=this.checked;cardIndex=0;render()"> ${t('onlyReview')}</label></div><div class="stats"><div class="stat"><b>${Object.values(known).filter(Boolean).length}/47</b><span>${t('knownCount')}</span></div><div class="stat"><b>${47-Object.values(known).filter(Boolean).length}</b><span>${t('pending')}</span></div><div class="stat"><b>${count}</b><span>${t('total')}</span></div></div>`;
if(!count){out+=`<div class="empty">${t('empty')}</div>`}else{let q=studyList[cardIndex],d=content(q);out+=`<div class="small">${t('question')} ${cardIndex+1} ${t('of')} ${count} · #${q.id}</div><div class="progress"><i style="width:${100*(cardIndex+1)/count}%"></i></div><button type="button" class="flash" onclick="flipped=!flipped;render()" aria-label="${safe(flipped?t('backflip'):t('flip'))}"><span class="pill">${flipped?t('back'):t('front')}</span><div class="${flipped?'answer':'question'}">${safe(flipped?d.answer:d.q)}</div>${!flipped&&d.details.length?`<div class="small">${safe(d.details.map((x,i)=>`${i+1}. ${x}`).join(' · '))}</div>`:''}<span class="hint">${flipped?t('backflip'):t('flip')}</span></button><div class="cardactions">${button(t('previous'),'moveCard(-1)','secondary')}${button(t('later'),'markCard(false)','ghost')}${button(t('known'),'markCard(true)')}${button(t('next'),'moveCard(1)','secondary')}</div>`}out+=`<div style="margin-top:16px">${button(t('clear'),'clearProgress()','danger')}</div></section>`;$('app').innerHTML=out}function moveCard(n){if(!studyList.length)return;cardIndex=(cardIndex+n+studyList.length)%studyList.length;flipped=false;render()}function markCard(val){const q=studyList[cardIndex];if(!q)return;known[q.id]=val;save('tls-known',known);if(onlyReview){cardIndex=Math.min(cardIndex,group().length-1);flipped=false;render()}else moveCard(1)}function clearProgress(){if(confirm(t('confirmed'))){known={};save('tls-known',known);render()}}
function renderSetup(){$('app').innerHTML=`<section class="panel"><h2 class="sectionTitle">${t('setup')}</h2><p class="sub">${t('setupText')}</p><div class="controls">${topicSelect()}<div class="control"><label>${t('num')}</label><select onchange="amount=this.value==='all'?'all':Number(this.value)">${[10,20,30,'all'].map(n=>`<option value="${n}" ${amount===n?'selected':''}>${n==='all'?t('all'):n}</option>`).join('')}</select></div></div><label class="checkrow"><input type="checkbox" onchange="shuffle=this.checked" ${shuffle?'checked':''}>${t('random')}</label><p class="small">${t('how')}</p>${button(t('start'),'startExam()')}</section>`}function startExam(){const list=group();if(!list.length){alert(t('empty'));return}const selected=(shuffle?shuffleArr(list):list).slice(0,amount==='all'?list.length:amount);exam={list:selected.map(q=>q.id),answers:{},self:{},started:Date.now()};examPage=0;finished=false;render()}
function currentQ(){return QUESTIONS.find(q=>q.id===exam.list[examPage])}function aget(id){return exam.answers[id]}function aset(id,v){exam.answers[id]=v}
function optionsUI(q){let d=content(q),val=aget(q.id);if(q.kind==='mcq'||q.kind==='tf')return d.options.map((x,i)=>`<label class="choice"><input type="radio" name="q${q.id}" value="${i}" ${val===i?'checked':''} onchange="aset(${q.id},${i})"><span><b>${'ABCD'[i]}.</b> ${safe(x)}</span></label>`).join('');if(q.kind==='keyword')return `<input class="shortinput" aria-label="${safe(t('answer'))}" value="${safe(val||'')}" oninput="aset(${q.id},this.value)" autocomplete="off">`;if(q.kind==='open')return `<textarea class="longinput" aria-label="${safe(t('answer'))}" oninput="aset(${q.id},this.value)" placeholder="${safe(t('answer'))}">${safe(val||'')}</textarea>`;if(q.kind==='match')return `<p class="small">${t('matchHelp')}</p><div class="pairs">${d.details.map((line,i)=>`<div class="pair"><div><b>${i+1}.</b> ${safe(line)}</div><select aria-label="${i+1}" onchange="setArrayAnswer(${q.id},${i},this.value)"><option value="">${t('select')}</option>${d.options.map((_,j)=>`<option value="${j}" ${Array.isArray(val)&&val[i]===j?'selected':''}>${'ABCD'[j]}</option>`).join('')}</select></div>`).join('')}</div><div class="legend">${d.options.map((x,i)=>`<div><span class="code">${'ABCD'[i]}.</span> ${safe(x)}</div>`).join('')}</div>`;return `<p class="small">${t('orderHelp')}</p><div class="pairs">${d.details.map((line,i)=>`<div class="pair"><div>${safe(line)}</div><select aria-label="${i+1}" onchange="setArrayAnswer(${q.id},${i},this.value)"><option value="">${t('position')}</option>${d.details.map((_,j)=>`<option value="${j}" ${Array.isArray(val)&&val[i]===j?'selected':''}>${j+1}</option>`).join('')}</select></div>`).join('')}</div>`}
function setArrayAnswer(id,i,v){let arr=Array.isArray(aget(id))?[...aget(id)]:[];arr[i]=v===''?null:+v;aset(id,arr)}function renderExam(){let q=currentQ(),d=content(q),n=exam.list.length;$('app').innerHTML=`<section class="panel"><div class="qtag">${t('question')} ${examPage+1} ${t('of')} ${n} · #${q.id}</div><div class="progress"><i style="width:${(examPage+1)/n*100}%"></i></div><h2 class="examQ">${safe(d.q)}</h2>${optionsUI(q)}<div class="cardactions" style="margin-top:25px">${button(t('backQ'),'examMove(-1)','secondary')}${button(examPage===n-1?t('finish'):t('nextEnd'),examPage===n-1?'completeExam()':'examMove(1)')}</div><p class="small">${t('examInfo')}</p></section>`}function examMove(n){examPage=Math.max(0,Math.min(exam.list.length-1,examPage+n));render();window.scrollTo({top:0,behavior:'smooth'})}function completeExam(){if(!confirm(t('finishConfirm')))return;finished=true;render();window.scrollTo(0,0)}function isFilled(q,v){if(v===undefined||v===null||v==='')return false;if(Array.isArray(v))return v.length===q[lang].details.length&&v.every(x=>x!==null&&x!==undefined);return String(v).trim().length>0}function getGrade(q){const v=aget(q.id);if(q.kind==='open'||q.kind==='keyword')return exam.self[q.id]??null;if(!isFilled(q,v))return false;if(q.kind==='mcq'||q.kind==='tf')return v===q.correct;if(q.kind==='match')return JSON.stringify(v)===JSON.stringify(q.correct);if(q.kind==='order')return q.correct.every((originalIdx,rank)=>v[originalIdx]===rank);return false}function answeredText(q){let d=content(q),v=aget(q.id);if(!isFilled(q,v))return t('noanswer');if(q.kind==='mcq'||q.kind==='tf')return d.options[v];if(q.kind==='match')return d.details.map((_,i)=>`${i+1}–${v[i]===null?'?':String.fromCharCode(65+v[i])}`).join(', ');if(q.kind==='order')return d.details.map((x,i)=>`${x}: ${v[i]===null?'?':v[i]+1}`).join(' · ');return v}
function gradeStats(){let values=exam.list.map(id=>getGrade(QUESTIONS[id-1]));let yes=values.filter(v=>v===true).length,no=values.filter(v=>v===false).length,waiting=values.filter(v=>v===null).length;return{yes,no,waiting,percent:Math.round(100*yes/exam.list.length)}}function selfMark(id,good){exam.self[id]=good;renderResults()}function renderResults(){let stats=gradeStats(),mins=Math.max(1,Math.round((Date.now()-exam.started)/60000));let out=`<section class="panel"><h2 class="sectionTitle">${t('result')}</h2><div class="summary">${stats.waiting?'—':(stats.percent+'%')}</div><p class="sub">${stats.waiting?t('notFinal'):t('allDone')}</p><div class="stats"><div class="stat"><b>${stats.yes}</b><span>${t('correct')}</span></div><div class="stat"><b>${stats.no}</b><span>${t('incorrect')}</span></div><div class="stat"><b>${stats.waiting}</b><span>${t('manual')}</span></div></div><p class="small">${t('time')}: ${mins} min · ${t('notes')}</p><div class="cardactions">${button(t('backHome'),'setTab("exam")','secondary')}${button(t('retake'),'repeatExam()')}</div><h2 class="sectionTitle" style="margin-top:27px">${t('reviewTitle')}</h2>`;
for(let id of exam.list){let q=QUESTIONS[id-1],d=content(q),v=getGrade(q),isManual=q.kind==='keyword'||q.kind==='open';out+=`<article class="review"><div class="qtag">#${q.id} · ${v===true?'✓':v===false?'✕':'…'}</div><h3>${safe(d.q)}</h3><p class="mine"><b>${t('yourChoice')}:</b> ${safe(answeredText(q))}</p><p class="model"><b>${t('solution')}:</b> ${safe(d.answer)}</p>${isManual?`<p class="small">${t('self')}</p><div class="self">${button(t('right'),`selfMark(${q.id},true)`,exam.self[q.id]===true?'selected':'secondary')}${button(t('wrong'),`selfMark(${q.id},false)`,exam.self[q.id]===false?'selected':'secondary')}</div>`:''}</article>`}out+='</section>';$('app').innerHTML=out}function repeatExam(){exam={list:[...exam.list],answers:{},self:{},started:Date.now()};examPage=0;finished=false;render()}updateHeader();render();
</script></body></html>
