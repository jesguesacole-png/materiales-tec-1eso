<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U2 · Expresión y Comunicación Gráfica</title>
<meta name="description" content="Tecnología y Digitalización 1.º ESO · Unidad 2 · Expresión gráfica: boceto, croquis, vistas, acotación, escalas y CAD (ES/EN)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16365c">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16365c; --blue:#1f6fb2; --blue-soft:#e3eef9;
  --orange:#e8710a; --orange-soft:#fdeedd;
  --green:#2e8540; --green-soft:#e2f2e5;
  --red:#c0392b; --red-soft:#fbe5e2;
  --yellow:#f2b705; --yellow-soft:#fdf5d6;
  --purple:#7b3fa0; --purple-soft:#f1e7f7;
  --ink:#1d2733; --muted:#5b6876; --line:#c9d6e3;
  --paper:#fbfcfe; --card:#ffffff; --grid:rgba(31,111,178,.07);
  --radius:12px;
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-head:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:var(--font-body); color:var(--ink); font-size:17px; line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
h1,h2,h3,h4{font-family:var(--font-head); color:var(--navy); line-height:1.15; margin:0 0 .5em; letter-spacing:.01em}
h1{font-size:2.2rem} h2{font-size:1.75rem} h3{font-size:1.3rem} h4{font-size:1.1rem}
p{margin:0 0 .8em}
button{font:inherit; cursor:pointer}
button:focus-visible, summary:focus-visible, select:focus-visible, input:focus-visible{outline:3px solid var(--orange); outline-offset:2px}
.wrap{max-width:1040px; margin:0 auto; padding:0 16px}

/* ---------- header / nav ---------- */
header.top{background:var(--navy); color:#fff; position:sticky; top:0; z-index:20; box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top-row{display:flex; align-items:center; gap:12px; padding:10px 0; flex-wrap:wrap}
.brand{display:flex; flex-direction:column; flex:1; min-width:200px}
.brand small{opacity:.8; font-size:.8rem; letter-spacing:.04em; text-transform:uppercase}
.brand b{font-family:var(--font-head); font-size:1.25rem; letter-spacing:.02em}
.lang{display:flex; border:2px solid rgba(255,255,255,.6); border-radius:999px; overflow:hidden}
.lang button{background:transparent; color:#fff; border:0; padding:6px 14px; font-weight:700; font-size:.95rem}
.lang button[aria-pressed="true"]{background:var(--orange); color:#fff}
.lang-badge{display:none; border:2px solid rgba(255,255,255,.6); border-radius:999px; padding:5px 14px; font-weight:700; font-size:.95rem; color:#fff}
body.lang-locked .lang{display:none}
.key-btn{background:var(--orange); color:#fff; border:0; border-radius:999px; padding:7px 14px; font-weight:700; font-size:.95rem}
.teacher-badge{border:2px solid #ffd27a; color:#ffd27a; border-radius:999px; padding:5px 12px; font-weight:700; font-size:.9rem}
.code-panel{background:#fff; color:var(--ink); border-radius:12px; padding:12px 14px; margin:0 0 10px; box-shadow:0 4px 14px rgba(0,0,0,.2)}
.code-panel label{font-weight:700; color:var(--navy); display:block; margin-bottom:6px}
.code-panel input{font-family:ui-monospace,Consolas,monospace; font-size:1.2rem; letter-spacing:.15em; text-transform:uppercase; width:12ch; min-width:0}
.code-msg{margin-top:6px; font-weight:700}
.code-msg.ok{color:var(--green)} .code-msg.ko{color:var(--red)}
.locked-sec{display:flex; align-items:center; gap:12px; background:#f1f4f8; border:1px dashed var(--line); border-radius:var(--radius); padding:14px 18px; margin-bottom:10px; color:var(--muted)}
.locked-sec .num{flex:none; width:34px; height:34px; border-radius:8px; background:#c3cdd8; color:#fff; display:grid; place-items:center; font-family:var(--font-head); font-size:1.1rem}
.locked-sec b{font-family:var(--font-head); font-size:1.25rem; color:#7a8794}
.fcard.locked{opacity:.6}
.lock-card{text-align:center; max-width:640px; margin:20px auto}
.lock-card .big{font-size:2.6rem}
.prog-row{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 4px}
.prog-row span{width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-weight:700; font-size:.85rem; background:#e7ecf2; color:#8a97a4}
.prog-row span.on{background:var(--green); color:#fff}
.nb-box{border:2px solid var(--purple); background:var(--purple-soft); border-radius:10px; padding:10px 14px; margin:14px 0 4px}
.nb-box h4{margin:0 0 6px; color:var(--purple)}
.nb-box ul{margin:0; padding-left:1.2em}
.nb-box .nbt{display:inline-block; font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; border-radius:6px; padding:1px 7px; margin-right:6px; background:#fff; color:var(--purple); border:1px solid var(--purple)}
.codes-tbl td.code{font-family:ui-monospace,Consolas,monospace; font-weight:700; font-size:1.1rem; letter-spacing:.12em}
.notes.bw .nb-box{background:#fff}
body.lang-locked .lang-badge{display:inline-block}
.es-help{margin:0 0 12px}
nav.tabs{display:flex; gap:4px; overflow-x:auto; padding-bottom:8px; scrollbar-width:thin}
nav.tabs a{color:#dbe7f5; text-decoration:none; padding:7px 12px; border-radius:8px; white-space:nowrap; font-weight:700; font-size:.95rem}
nav.tabs a:hover{background:rgba(255,255,255,.12); color:#fff}
nav.tabs a[aria-current="page"]{background:#fff; color:var(--navy)}

main{padding:24px 0 60px}
.view{display:none}
.view.active{display:block}

/* ---------- generic ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:0 1px 3px rgba(22,54,92,.06)}
.btn{display:inline-flex; align-items:center; gap:6px; border:2px solid var(--navy); background:var(--navy); color:#fff; padding:9px 16px; border-radius:10px; font-weight:700; font-size:.98rem; text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:#fff; color:var(--navy)}
.btn.orange{background:var(--orange); border-color:var(--orange)}
.btn.green{background:var(--green); border-color:var(--green)}
.btn.red{background:var(--red); border-color:var(--red)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.muted{color:var(--muted)}
label.field{display:flex; flex-direction:column; gap:4px; font-weight:700; font-size:.92rem; color:var(--navy); max-width:100%; min-width:0}
select,input[type=text]{font:inherit; padding:8px 10px; border:2px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); min-width:180px; max-width:100%}
.tag{display:inline-block; font-family:var(--font-head); font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:.85rem; padding:2px 10px; border-radius:6px; background:var(--blue-soft); color:var(--blue)}
.tag.orange{background:var(--orange-soft); color:#a34d00}
.tag.green{background:var(--green-soft); color:var(--green)}
.progress{height:10px; background:var(--blue-soft); border-radius:999px; overflow:hidden}
.progress > span{display:block; height:100%; background:var(--orange); width:0; transition:width .25s}

/* ---------- home ---------- */
.hero{display:grid; gap:18px; grid-template-columns:1.3fr 1fr; align-items:center; margin-bottom:24px}
.hero h1{font-size:2.6rem}
.hero .formula-mini{font-family:var(--font-head); font-size:1.6rem; color:var(--navy)}
.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px}
.mode{display:flex; flex-direction:column; gap:6px; text-decoration:none; color:inherit; border-top:6px solid var(--blue)}
.mode:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(22,54,92,.12)}
.mode .ico{font-size:1.8rem}
.mode h3{margin:0}
.mode.c2{border-top-color:var(--orange)} .mode.c3{border-top-color:var(--green)} .mode.c4{border-top-color:var(--red)} .mode.c5{border-top-color:var(--purple)}

/* ---------- contents (accordion) ---------- */
.acc-tools{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
details.sec{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px; overflow:hidden}
details.sec > summary{list-style:none; cursor:pointer; padding:14px 18px; display:flex; align-items:center; gap:12px; font-family:var(--font-head); font-size:1.35rem; font-weight:700; color:var(--navy)}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary .num{flex:none; width:34px; height:34px; border-radius:8px; background:var(--navy); color:#fff; display:grid; place-items:center; font-size:1.1rem}
details.sec > summary::after{content:"+"; margin-left:auto; font-size:1.6rem; color:var(--orange); font-family:var(--font-body)}
details.sec[open] > summary::after{content:"–"}
details.sec[open] > summary{border-bottom:1px solid var(--line); background:var(--blue-soft)}
.sec-body{padding:16px 20px 20px}

/* ---------- content blocks (shared by screen + print) ---------- */
.doc h3{margin-top:1.1em; color:var(--blue)}
.doc ul,.doc ol{margin:0 0 .9em; padding-left:1.3em}
.doc li{margin-bottom:.25em}
.doc table{width:100%; border-collapse:collapse; margin:0 0 1em; font-size:.95rem; background:#fff}
.doc th,.doc td{border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top}
.doc th{background:var(--navy); color:#fff; font-weight:700}
.doc tr:nth-child(even) td{background:#f5f8fc}
.tbl-scroll{overflow-x:auto}
.key{border-left:6px solid var(--orange); background:var(--orange-soft); padding:10px 14px; border-radius:8px; margin:0 0 1em}
.key b:first-child{color:#a34d00}
.note{border-left:6px solid var(--blue); background:var(--blue-soft); padding:10px 14px; border-radius:8px; margin:0 0 1em}
.activity{border:2px dashed var(--orange); border-radius:10px; padding:12px 16px; margin:0 0 1em; background:#fffaf4}
.activity > .tag{margin-bottom:6px}
.activity h4{margin:.2em 0 .4em}
details.sol{margin-top:8px}
details.sol > summary{cursor:pointer; font-weight:700; color:var(--green)}
.sol-print{display:none; margin-top:8px; border-top:1px solid var(--line); padding-top:6px}
.sol-print b.sl{color:var(--green)}
.formula{display:flex; flex-wrap:wrap; align-items:stretch; gap:8px; margin:0 0 1em}
.formula .fx{flex:1 1 130px; border-radius:10px; padding:10px; text-align:center; border:2px solid}
.formula .fx b{display:block; font-family:var(--font-head); font-size:1.45rem}
.formula .op{align-self:center; font-family:var(--font-head); font-size:2rem; font-weight:700; color:var(--navy)}
.fx.c{border-color:var(--blue); background:var(--blue-soft)} .fx.c b{color:var(--blue)}
.fx.t{border-color:var(--green); background:var(--green-soft)} .fx.t b{color:var(--green)}
.fx.h{border-color:var(--orange); background:var(--orange-soft)} .fx.h b{color:#b85600}
.fx.r{border-color:var(--purple); background:var(--purple-soft)} .fx.r b{color:var(--purple)}
.twocol{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:1em}
.box{border:2px solid var(--line); border-radius:10px; padding:10px 14px; background:#fff}
.box h4{margin-top:0}
.box.blue{border-color:var(--blue)} .box.blue h4{color:var(--blue)}
.box.orange{border-color:var(--orange)} .box.orange h4{color:#b85600}
.box.green{border-color:var(--green)} .box.green h4{color:var(--green)}
.box.red{border-color:var(--red)} .box.red h4{color:var(--red)}
.box.yellow{border-color:var(--yellow)} .box.yellow h4{color:#8a6900}
.box.purple{border-color:var(--purple)} .box.purple h4{color:var(--purple)}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:1em}
.grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:1em}
.mantra{font-family:var(--font-head); font-size:1.3rem; font-weight:700; text-align:center; background:var(--yellow-soft); border:3px solid var(--yellow); border-radius:10px; padding:10px; margin:0 0 1em; color:var(--ink)}
.steps{counter-reset:st; list-style:none; padding:0!important}
.steps li{counter-increment:st; position:relative; padding:6px 0 6px 44px; min-height:42px; margin:0!important; border-bottom:1px dashed var(--line)}
.steps li::before{content:counter(st); position:absolute; left:0; top:6px; width:30px; height:30px; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:700; font-size:.95rem}
.fig{margin:0 0 1em; text-align:center}
.fig svg{max-width:100%; height:auto}
.fig figcaption{font-size:.88rem; color:var(--muted)}
.quote{font-family:var(--font-head); font-size:1.4rem; text-align:center; color:var(--navy); border:3px solid var(--navy); border-radius:12px; padding:12px 16px; margin:1em 0}

/* circuit widget */
.circuit{list-style:none; padding:0!important; margin:8px 0}
.circuit li{display:flex; align-items:center; gap:8px; background:#f3e3c8; border:1px solid #d9bf95; border-radius:8px; padding:7px 8px; margin-bottom:6px!important}
.circuit li .pos{flex:none; width:28px; height:28px; border-radius:6px; background:#fff; border:2px solid #b38b4d; display:grid; place-items:center; font-weight:700}
.circuit li .txt{flex:1}
.circuit li button{border:1px solid #b38b4d; background:#fff; border-radius:6px; width:34px; height:30px; font-weight:700}
.circuit li.ok{background:var(--green-soft); border-color:var(--green)}
.circuit li.bad{background:var(--red-soft); border-color:var(--red)}
.circuit-static{list-style:none; padding:0!important}
.circuit-static li{display:flex; gap:10px; align-items:center; margin-bottom:6px!important}
.circuit-static .blank{flex:none; width:30px; height:26px; border:2px solid var(--ink); border-radius:4px}

/* ---------- flashcards ---------- */
.fc-stage{perspective:1400px; margin:14px auto; max-width:720px}
.fc{display:grid; cursor:pointer; transition:transform .5s; transform-style:preserve-3d; min-height:280px}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:16px; padding:28px 26px; display:flex; flex-direction:column; justify-content:center; gap:10px; border:2px solid var(--navy); background:#fff; box-shadow:0 6px 18px rgba(22,54,92,.12)}
.fc-face.back{transform:rotateY(180deg); background:var(--green-soft); border-color:var(--green)}
.fc-face .lbl{font-family:var(--font-head); text-transform:uppercase; letter-spacing:.08em; font-size:.85rem; color:var(--muted)}
.fc-face .big{font-size:1.35rem; font-weight:700; color:var(--navy)}
.fc-face.back .big{color:var(--green)}
.fc-face .hint{font-size:.85rem; color:var(--muted); margin-top:auto}
.fc-nav{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; max-width:720px; margin:0 auto}

/* ---------- quiz ---------- */
.q-card{max-width:780px; margin:0 auto}
.q-meta{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:.9rem; color:var(--muted); margin-bottom:8px}
.q-text{font-size:1.25rem; font-weight:700; color:var(--navy); margin-bottom:14px}
.opts{display:flex; flex-direction:column; gap:8px}
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; border:2px solid var(--line); background:#fff; border-radius:10px; padding:10px 14px; color:var(--ink); font-size:1rem}
.opt .lt{flex:none; width:28px; height:28px; border-radius:50%; background:var(--blue-soft); color:var(--blue); display:grid; place-items:center; font-weight:700}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--blue)}}
.opt.sel{border-color:var(--blue); background:var(--blue-soft)}
.opt.sel .lt{background:var(--blue); color:#fff}
.opt.right{border-color:var(--green); background:var(--green-soft)}
.opt.right .lt{background:var(--green); color:#fff}
.opt.wrong{border-color:var(--red); background:var(--red-soft)}
.opt.wrong .lt{background:var(--red); color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:12px; padding:10px 14px; border-radius:10px; font-size:.98rem}
.fb.ok{background:var(--green-soft); border-left:6px solid var(--green)}
.fb.ko{background:var(--red-soft); border-left:6px solid var(--red)}
.dots{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0}
.dots button{width:34px; height:34px; border-radius:8px; border:2px solid var(--line); background:#fff; font-weight:700; font-size:.85rem; color:var(--ink)}
.dots button.ans{background:var(--blue-soft); border-color:var(--blue)}
.dots button.cur{border-color:var(--orange); box-shadow:0 0 0 2px var(--orange)}
.score-big{font-family:var(--font-head); font-size:4rem; font-weight:700; line-height:1; color:var(--navy)}
.score-wrap{display:flex; gap:24px; align-items:center; flex-wrap:wrap}
.review-item{border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:8px; background:#fff}
.review-item.ok{border-left:6px solid var(--green)}
.review-item.ko{border-left:6px solid var(--red)}
.review-item.part{border-left:6px solid var(--yellow)}
.fb.part{background:var(--yellow-soft); border-left:6px solid var(--yellow)}
.fill-text{font-size:1.15rem; line-height:2.2; color:var(--ink)}
input.blank{font:inherit; font-weight:700; width:12ch; max-width:100%; padding:2px 8px; border:0; border-bottom:3px solid var(--blue); background:var(--blue-soft); border-radius:6px 6px 0 0; color:var(--navy); text-align:center}
input.blank.right{border-color:var(--green); background:var(--green-soft)}
input.blank.wrong{border-color:var(--red); background:var(--red-soft)}
.match{display:flex; flex-direction:column; gap:8px}
.match-row{display:grid; grid-template-columns:1fr minmax(200px,1fr); gap:8px; align-items:center; border:2px solid var(--line); border-radius:10px; padding:8px 10px; background:#fff}
.match-row select{min-width:0; width:100%}
.match-row.right{border-color:var(--green); background:var(--green-soft)}
.match-row.wrong{border-color:var(--red); background:var(--red-soft)}
.match-row .mfix{grid-column:1/-1; color:var(--green); font-weight:700; font-size:.92rem}
textarea.open-ans{width:100%; font:inherit; padding:10px 12px; border:2px solid var(--line); border-radius:10px; resize:vertical; min-height:120px}
textarea.open-ans:focus{border-color:var(--blue); outline:none}
ul.ideas{list-style:none; padding-left:0; margin:4px 0 8px}
ul.ideas li.yes{color:var(--green)} ul.ideas li.no{color:var(--red)}
.fc-list{font-size:.95rem; color:var(--ink)}
.bank-q .fc-list{font-size:.9rem; color:var(--muted)}
.stats{display:flex; gap:14px; flex-wrap:wrap; font-weight:700}
.stats span{background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 12px}

/* ---------- notes (apuntes) ---------- */
.print-controls{margin-bottom:18px}
.print-controls fieldset{border:0; padding:0; margin:0; display:flex; gap:14px; flex-wrap:wrap}
.print-controls legend{font-weight:700; color:var(--navy); margin-bottom:4px}
.print-controls label{display:flex; gap:6px; align-items:center}
.notes{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:28px 34px}
.notes .cover{text-align:center; border-bottom:4px solid var(--navy); padding-bottom:18px; margin-bottom:18px}
.notes .cover h1{font-size:2.3rem; margin-bottom:.2em}
.notes .cover .sub{font-size:1.05rem; color:var(--muted)}
.notes .student{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:14px; font-weight:700}
.notes .student span{border-bottom:1.5px solid var(--ink); min-width:220px; display:inline-block; text-align:left}
.notes .toc ol{columns:2; column-gap:30px}
.notes section.nsec{margin-top:26px}
.notes section.nsec > h2{border-bottom:3px solid var(--orange); padding-bottom:4px}
.notes section.nsec > h2 .n{color:var(--orange)}
.bank-q{margin-bottom:8px; break-inside:avoid}
.bank-q b{color:var(--navy)}
.notes.show-sol .sol-print{display:block}


/* ---------- fichas ---------- */
.fgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:16px}
.fcard{display:flex; flex-direction:column; gap:6px; border-top:6px solid var(--line)}
.fcard h3{margin:0}
.fcard .btn{margin-top:auto; align-self:flex-start}
.fcard.st-doing{border-top-color:var(--yellow)} .fcard.st-pass{border-top-color:var(--blue)} .fcard.st-done{border-top-color:var(--green)}
.fnum{font-family:var(--font-head); font-weight:700; color:var(--orange); text-transform:uppercase; letter-spacing:.06em}
.fstat{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:.92rem}
.chip{font-size:.8rem; font-weight:700; padding:2px 10px; border-radius:999px; background:#eef2f6; color:var(--muted)}
.chip.doing{background:var(--yellow-soft); color:#8a6900} .chip.pass{background:var(--blue-soft); color:var(--blue)} .chip.done{background:var(--green-soft); color:var(--green)}
.step-h{display:flex; align-items:center; gap:10px; margin-top:22px}
.step-h span{display:grid; place-items:center; width:32px; height:32px; border-radius:50%; background:var(--orange); color:#fff; font-size:1.1rem}
.fq{margin-bottom:12px}
.fq.locked{border-color:var(--green); background:#f6fbf7}
.fq-head{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.fq-n{display:grid; place-items:center; width:28px; height:28px; border-radius:8px; background:var(--navy); color:#fff; font-weight:700}
.qstat{margin-left:auto; font-weight:700; font-size:.92rem}
.qstat.ok{color:var(--green)} .qstat.part{color:#8a6900} .qstat.ko{color:var(--red)}
.fsum{border-left:6px solid var(--orange)}
.print-only{display:none}
.rep-head h1{font-size:1.8rem; margin:.1em 0 .4em}
.rep-top{display:flex; gap:18px; align-items:flex-start; margin-bottom:12px}
.rep-data{border-collapse:collapse; flex:1}
.rep-data th,.rep-data td{border:1px solid #999; padding:4px 8px; text-align:left; font-size:.92rem}
.rep-data th{background:#eef2f6; width:42%}
.rep-code{width:190px; text-align:center}
.rep-code svg{width:170px; height:170px}
.rep-code .code{font-family:ui-monospace,Consolas,monospace; font-weight:700; font-size:.82rem; word-break:break-all; margin:4px 0}
/* ---------- paper sheets ---------- */
.paper-head{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-end; border-bottom:3px solid var(--navy); padding-bottom:8px; margin-bottom:12px}
.paper-head .student{display:flex; gap:14px; flex-wrap:wrap; font-weight:700; font-size:.92rem}
.paper-head .student span{display:inline-block; border-bottom:1.5px solid var(--ink); min-width:200px}
.paper + .paper{margin-top:40px; border-top:2px dashed var(--line); padding-top:24px}
.gsec{background:#eef2f6!important}
.cbox{display:inline-block; flex:none; width:18px; height:18px; border:2px solid var(--ink); border-radius:3px; vertical-align:middle; margin-right:6px}
.cbox.wide{width:30px}
.pq{margin:0 0 14px; break-inside:avoid}
.pq-h{margin-bottom:6px}
.pq-opts{list-style:none; padding-left:6px!important}
.pq-opts li{margin-bottom:5px!important}
.pq-tf{display:flex; gap:30px; padding-left:6px}
.pq-match{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.pq-match ul{list-style:none; padding-left:4px!important}
.pq-fill{line-height:2.4}
.pgap{display:inline-block; min-width:130px; border-bottom:1.5px solid var(--ink)}
.plines div{border-bottom:1px solid #999; height:30px}
.paper-text{border:1px solid var(--line); border-radius:8px; padding:6px 14px; margin-bottom:14px}
.notes.bw .gsec, .notes.bw .rep-data th{background:#fff!important}

/* B/N (black & white) mode — screen preview + print */
.notes.bw, .notes.bw *{
  --navy:#000; --blue:#000; --blue-soft:#fff; --orange:#000; --orange-soft:#fff;
  --green:#000; --green-soft:#fff; --red:#000; --red-soft:#fff; --yellow:#000; --yellow-soft:#fff;
  --purple:#000; --purple-soft:#fff; --ink:#000; --muted:#333; --line:#777;
}
.notes.bw .doc th{background:#fff; color:#000; border-bottom:2px solid #000}
.notes.bw .doc tr:nth-child(even) td{background:#fff}
.notes.bw .activity{background:#fff}
.notes.bw .circuit-static li, .notes.bw .tag{background:#fff; border:1px solid #000; color:#000}
.notes.bw .steps li::before{background:#fff; color:#000; border:2px solid #000}
.notes.bw .key b:first-child, .notes.bw .fx b, .notes.bw .box h4{color:#000}

.footer{font-size:.85rem; color:var(--muted); text-align:center; padding:20px 0}

@media (max-width:760px){
  body{font-size:16px}
  header.top{position:static}
  .brand b{font-size:1.1rem}
  .hero{grid-template-columns:1fr}
  .hero h1{font-size:2rem}
  .twocol,.grid2,.grid3,.pq-match{grid-template-columns:1fr}
  .rep-top{flex-direction:column}
  .match-row{grid-template-columns:1fr}
  .notes{padding:18px 16px}
  .notes .toc ol{columns:1}
  .score-big{font-size:3rem}
}

@media print{
  @page{size:A4; margin:14mm 13mm}
  body{background:#fff!important; font-size:11pt; line-height:1.45}
  header.top, .no-print, .footer{display:none!important}
  main{padding:0}
  .wrap{max-width:none; padding:0}
  .card, .notes{border:0!important; box-shadow:none!important; padding:0!important}
  .notes:not(.bw){-webkit-print-color-adjust:exact; print-color-adjust:exact}
  .notes .cover{break-after:page}
  h2,h3,h4{break-after:avoid}
  .activity,.key,.note,.box,.fig,.formula,.mantra,.quote,tr,.review-item{break-inside:avoid}
  .tbl-scroll{overflow:visible}
  a{color:inherit; text-decoration:none}
  .review-item, .result-print *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  .print-only{display:block!important}
  .paper + .paper{break-before:page; margin-top:0; border-top:0; padding-top:0}
  .rep-code svg{width:150px; height:150px}
}

const EG_TXT = "font-family:var(--font-body);fill:var(--ink)";
function egDinSVG(L){
  const k = 560/1189, W = 1189*k, H = 841*k, x0 = 10, y0 = 10;
  const R = (x,y,w,h,lab,dim)=>`<rect x="${(x0+x*k).toFixed(1)}" y="${(y0+y*k).toFixed(1)}" width="${(w*k).toFixed(1)}" height="${(h*k).toFixed(1)}" style="fill:var(--card,#fff);stroke:var(--navy);stroke-width:2"/>

    <text x="${S(50,85)[0].toFixed(1)}" y="${(S(0,85)[1]-6).toFixed(1)}" text-anchor="middle" style="font:700 13px var(--font-head);fill:#b85600">${t[2]}</text>

{ id:"why", es:{ title:"¿Para qué sirve el dibujo técnico?", html:()=>`
<p>Antes de fabricar cualquier objeto, alguien tiene que <b>dibujarlo</b>. El <b>dibujo técnico</b> es un <b>lenguaje gráfico universal</b>: permite representar objetos con precisión para que cualquier persona, hable el idioma que hable, pueda entenderlos y fabricarlos.</p>
<div class="key"><b>Recuerda:</b> el dibujo técnico sirve para <b>diseñar</b>, <b>fabricar</b>, <b>montar</b> y <b>comunicar</b> objetos.</div>
<div class="grid2">
  <div class="box blue"><h4>Dibujo artístico</h4><ul><li>Expresa ideas, sentimientos o emociones.</li><li>Es libre y personal: cada autor dibuja a su manera.</li><li>No necesita medidas exactas.</li></ul></div>
  <div class="box orange"><h4>Dibujo técnico</h4><ul><li>Representa objetos para poder fabricarlos.</li><li>Es objetivo y preciso: todos lo interpretan igual.</li><li>Sigue unas <b>normas</b> comunes (normalización) y lleva medidas.</li></ul></div>
</div>
<p>Las normas del dibujo técnico (tipos de línea, formatos de papel, forma de acotar…) son iguales en muchos países. Por eso se dice que es un idioma universal: un plano dibujado en Murcia se puede fabricar en Japón.</p>
<div class="note"><b>Relación con el proceso tecnológico:</b> el dibujo aparece en las fases de <b>generar ideas</b> (bocetos) y <b>diseñar y planificar</b> (croquis y planos), y forma parte de la documentación del proyecto.</div>
<div class="activity"><span class="tag orange">Actividad</span>
  <h4>¿Artístico o técnico?</h4>

</div>
`}, en:{ title:"What is technical drawing for?", html:()=>`
<p>Before any object is made, someone has to <b>draw</b> it. <b>Technical drawing</b> is a <b>universal graphic language</b>: it lets us represent objects precisely so that anyone, whatever language they speak, can understand and make them.</p>
<div class="key"><b>Remember:</b> technical drawing is used to <b>design</b>, <b>make</b>, <b>assemble</b> and <b>communicate</b> objects.</div>
<div class="grid2">
  <div class="box blue"><h4>Artistic drawing</h4><ul><li>Expresses ideas, feelings or emotions.</li><li>It is free and personal: each artist draws in their own way.</li><li>It does not need exact measurements.</li></ul></div>
  <div class="box orange"><h4>Technical drawing</h4><ul><li>Represents objects so they can be made.</li><li>It is objective and precise: everyone reads it the same way.</li><li>It follows common <b>standards</b> (standardisation) and includes measurements.</li></ul></div>
</div>
<p>The standards of technical drawing (line types, paper sizes, how to dimension…) are the same in many countries. That is why it is called a universal language: a drawing made in Murcia can be manufactured in Japan.</p>
<div class="note"><b>Link with the technological process:</b> drawing appears in the stages of <b>generating ideas</b> (sketches) and <b>designing and planning</b> (dimensioned sketches and drawings), and it is part of the project documentation.</div>
<div class="activity"><span class="tag orange">Activity</span>
  <h4>Artistic or technical?</h4>
  <p>Classify: <b>a portrait of your family · the drawing of a table with measurements · a comic · the assembly instructions of a piece of furniture</b>.</p>
  <details class="sol"><summary>Show solution</summary><ul><li>Portrait: artistic.</li><li>Drawing of a table: technical.</li><li>Comic: artistic.</li><li>Assembly instructions: technical.</li></ul></details>
</div>
`}},

{ id:"steps", es:{ title:"Boceto, croquis y dibujo técnico", html:()=>`
<p>Para pasar de una idea a un objeto fabricado hacemos <b>tres tipos de dibujo</b>, cada uno más preciso que el anterior:</p>
<div class="tbl-scroll"><table>
<tr><th>Dibujo</th><th>Cómo se hace</th><th>¿Lleva medidas?</th><th>Para qué sirve</th></tr>
<tr><td><b>1. Boceto</b></td><td>Rápido, a mano alzada (sin regla).</td><td>No.</td><td>Plasmar la idea principal y comparar varias ideas.</td></tr>
<tr><td><b>2. Croquis</b></td><td>A mano alzada, pero cuidando las proporciones.</td><td><b>Sí</b>: lleva todas las medidas (cotas).</td><td>Tener la información necesaria para fabricar o para hacer el plano.</td></tr>
<tr><td><b>3. Dibujo técnico (plano)</b></td><td>Con instrumentos de dibujo o con ordenador (CAD).</td><td>Sí, exactas y normalizadas.</td><td>Fabricar el objeto con precisión y archivarlo en la documentación.</td></tr>
</table></div>
<div class="key"><b>Truco para no confundirlos:</b> el <b>b</b>oceto es <b>b</b>reve (sin medidas); el <b>c</b>roquis lleva <b>c</b>otas (medidas).</div>
<div class="note"><b>Atención:</b> en algunos materiales verás estos nombres al revés. En esta asignatura usamos siempre esta definición: el <b>croquis siempre lleva medidas</b>.</div>
<div class="activity"><span class="tag orange">Actividad</span>
  <h4>Ordena el camino</h4>
  <p>Una alumna quiere hacer un portalápices. ¿En qué orden hará estos dibujos? <b>Plano hecho con regla y escuadra · tres ideas rápidas en una hoja · dibujo a mano alzada con todas las medidas</b>.</p>
  <details class="sol"><summary>Ver solución</summary><ol><li>Tres ideas rápidas: bocetos.</li><li>Dibujo a mano alzada con medidas: croquis.</li><li>Plano con instrumentos: dibujo técnico.</li></ol></details>
</div>
`}, en:{ title:"Sketch, dimensioned sketch and technical drawing", html:()=>`
<p>To go from an idea to a finished object we make <b>three kinds of drawing</b>, each more precise than the one before:</p>
<div class="tbl-scroll"><table>
<tr><th>Drawing</th><th>How it is made</th><th>Measurements?</th><th>What it is for</th></tr>
<tr><td><b>1. Sketch</b> (boceto)</td><td>Quick, freehand (no ruler).</td><td>No.</td><td>To capture the main idea and compare several ideas.</td></tr>
<tr><td><b>2. Dimensioned sketch</b> (croquis)</td><td>Freehand, but keeping the proportions.</td><td><b>Yes</b>: it has all the measurements (dimensions).</td><td>To have the information needed to make the object or to draw the plan.</td></tr>
<tr><td><b>3. Technical drawing (plan)</b></td><td>With drawing instruments or with a computer (CAD).</td><td>Yes, exact and standardised.</td><td>To make the object precisely and keep it in the documentation.</td></tr>
</table></div>
<div class="key"><b>Tip:</b> a <b>sketch</b> is <b>short and quick</b> (no measurements); a <b>dimensioned sketch</b> has <b>dimensions</b> (measurements).</div>
<div class="note"><b>Watch out:</b> some materials swap the Spanish names. In this subject we always use this definition: the <b>dimensioned sketch (croquis) always has measurements</b>.</div>
<div class="activity"><span class="tag orange">Activity</span>
  <h4>Put the path in order</h4>
  <p>A student wants to make a pencil holder. In what order will she make these drawings? <b>A plan drawn with a ruler and set squares · three quick ideas on a sheet · a freehand drawing with all the measurements</b>.</p>
  <details class="sol"><summary>Show solution</summary><ol><li>Three quick ideas: sketches.</li><li>Freehand drawing with measurements: dimensioned sketch.</li><li>Plan with instruments: technical drawing.</li></ol></details>
</div>
`}},
/* 3 ------------------------------------------------------------------ */
{ id:"instr", es:{ title:"Instrumentos de dibujo", html:()=>`
<p>Para que un dibujo técnico sea preciso necesitamos <b>instrumentos de dibujo</b>:</p>
<figure class="fig">${egInstrSVG("es")}</figure>
<div class="tbl-scroll"><table>
<tr><th>Instrumento</th><th>Para qué sirve</th></tr>
<tr><td><b>Regla</b></td><td>Trazar líneas rectas y medir longitudes (está graduada en centímetros y milímetros).</td></tr>
<tr><td><b>Escuadra</b></td><td>Triángulo con ángulos de 90°, 45° y 45°. Sirve para trazar líneas a 45° y comprobar ángulos rectos (90°).</td></tr>
<tr><td><b>Cartabón</b></td><td>Triángulo con ángulos de 90°, 60° y 30°. Sirve para trazar líneas a 30° y 60° y comprobar ángulos.</td></tr>
<tr><td><b>Compás</b></td><td>Dibujar circunferencias y arcos, y trasladar medidas.</td></tr>
<tr><td><b>Transportador de ángulos</b></td><td>Medir y dibujar ángulos en grados.</td></tr>
<tr><td><b>Lápices, goma y sacapuntas</b></td><td>Lápiz duro (<b>H</b>): trazo fino y claro, para trazar. Lápiz medio (<b>HB</b>): para escribir y repasar. Lápiz blando (<b>B</b>): trazo oscuro, para bocetos.</td></tr>
</table></div>
<h3>Paralelas y perpendiculares con escuadra y cartabón</h3>
<ol class="steps">
  <li>Apoya el cartabón (o una regla) sobre el papel y sujétalo bien con una mano.</li>
  <li>Coloca la escuadra apoyada en el cartabón.</li>
  <li>Desliza la escuadra a lo largo del cartabón y traza líneas: todas saldrán <b>paralelas</b>.</li>
  <li>Si giras la escuadra y apoyas su otro cateto, trazarás líneas <b>perpendiculares</b> (a 90°) a las anteriores.</li>
</ol>
<div class="key"><b>Ángulos combinando escuadra y cartabón:</b> 45° − 30° = <b>15°</b> · 45° + 30° = <b>75°</b> · 60° + 45° = <b>105°</b> · 90° + 30° = <b>120°</b> · 90° + 45° = <b>135°</b> · 90° + 60° = <b>150°</b>.</div>
<div class="activity"><span class="tag orange">Actividad</span>
  <h4>¿Qué instrumento usarías?</h4>
  <ol><li>Dibujar la rueda de una bicicleta.</li><li>Comprobar que una esquina mide 90°.</li><li>Medir el largo de tu goma.</li><li>Trazar una línea a 60°.</li></ol>
  <details class="sol"><summary>Ver solución</summary><ol><li>El compás.</li><li>La escuadra (o el cartabón).</li><li>La regla.</li><li>El cartabón.</li></ol></details>
</div>
`}, en:{ title:"Drawing instruments", html:()=>`
<p>To make a technical drawing precise we need <b>drawing instruments</b>:</p>
<figure class="fig">${egInstrSVG("en")}</figure>
<div class="tbl-scroll"><table>
<tr><th>Instrument</th><th>What it is for</th></tr>
<tr><td><b>Ruler</b></td><td>Drawing straight lines and measuring lengths (it is marked in centimetres and millimetres).</td></tr>
<tr><td><b>45° set square</b> (escuadra)</td><td>Triangle with angles of 90°, 45° and 45°. Used to draw lines at 45° and check right angles (90°).</td></tr>
<tr><td><b>30°/60° set square</b> (cartabón)</td><td>Triangle with angles of 90°, 60° and 30°. Used to draw lines at 30° and 60° and check angles.</td></tr>
<tr><td><b>Compass</b></td><td>Drawing circles and arcs, and transferring measurements.</td></tr>
<tr><td><b>Protractor</b></td><td>Measuring and drawing angles in degrees.</td></tr>
<tr><td><b>Pencils, eraser and sharpener</b></td><td>Hard pencil (<b>H</b>): thin, light line, for construction lines. Medium pencil (<b>HB</b>): for writing and going over lines. Soft pencil (<b>B</b>): dark line, for sketches.</td></tr>
</table></div>
<h3>Parallel and perpendicular lines with set squares</h3>
<ol class="steps">
  <li>Place the 30°/60° set square (or a ruler) on the paper and hold it firmly with one hand.</li>
  <li>Put the 45° set square against it.</li>
  <li>Slide the 45° set square along the other one and draw lines: they will all be <b>parallel</b>.</li>
  <li>If you turn the set square and use its other side, you will draw lines <b>perpendicular</b> (at 90°) to the first ones.</li>
</ol>
<div class="key"><b>Angles by combining both set squares:</b> 45° − 30° = <b>15°</b> · 45° + 30° = <b>75°</b> · 60° + 45° = <b>105°</b> · 90° + 30° = <b>120°</b> · 90° + 45° = <b>135°</b> · 90° + 60° = <b>150°</b>.</div>
<div class="activity"><span class="tag orange">Activity</span>
  <h4>Which instrument would you use?</h4>
  <ol><li>Drawing the wheel of a bicycle.</li><li>Checking that a corner is 90°.</li><li>Measuring the length of your eraser.</li><li>Drawing a line at 60°.</li></ol>
  <details class="sol"><summary>Show solution</summary><ol><li>The compass.</li><li>The 45° set square (or the 30°/60° one).</li><li>The ruler.</li><li>The 30°/60° set square.</li></ol></details>
</div>
`}},

{ id:"din", es:{ title:"Formatos de papel DIN", html:()=>`
<p>Los planos se dibujan en hojas de tamaños normalizados: los <b>formatos DIN</b> (serie A). El más grande es el <b>A0</b>, que mide 841 × 1189 mm (su superficie es de 1 m²). Cada formato se obtiene <b>doblando el anterior por la mitad</b> por su lado más largo, y todos mantienen <b>la misma proporción</b>.</p>
<figure class="fig">${egDinSVG("es")}<figcaption>Al partir el A0 por la mitad sale el A1; al partir el A1, el A2… (medidas en mm)</figcaption></figure>
<div class="tbl-scroll"><table>
<tr><th>Formato</th><th>A0</th><th>A1</th><th>A2</th><th>A3</th><th>A4</th><th>A5</th></tr>
<tr><td><b>Medidas (mm)</b></td><td>841 × 1189</td><td>594 × 841</td><td>420 × 594</td><td>297 × 420</td><td>210 × 297</td><td>148 × 210</td></tr>
</table></div>
<div class="key"><b>Recuerda:</b> el formato más usado en el aula (y el de los folios) es el <b>A4: 210 × 297 mm</b>. Un A3 son dos A4; un A4 son dos A5.</div>
<h3>El margen y el cajetín</h3>
<p>En un plano se dibuja un <b>margen</b> (un recuadro a unos 10 mm del borde) y, en la esquina inferior derecha, el <b>cajetín</b>: un recuadro con los datos del plano.</p>
<div class="grid2">
  <div class="box green"><h4>Datos del cajetín</h4><ul><li>Título del plano (qué objeto es).</li><li>Nombre de quien lo dibuja y grupo.</li><li>Fecha.</li><li>Escala.</li><li>Número de plano.</li></ul></div>
  <div class="box blue"><h4>¿Por qué normalizar el papel?</h4><ul><li>Las hojas se pueden archivar, doblar y guardar igual.</li><li>Las impresoras y fotocopiadoras usan esos tamaños.</li><li>Ampliar o reducir de un formato a otro no deforma el dibujo.</li></ul></div>
</div>
`}, en:{ title:"DIN paper sizes", html:()=>`
<p>Drawings are made on sheets of standard sizes: the <b>DIN sizes</b> (A series). The largest is <b>A0</b>, which measures 841 × 1189 mm (its area is 1 m²). Each size is obtained by <b>folding the previous one in half</b> along its longer side, and they all keep <b>the same proportion</b>.</p>
<figure class="fig">${egDinSVG("en")}<figcaption>Cutting A0 in half gives A1; cutting A1 in half gives A2… (measurements in mm)</figcaption></figure>
<div class="tbl-scroll"><table>
<tr><th>Size</th><th>A0</th><th>A1</th><th>A2</th><th>A3</th><th>A4</th><th>A5</th></tr>
<tr><td><b>Measurements (mm)</b></td><td>841 × 1189</td><td>594 × 841</td><td>420 × 594</td><td>297 × 420</td><td>210 × 297</td><td>148 × 210</td></tr>
</table></div>
<div class="key"><b>Remember:</b> the size most used in class (and for ordinary paper) is <b>A4: 210 × 297 mm</b>. An A3 is two A4 sheets; an A4 is two A5 sheets.</div>
<h3>The border and the title block</h3>
<p>On a drawing we draw a <b>border</b> (a frame about 10 mm from the edge) and, in the bottom right corner, the <b>title block</b>: a box with the details of the drawing.</p>
<div class="grid2">
  <div class="box green"><h4>Title block details</h4><ul><li>Title of the drawing (what object it is).</li><li>Name of the person who draws it and class.</li><li>Date.</li><li>Scale.</li><li>Drawing number.</li></ul></div>
  <div class="box blue"><h4>Why standardise paper?</h4><ul><li>Sheets can be filed, folded and stored in the same way.</li><li>Printers and photocopiers use these sizes.</li><li>Enlarging or reducing from one size to another does not distort the drawing.</li></ul></div>
</div>
`}},

{ id:"lines", es:{ title:"Tipos de línea", html:()=>`
<p>En el dibujo técnico cada tipo de línea tiene un <b>significado</b>. Usar cada una en su sitio hace que el dibujo sea claro y que todos lo entiendan igual.</p>
<figure class="fig">${egLinesSVG("es")}</figure>
<div class="tbl-scroll"><table>
<tr><th>Línea</th><th>Se usa para</th></tr>
<tr><td><b>Continua gruesa</b></td><td>Contornos y aristas <b>visibles</b> del objeto.</td></tr>
<tr><td><b>Continua fina</b></td><td>Líneas de cota y líneas auxiliares de cota.</td></tr>
<tr><td><b>Discontinua fina</b></td><td>Aristas <b>ocultas</b>: las que existen pero no se ven desde ese punto de vista.</td></tr>
<tr><td><b>Trazo y punto fina</b></td><td><b>Ejes</b> de simetría y centros de circunferencias y agujeros.</td></tr>
</table></div>
<div class="key"><b>Recuerda:</b> lo que se ve, con línea gruesa; lo que no se ve, con discontinua; los ejes, con trazo y punto; las medidas, con línea fina.</div>
<div class="activity"><span class="tag orange">Actividad</span>
  <h4>Detective de líneas</h4>
  <p>Mira las vistas de la pieza del apartado «Las vistas de un objeto». ¿Qué tipo de línea aparece en el perfil izquierdo a 10 mm de altura? ¿Por qué?</p>
  <details class="sol"><summary>Ver solución</summary><p>Una línea discontinua: es la arista del escalón, que está detrás del bloque alto y no se ve desde la izquierda (arista oculta).</p></details>
</div>
`}, en:{ title:"Line types", html:()=>`
<p>In technical drawing each type of line has a <b>meaning</b>. Using each one in its place makes the drawing clear and everyone reads it the same way.</p>
<figure class="fig">${egLinesSVG("en")}</figure>
<div class="tbl-scroll"><table>
<tr><th>Line</th><th>Used for</th></tr>
<tr><td><b>Thick continuous</b></td><td><b>Visible</b> outlines and edges of the object.</td></tr>
<tr><td><b>Thin continuous</b></td><td>Dimension lines and extension lines.</td></tr>
<tr><td><b>Thin dashed</b></td><td><b>Hidden</b> edges: edges that exist but cannot be seen from that point of view.</td></tr>
<tr><td><b>Thin chain (dash-dot)</b></td><td>Axes of symmetry and centres of circles and holes.</td></tr>
</table></div>
<div class="key"><b>Remember:</b> what you can see, thick line; what you cannot see, dashed; axes, dash-dot; measurements, thin line.</div>
<div class="activity"><span class="tag orange">Activity</span>
  <h4>Line detective</h4>
  <p>Look at the views of the piece in the section “The views of an object”. What type of line appears in the left side view at a height of 10 mm? Why?</p>
  <details class="sol"><summary>Show solution</summary><p>A dashed line: it is the edge of the step, which is behind the tall block and cannot be seen from the left (hidden edge).</p></details>
</div>
`}},
/* 6 ------------------------------------------------------------------ */
{ id:"views", es:{ title:"Las vistas de un objeto", html:()=>`
<p>Un objeto tiene tres dimensiones (<b>anchura, altura y profundidad</b>), pero el papel solo tiene dos. Para representarlo con exactitud lo dibujamos visto desde distintas posiciones: son las <b>vistas</b>. Las tres principales son:</p>
<div class="grid3">
  <div class="box blue"><h4>Alzado</h4><p>Vista <b>de frente</b>. Se elige la cara que da más información. Muestra la anchura y la altura.</p></div>
  <div class="box green"><h4>Planta</h4><p>Vista <b>desde arriba</b>. Muestra la anchura y la profundidad.</p></div>
  <div class="box orange"><h4>Perfil izquierdo</h4><p>Vista <b>desde la izquierda</b>. Muestra la profundidad y la altura.</p></div>
</div>
<figure class="fig">${egViewsSVG("es")}<figcaption>Vistas de una pieza en el sistema europeo. La línea discontinua del perfil es una arista oculta.</figcaption></figure>
<p class="no-print"><a class="btn orange" href="#vistas3d">🧊 Practica en el Taller de vistas: gira piezas y dibuja sus vistas</a></p>
<h3>¿Dónde se coloca cada vista? (sistema europeo)</h3>
<ul>
  <li>El <b>alzado</b> se dibuja primero, arriba a la izquierda.</li>
  <li>La <b>planta</b> va <b>debajo</b> del alzado.</li>
  <li>El <b>perfil izquierdo</b> va a la <b>derecha</b> del alzado.</li>
</ul>
<div class="key"><b>Las vistas están alineadas:</b> el alzado y la planta tienen la misma anchura; el alzado y el perfil, la misma altura. Por eso se dibujan con líneas de referencia finas.</div>
<div class="activity"><span class="tag orange">Actividad</span>
  <h4>¿Qué ves desde cada lado?</h4>
  <p>Piensa en una lata de refresco de pie sobre la mesa. ¿Qué figura verías en el alzado? ¿Y en la planta?</p>
  <details class="sol"><summary>Ver solución</summary><p>Alzado: un rectángulo. Planta: una circunferencia (con su centro marcado con dos ejes de trazo y punto).</p></details>
</div>
`}, en:{ title:"The views of an object", html:()=>`
<p>An object has three dimensions (<b>width, height and depth</b>), but paper only has two. To represent it exactly we draw it seen from different positions: these are the <b>views</b>. The three main ones are:</p>
<div class="grid3">
  <div class="box blue"><h4>Front view</h4><p>The view <b>from the front</b>. We choose the face that gives the most information. It shows width and height.</p></div>
  <div class="box green"><h4>Top view (plan)</h4><p>The view <b>from above</b>. It shows width and depth.</p></div>
  <div class="box orange"><h4>Left side view</h4><p>The view <b>from the left</b>. It shows depth and height.</p></div>
</div>
<figure class="fig">${egViewsSVG("en")}<figcaption>Views of a piece in the European system (first-angle projection). The dashed line in the side view is a hidden edge.</figcaption></figure>
<p class="no-print"><a class="btn orange" href="#vistas3d">🧊 Practise in the Views lab: rotate pieces and draw their views</a></p>
<h3>Where does each view go? (European system)</h3>
<ul>
  <li>The <b>front view</b> is drawn first, at the top left.</li>
  <li>The <b>top view</b> goes <b>below</b> the front view.</li>
  <li>The <b>left side view</b> goes to the <b>right</b> of the front view.</li>
</ul>
<div class="key"><b>The views are lined up:</b> the front and top views have the same width; the front and side views have the same height. That is why they are drawn with thin reference lines.</div>
<div class="activity"><span class="tag orange">Activity</span>
  <h4>What do you see from each side?</h4>
  <p>Think of a soft-drink can standing on the table. What shape would you see in the front view? And in the top view?</p>
  <details class="sol"><summary>Show solution</summary><p>Front view: a rectangle. Top view: a circle (with its centre marked by two dash-dot axes).</p></details>
</div>
`}},
/* 7 ------------------------------------------------------------------ */
{ id:"persp", es:{ title:"La perspectiva", html:()=>`
<p>Las vistas son muy precisas, pero cuesta imaginar el objeto. La <b>perspectiva</b> representa el objeto <b>en un solo dibujo</b>, con sensación de volumen, tal como lo vería una persona. Las dos más usadas en el aula son:</p>
<figure class="fig">${egPerspSVG("es")}</figure>
<div class="grid2">
  <div class="box green"><h4>Perspectiva caballera</h4><ul><li>La cara de delante se dibuja <b>de frente y en su tamaño real</b>.</li><li>La profundidad se dibuja con líneas inclinadas a <b>45°</b>.</li><li>Las medidas de profundidad se <b>reducen</b> (normalmente a la mitad).</li></ul></div>
  <div class="box orange"><h4>Perspectiva isométrica</h4><ul><li>Se dibujan <b>tres ejes que forman 120°</b> entre sí (dos a 30° con la horizontal y uno vertical).</li><li>Las medidas se toman <b>iguales en los tres ejes</b>.</li><li>Se traza fácilmente con el cartabón (30°).</li></ul></div>
</div>
<div class="key"><b>Vistas o perspectiva:</b> las vistas sirven para fabricar (medidas exactas de cada cara); la perspectiva sirve para entender cómo es el objeto de un vistazo.</div>
`}, en:{ title:"Perspective drawing", html:()=>`
<p>Views are very precise, but it is hard to imagine the object. A <b>perspective drawing</b> shows the object <b>in a single drawing</b>, with a sense of volume, as a person would see it. The two most used in class are:</p>
<figure class="fig">${egPerspSVG("en")}</figure>
<div class="grid2">
  <div class="box green"><h4>Cavalier oblique</h4><ul><li>The front face is drawn <b>straight on and at its real size</b>.</li><li>Depth is drawn with lines sloping at <b>45°</b>.</li><li>Depth measurements are <b>reduced</b> (usually to half).</li></ul></div>
  <div class="box orange"><h4>Isometric</h4><ul><li>We draw <b>three axes at 120°</b> to each other (two at 30° to the horizontal and one vertical).</li><li>Measurements are <b>the same on all three axes</b>.</li><li>It is easy to draw with the 30°/60° set square.</li></ul></div>
</div>
<div class="key"><b>Views or perspective:</b> views are used to make the object (exact measurements of each face); perspective is used to understand what the object looks like at a glance.</div>
`}},
/* 8 ------------------------------------------------------------------ */
{ id:"dims", es:{ title:"La acotación", html:()=>`
<p><b>Acotar</b> es indicar en el dibujo las <b>medidas reales</b> del objeto para que cualquier persona pueda fabricarlo. Cada medida que se escribe se llama <b>cota</b>.</p>
<figure class="fig">${egCotaSVG("es")}</figure>
<div class="tbl-scroll"><table>
<tr><th>Elemento</th><th>Qué es</th></tr>
<tr><td><b>Línea de cota</b></td><td>Línea fina, paralela a la arista que se mide, con una flecha en cada extremo.</td></tr>
<tr><td><b>Líneas auxiliares de cota</b></td><td>Líneas finas, perpendiculares a la arista, que limitan la medida. Sobresalen un poco de la línea de cota.</td></tr>
<tr><td><b>Cifra de cota</b></td><td>El número de la medida, en milímetros, escrito encima de la línea de cota y centrado.</td></tr>
<tr><td><b>Símbolos</b></td><td><b>Ø</b> delante de la cifra indica un diámetro; <b>R</b>, un radio.</td></tr>
</table></div>
<h3>Normas básicas de acotación</h3>
<ul>
  <li>Las cifras se escriben en <b>milímetros</b> y <b>sin poner «mm»</b>.</li>
  <li>Las cifras van <b>encima</b> de la línea de cota.</li>
  <li>Las líneas de cota y las auxiliares son <b>finas</b>.</li>
  <li>Las líneas de cota <b>no se cruzan</b> entre sí: las medidas pequeñas van más cerca de la pieza y las grandes, más lejos.</li>
  <li>Cada medida se pone <b>una sola vez</b>.</li>
  <li>La cifra es siempre la <b>medida real</b>, aunque el dibujo esté ampliado o reducido.</li>
</ul>
<div class="activity"><span class="tag orange">Actividad</span>
  <h4>Busca los errores</h4>
  <p>Un compañero ha acotado así un rectángulo: ha escrito «60 mm» debajo de la línea de cota, ha cruzado la cota de la altura con la de la anchura y ha repetido la anchura arriba y abajo. ¿Cuántos errores hay?</p>
  <details class="sol"><summary>Ver solución</summary><p>Cuatro: sobra «mm»; la cifra debe ir encima de la línea; las líneas de cota no se cruzan; cada medida se pone solo una vez.</p></details>
</div>
`}, en:{ title:"Dimensioning", html:()=>`
<p><b>Dimensioning</b> means showing the <b>real measurements</b> of the object on the drawing so that anyone can make it. Each measurement we write is called a <b>dimension</b>.</p>
<figure class="fig">${egCotaSVG("en")}</figure>
<div class="tbl-scroll"><table>
<tr><th>Element</th><th>What it is</th></tr>
<tr><td><b>Dimension line</b></td><td>Thin line, parallel to the edge being measured, with an arrowhead at each end.</td></tr>
<tr><td><b>Extension lines</b></td><td>Thin lines, perpendicular to the edge, that mark the limits of the measurement. They go slightly past the dimension line.</td></tr>
<tr><td><b>Dimension figure</b></td><td>The number of the measurement, in millimetres, written above the dimension line and centred.</td></tr>
<tr><td><b>Symbols</b></td><td><b>Ø</b> before the figure means a diameter; <b>R</b>, a radius.</td></tr>
</table></div>
<h3>Basic dimensioning rules</h3>
<ul>
  <li>Figures are written in <b>millimetres</b> and <b>without writing “mm”</b>.</li>
  <li>Figures go <b>above</b> the dimension line.</li>
  <li>Dimension lines and extension lines are <b>thin</b>.</li>
  <li>Dimension lines <b>do not cross</b> each other: small measurements go closer to the piece and large ones further away.</li>
  <li>Each measurement is shown <b>only once</b>.</li>
  <li>The figure is always the <b>real measurement</b>, even if the drawing is enlarged or reduced.</li>
</ul>
<div class="activity"><span class="tag orange">Activity</span>
  <h4>Find the mistakes</h4>
  <p>A classmate dimensioned a rectangle like this: he wrote “60 mm” below the dimension line, crossed the height dimension with the width dimension and repeated the width at the top and bottom. How many mistakes are there?</p>
  <details class="sol"><summary>Show solution</summary><p>Four: “mm” should not be written; the figure goes above the line; dimension lines must not cross; each measurement is shown only once.</p></details>
</div>
`}},
/* 9 ------------------------------------------------------------------ */
{ id:"scale", es:{ title:"Las escalas", html:()=>`
<p>Muchas veces el objeto no cabe en el papel (una casa) o es tan pequeño que no se apreciaría (una pieza de un reloj). Entonces lo dibujamos <b>más pequeño o más grande</b>, pero siempre <b>proporcionado</b>, usando una <b>escala</b>.</p>
<div class="formula"><div class="fx c"><b>Escala</b>E</div><div class="op">=</div><div class="fx t"><b>Medida en el dibujo</b>D</div><div class="op">:</div><div class="fx h"><b>Medida real</b>R</div></div>
<div class="grid3">
  <div class="box green"><h4>Escala natural</h4><p><b>1:1</b>. El dibujo mide lo mismo que el objeto.</p></div>
  <div class="box blue"><h4>Escala de reducción</h4><p><b>1:2, 1:5, 1:10, 1:100…</b> El dibujo es más pequeño. 1:2 significa que 1 mm del dibujo son 2 mm reales. Para objetos grandes: muebles, casas, mapas.</p></div>
  <div class="box orange"><h4>Escala de ampliación</h4><p><b>2:1, 5:1, 10:1…</b> El dibujo es más grande. 2:1 significa que 2 mm del dibujo son 1 mm real. Para objetos pequeños.</p></div>
</div>
<h3>Cómo se calcula</h3>
<ul>
  <li><b>Medida del dibujo</b> = medida real × primer número ÷ segundo número. Ejemplo: a escala 1:2, una pieza de 80 mm se dibuja de 80 × 1 ÷ 2 = <b>40 mm</b>.</li>
  <li><b>Medida real</b> = medida del dibujo × segundo número ÷ primer número. Ejemplo: a escala 1:100, una pared que en el plano mide 50 mm mide en realidad 50 × 100 = <b>5000 mm = 5 m</b>.</li>
</ul>
<div class="key"><b>Recuerda:</b> el primer número es el dibujo y el segundo, la realidad. Y las cotas se escriben siempre con la <b>medida real</b>.</div>
<div class="activity"><span class="tag orange">Calculadora</span>
  <h4>Practica con la calculadora de escalas</h4>
  <div data-widget="scale"></div>
</div>
`}, en:{ title:"Scales", html:()=>`
<p>Often the object does not fit on the paper (a house) or it is so small we could not see it (a watch part). Then we draw it <b>smaller or larger</b>, but always <b>in proportion</b>, using a <b>scale</b>.</p>
<div class="formula"><div class="fx c"><b>Scale</b>S</div><div class="op">=</div><div class="fx t"><b>Drawing size</b>D</div><div class="op">:</div><div class="fx h"><b>Real size</b>R</div></div>
<div class="grid3">
  <div class="box green"><h4>Full scale</h4><p><b>1:1</b>. The drawing is the same size as the object.</p></div>
  <div class="box blue"><h4>Reduction scale</h4><p><b>1:2, 1:5, 1:10, 1:100…</b> The drawing is smaller. 1:2 means 1 mm on the drawing is 2 mm in reality. For large objects: furniture, houses, maps.</p></div>
  <div class="box orange"><h4>Enlargement scale</h4><p><b>2:1, 5:1, 10:1…</b> The drawing is larger. 2:1 means 2 mm on the drawing is 1 mm in reality. For small objects.</p></div>
</div>
<h3>How to calculate</h3>
<ul>
  <li><b>Drawing size</b> = real size × first number ÷ second number. Example: at scale 1:2, a piece of 80 mm is drawn 80 × 1 ÷ 2 = <b>40 mm</b> long.</li>
  <li><b>Real size</b> = drawing size × second number ÷ first number. Example: at scale 1:100, a wall that measures 50 mm on the plan is really 50 × 100 = <b>5000 mm = 5 m</b> long.</li>
</ul>
<div class="key"><b>Remember:</b> the first number is the drawing and the second is reality. And dimensions are always written with the <b>real size</b>.</div>
<div class="activity"><span class="tag orange">Calculator</span>
  <h4>Practise with the scale calculator</h4>
  <div data-widget="scale"></div>
</div>
`}},
/* 10 ----------------------------------------------------------------- */
{ id:"cad", es:{ title:"Dibujo asistido por ordenador (CAD)", html:()=>`
<p>Hoy en día casi todos los planos se hacen con ordenador mediante programas de <b>CAD</b> (diseño asistido por ordenador, del inglés <i>Computer-Aided Design</i>).</p>
<div class="grid2">
  <div class="box blue"><h4>CAD en 2D</h4><p>Dibujos planos: vistas, planos de piezas, esquemas de circuitos, planos de casas.</p><p>Ejemplos: <b>LibreCAD</b> y <b>QCAD</b> (gratuitos); AutoCAD (profesional).</p></div>
  <div class="box orange"><h4>CAD en 3D</h4><p>Modelos en tres dimensiones que se pueden girar y ver desde cualquier lado.</p><p>Ejemplos: <b>Tinkercad</b> (en el navegador, ideal para empezar), <b>SketchUp</b> y <b>FreeCAD</b>.</p></div>
</div>
<h3>Ventajas del CAD</h3>
<ul>
  <li>Mucha <b>precisión</b>: las medidas son exactas.</li>
  <li>Es fácil <b>corregir</b>, copiar y modificar sin empezar de nuevo.</li>
  <li>Los planos se <b>guardan</b>, imprimen y <b>comparten</b> fácilmente.</li>
  <li>El diseño se puede enviar a una <b>impresora 3D</b> o a una <b>cortadora láser</b> para fabricarlo (fabricación digital).</li>
</ul>
<div class="note"><b>De la pantalla al objeto:</b> en Tinkercad se diseña combinando formas básicas (cubos, cilindros…) y restando huecos. El modelo se exporta como archivo <b>STL</b>, que es el que entiende la impresora 3D.</div>
<div class="key"><b>Recuerda:</b> el ordenador no sustituye a las normas: un plano hecho con CAD también lleva vistas, tipos de línea, cotas, escala y cajetín.</div>
`}, en:{ title:"Computer-aided design (CAD)", html:()=>`
<p>Today almost all drawings are made on computers with <b>CAD</b> programs (Computer-Aided Design).</p>
<div class="grid2">
  <div class="box blue"><h4>2D CAD</h4><p>Flat drawings: views, plans of parts, circuit diagrams, house plans.</p><p>Examples: <b>LibreCAD</b> and <b>QCAD</b> (free); AutoCAD (professional).</p></div>
  <div class="box orange"><h4>3D CAD</h4><p>Three-dimensional models that can be rotated and seen from any side.</p><p>Examples: <b>Tinkercad</b> (in the browser, ideal to start with), <b>SketchUp</b> and <b>FreeCAD</b>.</p></div>
</div>
<h3>Advantages of CAD</h3>
<ul>
  <li>Great <b>precision</b>: measurements are exact.</li>
  <li>It is easy to <b>correct</b>, copy and change things without starting again.</li>
  <li>Drawings are easy to <b>save</b>, print and <b>share</b>.</li>
  <li>The design can be sent to a <b>3D printer</b> or a <b>laser cutter</b> to make it (digital fabrication).</li>
</ul>
<div class="note"><b>From screen to object:</b> in Tinkercad you design by combining basic shapes (cubes, cylinders…) and subtracting holes. The model is exported as an <b>STL</b> file, which is the file a 3D printer understands.</div>
<div class="key"><b>Remember:</b> the computer does not replace the standards: a CAD drawing also has views, line types, dimensions, scale and a title block.</div>
`}},
/* 11 ----------------------------------------------------------------- */
{ id:"project", es:{ title:"Proyecto: el plano del soporte para móvil", html:()=>`
<h3>Actividad guiada: croquis de una caja organizadora</h3>
<p>Antes del proyecto, practica con una caja organizadora de escritorio de <b>200 mm de largo, 100 mm de ancho y 100 mm de alto</b>, con escalones en su interior.</p>
<ol class="steps">
  <li>Haz un <b>boceto</b> rápido de la caja en perspectiva para tener la idea.</li>
  <li>Dibuja a mano alzada su <b>alzado, planta y perfil</b>, cuidando las proporciones.</li>
  <li><b>Acota</b> las medidas principales (200, 100 y 100) siguiendo las normas.</li>
</ol>
<h3>Proyecto de la unidad: plano de un soporte para móvil</h3>
<p>Vas a diseñar el plano de un soporte de madera para el móvil, formado por una <b>base</b> y un <b>respaldo</b> con un agujero para el cable del cargador.</p>
<figure class="fig">${egStandSVG("es")}<figcaption>Ejemplo de solución: base de 80 × 100 × 15 mm, respaldo de 80 × 70 × 15 mm sobre la base y agujero de Ø20 mm.</figcaption></figure>
<ol class="steps">
  <li><b>Bocetos:</b> dibuja tres ideas diferentes de soporte y elige la mejor.</li>
  <li><b>Croquis:</b> dibuja a mano alzada las tres vistas de tu idea y acótalas.</li>
  <li><b>Plano:</b> en un A4 con margen y cajetín, dibuja con escuadra, cartabón y compás el alzado, la planta y el perfil a escala 1:1.</li>
  <li><b>Revisión:</b> comprueba los tipos de línea, que cada cota aparece una sola vez y que las vistas están alineadas.</li>
  <li><b>Ampliación (CAD):</b> modela el soporte en Tinkercad y compáralo con tu plano.</li>
</ol>
<div class="note"><b>Criterio de evaluación 4.1:</b> se valora que representes y comuniques tu diseño de forma clara, con las vistas, la acotación y la documentación correctas.</div>
`}, en:{ title:"Project: the phone stand drawing", html:()=>`
<h3>Guided activity: dimensioned sketch of a desk organiser</h3>
<p>Before the project, practise with a desk organiser box <b>200 mm long, 100 mm wide and 100 mm high</b>, with steps inside it.</p>
<ol class="steps">
  <li>Make a quick <b>sketch</b> of the box in perspective to get the idea.</li>
  <li>Draw its <b>front view, top view and side view</b> freehand, keeping the proportions.</li>
  <li><b>Dimension</b> the main measurements (200, 100 and 100) following the rules.</li>
</ol>
<h3>Unit project: drawing of a phone stand</h3>
<p>You are going to design the drawing of a wooden phone stand, made up of a <b>base</b> and a <b>backrest</b> with a hole for the charger cable.</p>
<figure class="fig">${egStandSVG("en")}<figcaption>Example solution: base of 80 × 100 × 15 mm, backrest of 80 × 70 × 15 mm on the base and a hole of Ø20 mm.</figcaption></figure>
<ol class="steps">
  <li><b>Sketches:</b> draw three different ideas for the stand and choose the best one.</li>
  <li><b>Dimensioned sketch:</b> draw the three views of your idea freehand and dimension them.</li>
  <li><b>Drawing:</b> on an A4 sheet with border and title block, draw the front view, top view and side view at scale 1:1 with set squares and compass.</li>
  <li><b>Check:</b> check the line types, that each dimension appears only once and that the views are lined up.</li>
  <li><b>Extension (CAD):</b> model the stand in Tinkercad and compare it with your drawing.</li>
</ol>
<div class="note"><b>Assessment criterion 4.1:</b> you are assessed on representing and communicating your design clearly, with correct views, dimensions and documentation.</div>
`}},
/* 12 ----------------------------------------------------------------- */
{ id:"summary", es:{ title:"Lo esencial de la unidad", html:()=>`
<div class="grid2">
  <div class="box blue"><h4>Idea clave</h4><p>El dibujo técnico es un <b>lenguaje universal</b> y normalizado para diseñar, fabricar, montar y comunicar objetos.</p></div>
  <div class="box orange"><h4>Camino del dibujo</h4><p><b>Boceto</b> (rápido, sin medidas) → <b>croquis</b> (a mano alzada, con cotas) → <b>plano</b> (con instrumentos o CAD).</p></div>
  <div class="box green"><h4>Normas</h4><p>Formato <b>A4</b> (210 × 297), margen y cajetín; cuatro tipos de línea; acotar en mm, sin «mm», sin cruzar cotas.</p></div>
  <div class="box red"><h4>Representar</h4><p><b>Vistas</b> (alzado, planta debajo, perfil izquierdo a la derecha), <b>perspectivas</b> (caballera e isométrica) y <b>escalas</b> (1:1, reducción, ampliación).</p></div>
</div>
<h3>Vocabulario clave</h3>
<div class="tbl-scroll"><table>
<tr><th>Palabra</th><th>Significado</th></tr>
<tr><td>Dibujo técnico</td><td>Representación gráfica de objetos con normas y precisión.</td></tr>
<tr><td>Boceto</td><td>Dibujo rápido a mano alzada, sin medidas.</td></tr>
<tr><td>Croquis</td><td>Dibujo a mano alzada, proporcionado y con medidas.</td></tr>
<tr><td>Acotar</td><td>Indicar las medidas reales en el dibujo.</td></tr>
<tr><td>Vista</td><td>Dibujo del objeto visto desde una dirección (alzado, planta, perfil).</td></tr>
<tr><td>Escala</td><td>Relación entre la medida del dibujo y la medida real.</td></tr>
<tr><td>CAD</td><td>Diseño asistido por ordenador.</td></tr>
</table></div>
<div class="quote">Un buen dibujo evita errores en la fabricación: mide bien, dibuja claro y acota correctamente.</div>
`}, en:{ title:"Unit essentials", html:()=>`
<div class="grid2">
  <div class="box blue"><h4>Key idea</h4><p>Technical drawing is a <b>universal</b>, standardised language to design, make, assemble and communicate objects.</p></div>
  <div class="box orange"><h4>Drawing path</h4><p><b>Sketch</b> (quick, no measurements) → <b>dimensioned sketch</b> (freehand, with dimensions) → <b>plan</b> (with instruments or CAD).</p></div>
  <div class="box green"><h4>Standards</h4><p><b>A4</b> size (210 × 297), border and title block; four line types; dimension in mm, without “mm”, without crossing dimension lines.</p></div>
  <div class="box red"><h4>Representing</h4><p><b>Views</b> (front view, top view below, left side view to the right), <b>perspective</b> (cavalier and isometric) and <b>scales</b> (1:1, reduction, enlargement).</p></div>
</div>
<h3>Key vocabulary</h3>
<div class="tbl-scroll"><table>
<tr><th>Word</th><th>Meaning</th></tr>
<tr><td>Technical drawing</td><td>Graphic representation of objects with standards and precision.</td></tr>
<tr><td>Sketch</td><td>Quick freehand drawing without measurements.</td></tr>
<tr><td>Dimensioned sketch</td><td>Freehand drawing, in proportion and with measurements.</td></tr>
<tr><td>Dimensioning</td><td>Showing the real measurements on the drawing.</td></tr>
<tr><td>View</td><td>Drawing of the object seen from one direction (front, top, side).</td></tr>
<tr><td>Scale</td><td>Ratio between the size on the drawing and the real size.</td></tr>
<tr><td>CAD</td><td>Computer-aided design.</td></tr>
</table></div>
<div class="quote">A good drawing prevents mistakes in manufacturing: measure carefully, draw clearly and dimension correctly.</div>
`}}
];

const EG_SCALES = [[1,10],[1,5],[1,2],[1,1],[2,1],[5,1],[10,1]];
function egFmt(n){ return (Math.round(n*100)/100).toLocaleString(LANG==="es"?"es-ES":"en-GB",{maximumFractionDigits:2}); }
function mountScale(host){
  const es = LANG==="es";
  const st = { mode:"r2d", val:"80", sc:2, chal:null, chalAns:"" };
  const draw = ()=>{
    const [a,b] = EG_SCALES[st.sc];
    const v = parseFloat(String(st.val).replace(",","."));
    let out = "";
    if(isFinite(v) && v>0){
      out = st.mode==="r2d"
        ? `${es?"Medida en el dibujo":"Drawing size"} = ${egFmt(v)} × ${a} ÷ ${b} = <b>${egFmt(v*a/b)} mm</b>`
        : `${es?"Medida real":"Real size"} = ${egFmt(v)} × ${b} ÷ ${a} = <b>${egFmt(v*b/a)} mm</b>`;
    } else out = `<span class="muted">${es?"Escribe una medida en mm.":"Type a measurement in mm."}</span>`;
    host.innerHTML = `<div class="row">
      <label class="field">${es?"Quiero calcular":"I want to calculate"}<select data-k="mode">
        <option value="r2d"${st.mode==="r2d"?" selected":""}>${es?"la medida del dibujo":"the drawing size"}</option>
        <option value="d2r"${st.mode==="d2r"?" selected":""}>${es?"la medida real":"the real size"}</option></select></label>
      <label class="field">${st.mode==="r2d"?(es?"Medida real (mm)":"Real size (mm)"):(es?"Medida en el dibujo (mm)":"Drawing size (mm)")}<input type="text" inputmode="decimal" data-k="val" value="${esc(st.val)}" style="min-width:110px;width:130px"></label>
      <label class="field">${es?"Escala":"Scale"}<select data-k="sc">${EG_SCALES.map((s,i)=>`<option value="${i}"${i===st.sc?" selected":""}>${s[0]}:${s[1]}</option>`).join("")}</select></label>
    </div>
    <p data-out style="font-size:1.1rem;margin:10px 0">${out}</p>
    <div class="row"><button type="button" class="btn ghost" data-chal>🎲 ${es?"Ponme un reto":"Give me a challenge"}</button></div>
    ${st.chal ? `<div class="note" style="margin-top:10px"><b>${es?"Reto":"Challenge"}:</b> ${st.chal.q}
      <div class="row" style="margin-top:6px"><input type="text" inputmode="decimal" data-k="chalAns" value="${esc(st.chalAns)}" style="min-width:90px;width:110px"> mm
      <button type="button" class="btn green" data-chk>${es?"Comprobar":"Check"}</button><span data-res style="font-weight:700"></span></div></div>` : ""}`;
    host.querySelector('[data-k="mode"]').onchange = e=>{ st.mode=e.target.value; draw(); };
    host.querySelector('[data-k="sc"]').onchange = e=>{ st.sc=+e.target.value; draw(); };
    const vi = host.querySelector('[data-k="val"]');
    vi.oninput = e=>{ st.val=e.target.value; const o=host.querySelector("[data-out]"); const [a2,b2]=EG_SCALES[st.sc]; const v2=parseFloat(String(st.val).replace(",","."));
      o.innerHTML = (isFinite(v2)&&v2>0) ? (st.mode==="r2d" ? `${es?"Medida en el dibujo":"Drawing size"} = ${egFmt(v2)} × ${a2} ÷ ${b2} = <b>${egFmt(v2*a2/b2)} mm</b>` : `${es?"Medida real":"Real size"} = ${egFmt(v2)} × ${b2} ÷ ${a2} = <b>${egFmt(v2*b2/a2)} mm</b>`) : `<span class="muted">${es?"Escribe una medida en mm.":"Type a measurement in mm."}</span>`; };
    host.querySelector("[data-chal]").onclick = ()=>{
      const pick = EG_SCALES[[0,1,2,4,5][Math.floor(Math.random()*5)]];
      const real = pick[0]>1 ? [5,8,12,15,20,25][Math.floor(Math.random()*6)] : [40,60,80,100,150,200,300,500][Math.floor(Math.random()*8)];
      const ans = real*pick[0]/pick[1];
      st.chal = { q: es ? `A escala ${pick[0]}:${pick[1]}, ¿cuánto mide en el dibujo una pieza de ${real} mm?` : `At scale ${pick[0]}:${pick[1]}, how long is a ${real} mm piece on the drawing?`, ans };
      st.chalAns = ""; draw(); const ci = host.querySelector('[data-k="chalAns"]'); if(ci) ci.focus();
    };
    const ci = host.querySelector('[data-k="chalAns"]'); if(ci) ci.oninput = e=>{ st.chalAns = e.target.value; };
    const chk = host.querySelector("[data-chk]");
    if(chk) chk.onclick = ()=>{
      const v3 = parseFloat(String(st.chalAns).replace(",","."));
      const ok = isFinite(v3) && Math.abs(v3 - st.chal.ans) < 0.01;
      const r = host.querySelector("[data-res]");
      r.textContent = ok ? (es?"✔ ¡Correcto!":"✔ Correct!") : (es?`✘ Era ${egFmt(st.chal.ans)} mm`:`✘ It was ${egFmt(st.chal.ans)} mm`);
      r.style.color = ok ? "var(--green)" : "var(--red)";
    };
  };
  draw();
}
