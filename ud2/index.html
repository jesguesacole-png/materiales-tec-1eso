/* =========================================================
   VIEWS LAB (Taller de vistas)
   A rotatable piece made of cubes (front marked "ALZADO") and three dot grids
   (alzado, planta, perfil izquierdo · European system) where students draw the
   edges point to point as VISIBLE (thick continuous) or HIDDEN (dashed) lines.
   The solution (visible/hidden edges of each view) is computed from the cubes.
   Coordinates: x = width (left → right), y = depth (front y=0 → back), z = height (up).
   Pieces: layers from bottom to top; in each layer rows go from the BACK (first string)
   to the FRONT (last string), columns from left to right.
   ========================================================= */
const VL_PIECES = {
  easy: [
    { es:"Escalón", en:"Step", L:[["###","###"],["#..","#.."]] },
    { es:"Puente", en:"Bridge", L:[["#.#"],["###"]] },
    { es:"Rincón", en:"Corner", L:[["#..","###"],["#..","#.."]] },
    { es:"Te", en:"Tee", L:[[".#.","###"],[".#.","..."]] },
    { es:"Escalón trasero", en:"Back step", L:[["###","###"],["###","..."]] }
  ],
  medium: [
    { es:"Escalera", en:"Staircase", L:[["###","###"],["##.","##."],["#..","#.."]] },
    { es:"Esquinera", en:"Corner block", L:[["###","###","###"],["##.","##.","..."],["#..","...","..."]] },
    { es:"Silla", en:"Chair", L:[["###","#..","#.."],["###","#..","..."],["#..","...","..."]] },
    { es:"Muro con escalón", en:"Wall with step", L:[["###","###","###"],["...","###","..."],["...","#..","..."]] },
    { es:"Patio", en:"Courtyard", L:[["###","#.#","###"],["#..","...","..#"]] }
  ],
  hard: [
    { es:"Portería", en:"Goal", L:[["####","#..#","####"],["#..#","....","#..#"],["####","....","...."]] },
    { es:"Voladizo", en:"Overhang", L:[["#...","##..","###."],["#...","##..","...."],["##..","....","...."]] },
    { es:"Arco", en:"Arch", L:[["####","####"],["#..#","#..#"],["####","#..#"]] },
    { es:"Torre escondida", en:"Hidden tower", L:[["####","####","####"],[".#..","....","####"],[".#..","....","...."]] },
    { es:"Gancho", en:"Hook", L:[["###.","#...","#..."],["#...","#...","###."],["#...","....","...."]] }
  ]
};
function vlVoxels(p){
  const V = [];
  p.L.forEach((layer,z)=>{ const D = layer.length; layer.forEach((row,r)=>{ [...row].forEach((ch,x)=>{ if(ch==="#") V.push([x, D-1-r, z]); }); }); });
  return V;
}
/* random piece: height map on an N × N base, every column at least 1 cube high (always one solid piece) */
function vlRandom(N){
  const L = [];
  const h = Array.from({length:N},()=>Array.from({length:N},()=>1+Math.floor(Math.random()*N)));
  h[Math.floor(Math.random()*N)][Math.floor(Math.random()*N)] = N;   // exactly N × N × N
  for(let z=0; z<N; z++){ const layer=[]; for(let r=0;r<N;r++){ let row=""; for(let x=0;x<N;x++) row += h[x][N-1-r]>z ? "#" : "."; layer.push(row); } if(layer.some(r=>r.includes("#"))) L.push(layer); }
  return { es:`Aleatoria ${N}×${N}`, en:`Random ${N}×${N}`, L };
}
/* edges of one view. cells = [u, v, w]: u to the right, v up, w = depth (0 = closest to the viewer).
   Returns Map "h:i,k" / "v:i,k" → "v" (visible) | "h" (hidden). */
function vlViewLines(cells){
  const S = new Set(cells.map(c=>c.join(","))), has=(u,v,w)=>S.has(u+","+v+","+w);
  const U = Math.max(...cells.map(c=>c[0]))+1, Vn = Math.max(...cells.map(c=>c[1]))+1, Wn = Math.max(...cells.map(c=>c[2]))+1;
  const minW = {}; cells.forEach(([u,v,w])=>{ const k=u+","+v; if(minW[k]===undefined || w<minW[k]) minW[k]=w; });
  const cov = (u,v,j)=>{ const m=minW[u+","+v]; return m!==undefined && m<=j-1; };
  const res = new Map();
  const add = (key,vis)=>{ if(vis) res.set(key,"v"); else if(!res.has(key)) res.set(key,"h"); };
  const isEdge = (a,b,c,d)=>{ const n=a+b+c+d; return n===1 || n===3 || (n===2 && ((a&&d)||(b&&c))); };
  for(let j=0;j<=Wn;j++){
    for(let i=0;i<U;i++) for(let k=0;k<=Vn;k++){          // horizontal segments
      if(isEdge(has(i,k-1,j-1),has(i,k,j-1),has(i,k-1,j),has(i,k,j))) add("h:"+i+","+k, !(cov(i,k-1,j) && cov(i,k,j)));
    }
    for(let i=0;i<=U;i++) for(let k=0;k<Vn;k++){          // vertical segments
      if(isEdge(has(i-1,k,j-1),has(i,k,j-1),has(i-1,k,j),has(i,k,j))) add("v:"+i+","+k, !(cov(i-1,k,j) && cov(i,k,j)));
    }
  }
  return res;
}
function vlSolution(V){
  const mx = Math.max(...V.map(v=>v[0])), my = Math.max(...V.map(v=>v[1])), mz = Math.max(...V.map(v=>v[2]));
  const W = mx+1, D = my+1, H = mz+1;
  return {
    A: vlViewLines(V.map(([x,y,z])=>[x, z, y])),          // alzado: from the front        (W × H)
    P: vlViewLines(V.map(([x,y,z])=>[x, y, mz-z])),       // planta: from above, front at the bottom (W × D)
    S: vlViewLines(V.map(([x,y,z])=>[my-y, z, x])),       // perfil izquierdo: from the left, front on the right (D × H)
    W, D, H,
    dims: { A:[W,H], P:[W,D], S:[D,H] }
  };
}
/* student lines → unit segments */
function vlSegs(lines){
  const m = new Map(); let diag = 0;
  lines.forEach(l=>{
    const [x1,y1]=l.a, [x2,y2]=l.b;
    if(x1===x2){ for(let y=Math.min(y1,y2); y<Math.max(y1,y2); y++){ const k="v:"+x1+","+y; if(l.t==="v" || !m.has(k)) m.set(k,l.t); } }
    else if(y1===y2){ for(let x=Math.min(x1,x2); x<Math.max(x1,x2); x++){ const k="h:"+x+","+y1; if(l.t==="v" || !m.has(k)) m.set(k,l.t); } }
    else diag++;
  });
  return {m, diag};
}
/* exact comparison: each grid has exactly the size of its view, so there is only one correct drawing */
function vlCompare(lines, sol){
  const st = vlSegs(lines);
  let ok=0, wrong=0, extra=0, miss=0; const status = new Map();
  st.m.forEach((t,k)=>{ const s=sol.get(k); let r; if(!s){ extra++; r="x"; } else if(s===t){ ok++; r="ok"; } else { wrong++; r="t"; } status.set(k,r); });
  sol.forEach((t,k)=>{ if(!st.m.has(k)) miss++; });
  return { ok, wrong, extra, miss, diag: st.diag, perfect: wrong===0 && extra===0 && miss===0 && st.diag===0 && ok>0, status };
}

const vl = { lvl:"easy", i:0, size:3, rnd:null, yaw:35, pitch:28, tools:{A:"v",P:"v",S:"v"},
             lines:{A:[],P:[],S:[]}, hist:[], checked:false, sol:false, done:null };
function vlDone(){ if(!vl.done){ const d=store.get("vlab2",{}); vl.done=(d&&typeof d==="object")?d:{}; } return vl.done; }
function vlPiece(){ if(vl.lvl==="rand"){ if(!vl.rnd) vl.rnd=vlRandom(vl.size); return vl.rnd; } return VL_PIECES[vl.lvl][vl.i]; }
function vlReset(){ vl.lines={A:[],P:[],S:[]}; vl.hist=[]; vl.checked=false; vl.sol=false; vl.yaw=35; vl.pitch=28; }

function vlRender3D(svg, V){
  const es = LANG==="es";
  const mx=Math.max(...V.map(v=>v[0]))+1, my=Math.max(...V.map(v=>v[1]))+1, mz=Math.max(...V.map(v=>v[2]))+1;
  const cx=mx/2, cy=my/2, cz=mz/2;
  const th = vl.yaw*Math.PI/180, ph = vl.pitch*Math.PI/180, ct=Math.cos(th), st=Math.sin(th), cp=Math.cos(ph), sp=Math.sin(ph);
  const S = Math.min(46, 150/Math.max(mx,my,mz));
  const proj = (x,y,z)=>{ x-=cx; y-=cy; z-=cz; const x1 = x*ct - y*st, y1 = x*st + y*ct; const d = y1*cp - z*sp, z2 = y1*sp + z*cp; return [x1*S, -z2*S, d]; };
  const has = new Set(V.map(v=>v.join(",")));
  const DIRS = [[1,0,0,"var(--orange-soft)"],[-1,0,0,"var(--orange-soft)"],[0,1,0,"var(--blue-soft)"],[0,-1,0,"var(--blue)"],[0,0,1,"var(--green-soft)"],[0,0,-1,"var(--green-soft)"]];
  const faces = [];
  V.forEach(([x,y,z])=>{
    DIRS.forEach(([dx,dy,dz,fill])=>{
      if(has.has((x+dx)+","+(y+dy)+","+(z+dz))) return;
      const ny1 = dx*st + dy*ct, nd = ny1*cp - dz*sp; if(nd >= -1e-6) return;
      let q;
      if(dx){ const X = dx>0?x+1:x; q=[[X,y,z],[X,y+1,z],[X,y+1,z+1],[X,y,z+1]]; }
      else if(dy){ const Y = dy>0?y+1:y; q=[[x,Y,z],[x+1,Y,z],[x+1,Y,z+1],[x,Y,z+1]]; }
      else { const Z = dz>0?z+1:z; q=[[x,y,Z],[x+1,y,Z],[x+1,y+1,Z],[x,y+1,Z]]; }
      const P = q.map(p=>proj(...p));
      faces.push({ P, d: P.reduce((s,p)=>s+p[2],0)/4, fill, front: dy<0 });
    });
  });
  faces.sort((a,b)=>b.d-a.d);
  // floor grid under the piece (only when looking from above)
  let floor = "";
  if(vl.pitch > 2){
    const pts = (a,b)=>{ const p1=proj(...a), p2=proj(...b); return `<line x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" style="stroke:var(--line);stroke-width:1"/>`; };
    for(let x=0;x<=mx;x++) floor += pts([x,0,0],[x,my,0]);
    for(let y=0;y<=my;y++) floor += pts([0,y,0],[mx,y,0]);
  }
  const f1 = proj(mx/2, -2.0, 0), f2 = proj(mx/2, -0.2, 0), lab = proj(mx/2, -2.7, 0);
  svg.innerHTML = `<defs><marker id="vlArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--red)"/></marker></defs>
  <g transform="translate(150,135)">
    ${floor}
    ${faces.map(f=>`<polygon points="${f.P.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" style="fill:${f.fill};${f.front?"fill-opacity:.55;":""}stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round"/>`).join("")}
    <line x1="${f1[0].toFixed(1)}" y1="${f1[1].toFixed(1)}" x2="${f2[0].toFixed(1)}" y2="${f2[1].toFixed(1)}" style="stroke:var(--red);stroke-width:3" marker-end="url(#vlArrow)"/>
    <text x="${lab[0].toFixed(1)}" y="${(lab[1]+5).toFixed(1)}" text-anchor="middle" style="font:700 13px var(--font-body);fill:var(--red);paint-order:stroke;stroke:var(--card,#fff);stroke-width:3px">${es?"ALZADO":"FRONT VIEW"}</text>
  </g>`;
}

const VL_PAD = 12;
function vlPanelSVG(key, sol, w, h, C){
  const P=VL_PAD, W=w*C+2*P, H=h*C+2*P;
  const X = x=>P+x*C, Y = y=>P+(h-y)*C;
  let dots=""; for(let x=0;x<=w;x++) for(let y=0;y<=h;y++) dots+=`<circle cx="${X(x)}" cy="${Y(y)}" r="${C>34?3:2.4}" style="fill:var(--muted);opacity:.6"/>`;
  const lineEl = (a,b,t,color)=>`<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" style="stroke:${color};stroke-linecap:round;${t==="v"?"stroke-width:3.6":"stroke-width:2.2;stroke-dasharray:7 5"}"/>`;
  const segEnds = k=>{ const [d,rest]=k.split(":"), [i,j]=rest.split(",").map(Number); return [[i,j], d==="h"?[i+1,j]:[i,j+1]]; };
  let body="";
  if(vl.sol){
    sol.forEach((t,k)=>{ const [a,b]=segEnds(k); body+=lineEl(a,b,t,"var(--green)"); });
  } else if(vl.checked){
    const cmp = vlCompare(vl.lines[key], sol), segs = vlSegs(vl.lines[key]).m;
    cmp.status.forEach((r,k)=>{ const [a,b]=segEnds(k); body+=lineEl(a,b,segs.get(k), r==="ok"?"var(--green)":r==="t"?"var(--orange)":"var(--red)"); });
    vl.lines[key].forEach(l=>{ if(l.a[0]!==l.b[0] && l.a[1]!==l.b[1]) body+=lineEl(l.a,l.b,l.t,"var(--red)"); });
  } else {
    vl.lines[key].forEach(l=>{ body+=lineEl(l.a,l.b,l.t,"var(--ink)"); });
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" class="vl-pad" data-g="${key}" data-w="${w}" data-h="${h}" data-c="${C}" style="touch-action:none;display:block;background:var(--card,#fff);border:2px solid var(--ink);border-radius:6px">
    ${dots}<g data-lines>${body}</g><g data-prev></g></svg>`;
}
function vlFeedback(cmp, es){
  if(cmp.perfect) return `<span style="color:var(--green);font-weight:700">✔ ${es?"Correcta":"Correct"}</span>`;
  const parts=[];
  if(cmp.miss) parts.push(`${cmp.miss} ${es?"faltan":"missing"}`);
  if(cmp.extra) parts.push(`<span style="color:var(--red)">${cmp.extra} ${es?"sobran":"extra"}</span>`);
  if(cmp.wrong) parts.push(`<span style="color:#b85600">${cmp.wrong} ${es?"vista/oculta mal":"wrong type"}</span>`);
  if(cmp.diag) parts.push(`<span style="color:var(--red)">${cmp.diag} ${es?"inclinadas":"sloping"}</span>`);
  return `<span style="color:var(--red);font-weight:700">✘</span> ${parts.join(" · ")||(es?"Sin dibujar":"Not drawn")}`;
}
function vlToolBtns(key, es){
  const t = vl.tools[key];
  const b = (id, title, icon)=>`<button type="button" class="vl-tool${t===id?" on":""}" data-tool="${id}" data-k="${key}" title="${title}" aria-label="${title}" aria-pressed="${t===id}">${icon}</button>`;
  return `<div class="vl-tb">
    ${b("v", es?"Línea vista (continua gruesa)":"Visible line (thick continuous)", `✏️<svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" style="stroke:currentColor;stroke-width:3.5"/></svg>`)}
    ${b("h", es?"Línea oculta (discontinua)":"Hidden line (dashed)", `✏️<svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" style="stroke:currentColor;stroke-width:2;stroke-dasharray:4 3"/></svg>`)}
    ${b("e", es?"Borrar línea":"Erase line", `🧽`)}
  </div>`;
}
function viewsLab(el){
  const es = LANG==="es";
  const p = vlPiece(), V = vlVoxels(p), sol = vlSolution(V), done = vlDone();
  const id = vl.lvl==="rand" ? null : vl.lvl+vl.i;
  const lvlName = {easy: es?"Fácil":"Easy", medium: es?"Media":"Medium", hard: es?"Difícil":"Hard", rand: es?"Aleatoria":"Random"};
  const nm = {A: es?"Alzado":"Front view", P: es?"Planta":"Top view", S: es?"Perfil izquierdo":"Left side view"};
  const colr = {A:"var(--blue)", P:"var(--green)", S:"#b85600"};
  // one cell size for the three views so they line up exactly (alzado–planta share width, alzado–perfil share height)
  const avail = Math.min(Math.max(el.clientWidth || 900, 300), 1040);
  const C = Math.max(16, Math.min(60, Math.floor((avail - 4*VL_PAD - 60) / (sol.W + sol.D)), Math.floor(460 / (sol.H + sol.D))));
  let result = "", fb = {A:"",P:"",S:""};
  if(vl.checked){
    const c = {A:vlCompare(vl.lines.A, sol.A), P:vlCompare(vl.lines.P, sol.P), S:vlCompare(vl.lines.S, sol.S)};
    ["A","P","S"].forEach(k=>fb[k]=vlFeedback(c[k],es));
    const all = c.A.perfect && c.P.perfect && c.S.perfect;
    if(all && id && !done[id]){ done[id]=true; store.set("vlab2",done); }
    result = `<div class="fb ${all?"ok":"ko"}" role="status" style="margin-top:0"><b>${all?(es?"¡Las tres vistas son correctas!":"All three views are correct!"):(es?"Todavía hay errores.":"There are still mistakes.")}</b>
      <span class="muted" style="font-size:.88rem"> ${es?"Verde: bien · naranja: vista/oculta al revés · rojo: sobra. Toca una cuadrícula para seguir.":"Green: correct · orange: visible/hidden swapped · red: extra. Touch a grid to continue."}</span></div>`;
  }
  const nDone = Object.keys(done).length, total = Object.values(VL_PIECES).reduce((s,a)=>s+a.length,0);
  const panel = k=>{ const [w,h]=sol.dims[k];
    return `<div class="vl-cell vl-${k}">
      <div class="vl-head"><h4 style="color:${colr[k]}">${nm[k]}</h4>${vlToolBtns(k, es)}</div>
      ${vlPanelSVG(k, sol[k], w, h, C)}
      <div class="vl-fb">${fb[k]}</div></div>`; };
  el.innerHTML = `<h2>${es?"Taller de vistas":"Views lab"}</h2>
  <div class="card no-print" style="margin-bottom:10px;padding:12px 16px">
    <div class="row">
      ${["easy","medium","hard","rand"].map(l=>`<button type="button" class="btn ${vl.lvl===l?"":"ghost"}" data-lvl="${l}">${lvlName[l]}</button>`).join("")}
      ${vl.lvl==="rand" ? `<label class="field" style="min-width:0">${es?"Tamaño":"Size"}<select data-size>${[2,3,4,5,6,7,8].map(n=>`<option value="${n}"${n===vl.size?" selected":""}>${n} × ${n}</option>`).join("")}</select></label>` : `<span class="muted">${es?"Resueltas":"Solved"}: <b>${nDone} / ${total}</b></span>`}
    </div>
    ${vl.lvl==="rand" ? "" : `<div class="row" style="margin-top:8px">${VL_PIECES[vl.lvl].map((q,k)=>`<button type="button" class="btn ${k===vl.i?"orange":"ghost"} vl-sm" data-pc="${k}">${done[vl.lvl+k]?"✔ ":""}${k+1}. ${esc(q[LANG])}</button>`).join("")}</div>`}
    <p class="muted" style="font-size:.88rem;margin:8px 0 0">${es
      ? "Dibuja cada vista uniendo puntos: elige el lápiz de <b>línea vista</b> o de <b>línea oculta</b> junto a cada vista, pulsa un punto y después otro. Cada cuadrícula tiene exactamente el tamaño de su vista."
      : "Draw each view by joining dots: choose the <b>visible line</b> or <b>hidden line</b> pencil next to each view, press one dot and then another. Each grid is exactly the size of its view."}</p>
  </div>
  <div class="vl-scroll"><div class="vl-board">
    ${panel("A")}
    ${panel("S")}
    ${panel("P")}
    <div class="vl-cell vl-3d">
      <div class="vl-head"><h4>${esc(p[LANG])} <span class="tag">${lvlName[vl.lvl]}</span> <span class="muted" style="font-size:.85rem;font-weight:400">${sol.W}×${sol.D}×${sol.H}</span></h4></div>
      <svg id="vl3d" viewBox="0 0 300 280" style="width:300px;max-width:100%;touch-action:none;cursor:grab;display:block" role="img" aria-label="${es?"Pieza en 3D: arrástrala para girarla":"3D piece: drag it to rotate"}"></svg>
      <div class="row" style="justify-content:center;gap:6px">
        <button type="button" class="btn ghost vl-sm" data-rot="l" aria-label="${es?"Girar a la izquierda":"Rotate left"}">⟲</button>
        <button type="button" class="btn ghost vl-sm" data-rot="u" aria-label="${es?"Ver más desde arriba":"View more from above"}">▲</button>
        <button type="button" class="btn ghost vl-sm" data-rot="d" aria-label="${es?"Ver más desde abajo":"View more from below"}">▼</button>
        <button type="button" class="btn ghost vl-sm" data-rot="r" aria-label="${es?"Girar a la derecha":"Rotate right"}">⟳</button>
        <button type="button" class="btn ghost vl-sm" data-rot="0">${es?"Inicio":"Reset"}</button>
      </div>
    </div>
  </div></div>
  <div class="card vl-bar no-print">
    <div class="row">
      <button type="button" class="btn green" data-act="check">✔ ${es?"Comprobar":"Check"}</button>
      <button type="button" class="btn ghost" data-act="undo">↶ ${es?"Deshacer":"Undo"}</button>
      <button type="button" class="btn ghost" data-act="clear">${es?"Borrar todo":"Clear all"}</button>
      <button type="button" class="btn ghost" data-act="sol">${vl.sol?(es?"Ocultar solución":"Hide solution"):(es?"Ver solución":"Show solution")}</button>
      <button type="button" class="btn ghost" data-act="next">${vl.lvl==="rand"?(es?"Otra pieza":"Another piece"):(es?"Siguiente pieza":"Next piece")} ▶</button>
    </div>
    ${result ? `<div style="margin-top:10px">${result}</div>` : ""}
    <p class="muted" style="font-size:.85rem;margin:8px 0 0">${es
      ? "Sistema europeo: la planta va debajo del alzado (el frente de la pieza queda abajo) y el perfil izquierdo a la derecha del alzado (el frente queda a la derecha). Si una arista vista y una oculta coinciden, se dibuja la vista."
      : "European system: the top view goes below the front view (the front of the piece at the bottom) and the left side view to the right of the front view (the front on the right). If a visible and a hidden edge coincide, draw the visible one."}</p>
  </div>`;

  // --- 3D rotation ---
  const svg = $("#vl3d", el); vlRender3D(svg, V);
  let drag=null;
  svg.addEventListener("pointerdown", e=>{ drag={x:e.clientX,y:e.clientY,yaw:vl.yaw,pitch:vl.pitch}; svg.setPointerCapture(e.pointerId); svg.style.cursor="grabbing"; });
  svg.addEventListener("pointermove", e=>{ if(!drag) return; vl.yaw=drag.yaw+(e.clientX-drag.x)*0.6; vl.pitch=Math.max(-89,Math.min(89,drag.pitch+(e.clientY-drag.y)*0.6)); vlRender3D(svg,V); });
  const end=()=>{ drag=null; svg.style.cursor="grab"; };
  svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);
  $$("[data-rot]",el).forEach(b=>b.onclick=()=>{ const r=b.dataset.rot;
    if(r==="l") vl.yaw-=30; if(r==="r") vl.yaw+=30; if(r==="u") vl.pitch=Math.min(89,vl.pitch+20); if(r==="d") vl.pitch=Math.max(-89,vl.pitch-20); if(r==="0"){ vl.yaw=35; vl.pitch=28; }
    vlRender3D(svg,V); });

  // --- drawing on the dot grids ---
  $$(".vl-pad",el).forEach(pad=>{
    const key=pad.dataset.g, w=+pad.dataset.w, h=+pad.dataset.h, Cc=+pad.dataset.c, P=VL_PAD, Wpx=w*Cc+2*P, Hpx=h*Cc+2*P;
    const toGrid = e=>{ const r=pad.getBoundingClientRect(), sx=(e.clientX-r.left)*Wpx/r.width, sy=(e.clientY-r.top)*Hpx/r.height;
      return [Math.max(0,Math.min(w,Math.round((sx-P)/Cc))), Math.max(0,Math.min(h,Math.round(h-(sy-P)/Cc))), sx, sy]; };
    const X = x=>P+x*Cc, Y = y=>P+(h-y)*Cc;
    const snap = (a,b)=>{ const dx=Math.abs(b[0]-a[0]), dy=Math.abs(b[1]-a[1]); return dx>=dy ? [b[0],a[1]] : [a[0],b[1]]; };
    const prev = pad.querySelector("[data-prev]");
    let start=null;
    const tool = ()=>vl.tools[key];
    const showPrev = (a,b)=>{ prev.innerHTML = `<circle cx="${X(a[0])}" cy="${Y(a[1])}" r="5" style="fill:var(--orange)"/>` + (b && (b[0]!==a[0]||b[1]!==a[1]) ? `<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" style="stroke:var(--orange);stroke-linecap:round;${tool()==="h"?"stroke-width:2.2;stroke-dasharray:7 5":"stroke-width:3.6"}"/>` : ""); };
    const redraw = ()=>{ const tmp=document.createElement("div"); tmp.innerHTML=vlPanelSVG(key, sol[key], w, h, Cc); pad.querySelector("[data-lines]").innerHTML = tmp.querySelector("[data-lines]").innerHTML; };
    const addLine = (a,b)=>{ if(a[0]===b[0] && a[1]===b[1]) return; vl.lines[key].push({a:[...a], b:[...b], t:tool()}); vl.hist.push(key); redraw(); };
    const eraseAt = (sx,sy)=>{ let best=-1, bd=1e9;
      vl.lines[key].forEach((l,i)=>{ const x1=X(l.a[0]),y1=Y(l.a[1]),x2=X(l.b[0]),y2=Y(l.b[1]); const L2=(x2-x1)**2+(y2-y1)**2; let t=L2?((sx-x1)*(x2-x1)+(sy-y1)*(y2-y1))/L2:0; t=Math.max(0,Math.min(1,t)); const d=Math.hypot(sx-(x1+t*(x2-x1)), sy-(y1+t*(y2-y1))); if(d<bd){bd=d;best=i;} });
      if(best>=0 && bd<12){ vl.lines[key].splice(best,1); const hh=vl.hist.lastIndexOf(key); if(hh>=0) vl.hist.splice(hh,1); redraw(); } };
    pad.addEventListener("pointerdown", e=>{
      e.preventDefault();
      if(vl.sol) return;
      if(vl.checked){ vl.checked=false; viewsLab(el); return; }
      const [gx,gy,sx,sy]=toGrid(e);
      if(tool()==="e"){ eraseAt(sx,sy); return; }
      if(start){ addLine(start, snap(start,[gx,gy])); start=null; prev.innerHTML=""; return; }

    });
    pad.addEventListener("pointermove", e=>{ if(!start) return; const [gx,gy]=toGrid(e); showPrev(start, snap(start,[gx,gy])); });
    pad.addEventListener("pointerup", e=>{ if(!start) return; const [gx,gy]=toGrid(e); const b=snap(start,[gx,gy]);
      if(b[0]!==start[0]||b[1]!==start[1]){ addLine(start,b); start=null; prev.innerHTML=""; } });
    pad.addEventListener("pointercancel", ()=>{ start=null; prev.innerHTML=""; });
  });

  // --- controls ---
  $$("[data-tool]",el).forEach(b=>b.onclick=()=>{ const k=b.dataset.k; vl.tools[k]=b.dataset.tool;
    $$(`[data-tool][data-k="${k}"]`,el).forEach(x=>{ const on=x.dataset.tool===vl.tools[k]; x.classList.toggle("on",on); x.setAttribute("aria-pressed",on); }); });
  $$("[data-lvl]",el).forEach(b=>b.onclick=()=>{ vl.lvl=b.dataset.lvl; vl.i=0; vl.rnd=null; vlReset(); viewsLab(el); });
  $$("[data-pc]",el).forEach(b=>b.onclick=()=>{ vl.i=+b.dataset.pc; vlReset(); viewsLab(el); });
  const sz=$("[data-size]",el); if(sz) sz.onchange=e=>{ vl.size=+e.target.value; vl.rnd=null; vlReset(); viewsLab(el); };
  $$("[data-act]",el).forEach(b=>b.onclick=()=>{ const a=b.dataset.act;
    if(a==="undo"){ const k=vl.hist.pop(); if(k) vl.lines[k].pop(); vl.checked=false; }
    if(a==="clear"){ vl.lines={A:[],P:[],S:[]}; vl.hist=[]; vl.checked=false; vl.sol=false; }
    if(a==="check"){ vl.sol=false; vl.checked=true; }
    if(a==="sol"){ vl.sol=!vl.sol; vl.checked=false; }
    if(a==="next"){ if(vl.lvl==="rand") vl.rnd=null; else { const L2=VL_PIECES[vl.lvl]; if(vl.i<L2.length-1) vl.i++; else { const o=["easy","medium","hard"]; vl.lvl=o[(o.indexOf(vl.lvl)+1)%3]; vl.i=0; } } vlReset(); }
    viewsLab(el); });
}

function addQ(m, src){
  const q = {id:QUESTIONS.length, src, type:m.type, pts:m.pts, n:m.n, t:m.t, q:m.q, fixed:!!m.fixed};
  const pair = p=>({es:p[0],en:p[1]});

  if(m.type==="match"){ q.items=m.items.map(pair); q.opts=m.opts.map(pair); q.ans=m.ans; }
  if(m.type==="order"){ q.items=m.items.map(pair); q.start=m.start; }
  if(m.type==="open"){ q.model=pair(m.model); q.groups=m.groups; q.need=m.need; }
  q.x = m.x ? pair(m.x) : null;
  QUESTIONS.push(q); return q.id;
}

/* ---------- answer checking (case, accents and punctuation are ignored) ---------- */
function norm(s){
  return String(s==null?"":s).toLowerCase().replace(/ø/g,"o").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9€\s]/g," ").replace(/\s+/g," ").trim();
}
function stripArt(s){ return s.replace(/^(el|la|los|las|un|una|unos|unas|lo|the|a|an) /,""); }
function stem(s){ return s.replace(/(es|s)$/,""); }
function blankOK(input, b){
  const v = stripArt(norm(input)); if(!v) return false;
  const alts = [].concat(b.es||[], b.en||[], b.alt||[]);
  return alts.some(a=>{ const w=stripArt(norm(a));
    if(v===w || stem(v)===stem(w)) return true;
    return w.length>=5 && lev(v,w)<=1; // tolerate one small typo in longer words
  });
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>1) return 2;
  let prev=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){ const cur=[i];
    for(let j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur; }
  return prev[b.length];
}
function openFound(q, text){
  const t = " "+norm(text)+" ";
  return q.groups.map(g=>g.k.some(k=>{ const n=norm(k); return n && t.includes(n); }));
}
/* returns fraction 0..1 */
function scoreQ(q, ans){
  if(ans===undefined || ans===null) return 0;
  switch(q.type){
    case "mc":    return ans===q.a ? 1 : 0;
    case "fill":  return q.blanks.filter((b,i)=>blankOK((ans||[])[i], b)).length / q.blanks.length;
    case "match": return q.ans.filter((c,i)=>ans[i]===c).length / q.ans.length;
    case "order": return ans.filter((it,pos)=>it===pos).length / q.items.length;
    case "open":  { const f=openFound(q,ans).filter(Boolean).length; return Math.min(1, f/q.need); }
  }
  return 0;
}
function isAnswered(q, ans){
  if(ans===undefined || ans===null) return false;
  switch(q.type){
    case "mc": return true;
    case "fill": return ans.some(v=>String(v||"").trim()!=="");
    case "match": return ans.some(v=>v>=0);
    case "order": return true;
    case "open": return String(ans).trim()!=="";
  }
  return false;
}
function promptText(q, L){ return q.q[L].replace(/\{\{\d+\}\}/g, "________"); }
function answerText(q, L){
  switch(q.type){
    case "mc": return q.o[q.a][L];
    case "fill": return q.blanks.map(b=>b[L][0]).join(" / ");
    case "match": return q.items.map((it,i)=>`${it[L]} → ${q.opts[q.ans[i]][L]}`).join(" · ");
    case "order": return q.items.map((it,i)=>`${i+1}. ${it[L]}`).join(" → ");
    case "open": return q.model[L];
  }
  return "";
}
function givenText(q, ans, L){
  if(!isAnswered(q,ans)) return null;
  switch(q.type){
    case "mc": return q.o[ans][L];
    case "fill": return ans.map(v=>String(v||"").trim()||"—").join(" / ");
    case "match": return q.items.map((it,i)=>`${it[L]} → ${ans[i]>=0?q.opts[ans[i]][L]:"—"}`).join(" · ");
    case "order": return ans.map((it,i)=>`${i+1}. ${q.items[it][L]}`).join(" → ");
    case "open": return String(ans);
  }
  return "";
}
function fmtPts(n){ return (Math.round(n*100)/100).toLocaleString(LANG==="es"?"es-ES":"en-GB",{maximumFractionDigits:2}); }

const CODE_ABC = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function cyrbHash(str, seed=0){
  let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
function unlockCode(key, lang){
  let h = cyrbHash(CONFIG.SALT+"|unlock|"+UNIT.code+"|"+key+"|"+lang), c="";
  for(let i=0;i<5;i++){ c += CODE_ABC[h % CODE_ABC.length]; h = Math.floor(h / CODE_ABC.length); }
  return c;
}
const UNLOCK_KEYS = SESSIONS.map(s=>s.key).concat(["ex"]);
function keyLabel(k){ if(k==="ex") return T("examKey"); const ss=SESSIONS.find(x=>x.key===k); return `${T("session")} ${ss.n}: ${ss.secs.map(id=>SECTIONS.find(s=>s.id===id)[LANG].title).join(" + ")}`; }
const isOpen = k => TEACHER || !!UNL[k];
const secOpen = id => isOpen(SEC_SESSION[id]);
const openSecs = () => SECTIONS.filter(s=>secOpen(s.id));
const studyOpen = () => STUDY.filter(q=>secOpen(q.t));
function tryCode(raw){
  const c = String(raw||"").toUpperCase().replace(/[^0-9A-Z]/g,"");
  for(const k of UNLOCK_KEYS) for(const lang of ["es","en"]){
    if(c && c===unlockCode(k,lang)){
      if(lang==="es" && LOCK==="en" && !TEACHER) return {ok:false, msg:T("codeEsOnEn")};
      const already = !!UNL[k];
      UNL[k]=true; store.set("unl",UNL);
      let extra="";
      if(lang==="en" && !TEACHER && LOCK!=="en"){ LOCK="en"; store.set("lock","en"); LANG="en"; store.set("lang","en"); extra=" "+UI.en.codeEnLock; }
      return {ok:true, msg:(already?T("codeAlready"):T("codeOk")).replace("{x}", keyLabel(k)) + extra};
    }
  }
  return {ok:false, msg:T("codeBad")};
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

    $("#fcNext").onclick = ()=>{ if(fc.i<total-1){fc.i++; fc.flipped=false; renderFlash(); focusCard();} };
    const mark = val=>{

      if(fc.onlyReview && val==="k"){ fc.deck.splice(fc.i,1); if(fc.i>=fc.deck.length) fc.i=Math.max(0,fc.deck.length-1); }

// ---------- QUESTION RENDERING (shared by Practice + Exam) ----------
const TYPE_GROUPS = { all:()=>true, test:q=>q.type==="mc", written:q=>q.type!=="mc" };
function typeOptions(sel){
  return ["all","test","written"].map(k=>`<option value="${k}"${sel===k?" selected":""}>${T("qt_"+k)}</option>`).join("");
}
function typeLabel(q){
  if(q.type==="mc") return q.fixed ? T("lbl_tf") : T("lbl_mc");
  return T("lbl_"+q.type);
}
/* st = {ans, order(for mc), done(bool, show correction)} */
function answerAreaHTML(q, st){
  const ans = st.ans, done = st.done, L = LANG, mark = !!st.mark && !done;
  if(q.type==="mc"){
    const ord = q.fixed ? q.o.map((_,i)=>i) : st.order;
    return `<div class="opts">${ord.map((oi,k)=>{
      let cls="";
      if(done){ if(oi===q.a) cls=" right"; else if(oi===ans) cls=" wrong"; }
      else if(mark && ans===oi) cls = oi===q.a ? " right" : " wrong";
      else if(ans===oi) cls=" sel";
      return `<button type="button" class="opt${cls}" data-oi="${oi}" aria-pressed="${ans===oi}"${done?" disabled":""}><span class="lt">${LETTERS[k]}</span><span>${esc(q.o[oi][L])}</span></button>`;}).join("")}</div>`;
  }
  if(q.type==="fill"){
    let i=-1;
    const parts = esc(q.q[L]).split(/\{\{\d+\}\}/);
    let h = "";
    parts.forEach((p,k)=>{
      h += p;
      if(k<parts.length-1){ i++;
        const v = (ans||[])[i]||"";
        let cls = ""; if(done||mark) cls = blankOK(v,q.blanks[i]) ? " right" : " wrong";
        h += `<input type="text" class="blank${cls}" data-b="${i}" value="${esc(v)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${T("blank")} ${i+1}"${done?" disabled":""}>`;
      }
    });
    return `<p class="fill-text">${h}</p>`;
  }
  if(q.type==="match"){
    return `<div class="match">${q.items.map((it,i)=>{
      const v = ans ? ans[i] : -1;
      let cls=""; if(done||mark) cls = v===q.ans[i] ? " right" : " wrong";
      return `<div class="match-row${cls}"><span class="mi"><b>${i+1}.</b> ${esc(it[L])}</span>
        <select data-m="${i}"${done?" disabled":""} aria-label="${esc(it[L])}"><option value="-1">${T("choose")}</option>${q.opts.map((o,k)=>`<option value="${k}"${v===k?" selected":""}>${LETTERS[k]}) ${esc(o[L])}</option>`).join("")}</select>
        ${done && v!==q.ans[i] ? `<span class="mfix">✔ ${esc(q.opts[q.ans[i]][L])}</span>`:""}</div>`;}).join("")}</div>`;
  }
  if(q.type==="order"){
    const cur = ans || q.start;
    return `<ol class="circuit qorder">${cur.map((it,pos)=>{
      let cls=""; if(done||mark) cls = it===pos ? "ok" : "bad";
      return `<li class="${cls}"><span class="pos">${pos+1}</span><span class="txt">${esc(q.items[it][L])}${done&&it!==pos?` <span class="muted">(${T("goesIn")} ${it+1})</span>`:""}</span>
        <button type="button" data-mv="up" data-i="${pos}" aria-label="${T("moveUp")}"${pos===0||done?" disabled":""}>▲</button>
        <button type="button" data-mv="down" data-i="${pos}" aria-label="${T("moveDown")}"${pos===cur.length-1||done?" disabled":""}>▼</button></li>`;}).join("")}</ol>`;
  }
  if(q.type==="open"){
    return `<textarea class="open-ans" rows="5" placeholder="${T("writeHere")}"${done?" disabled":""}>${esc(ans||"")}</textarea>`;
  }
  return "";
}
/* wire inputs; onChange(newAns, rerender) */
function bindAnswerArea(host, q, st, onChange){
  if(q.type==="mc"){
    $$(".opt",host).forEach(b=>b.onclick=()=>onChange(+b.dataset.oi, true));
  } else if(q.type==="fill"){
    $$("input.blank",host).forEach(inp=>inp.addEventListener("input",()=>{
      const a = q.blanks.map((_,i)=>{ const el=host.querySelector(`input.blank[data-b="${i}"]`); return el?el.value:""; });
      onChange(a, false);
    }));
  } else if(q.type==="match"){
    $$("select[data-m]",host).forEach(sel=>sel.addEventListener("change",()=>{
      const a = q.items.map((_,i)=>{ const el=host.querySelector(`select[data-m="${i}"]`); return el?+el.value:-1; });
      onChange(a, false);
    }));
  } else if(q.type==="order"){
    $$("button[data-mv]",host).forEach(b=>b.onclick=()=>{
      const cur = (st.ans || q.start).slice();
      const i=+b.dataset.i, j = b.dataset.mv==="up"? i-1 : i+1;
      if(j<0||j>=cur.length) return;
      [cur[i],cur[j]]=[cur[j],cur[i]];
      onChange(cur, true, `button[data-mv="${b.dataset.mv}"][data-i="${j}"]`);
    });
  } else if(q.type==="open"){
    const ta=$("textarea.open-ans",host); if(ta) ta.addEventListener("input",()=>onChange(ta.value,false));
  }
}
function feedbackHTML(q, ans){
  const f = scoreQ(q, ans), L=LANG;
  const pts = f*q.pts;
  const cls = f===1 ? "ok" : (f>0 ? "part" : "ko");
  const head = f===1 ? T("correct") : (f>0 ? T("partial") : T("incorrect"));
  let h = `<div class="fb ${cls}" role="status"><b>${head}</b> ${q.type!=="mc"||q.src==="model"?`<span class="muted">(${fmtPts(pts)} / ${fmtPts(q.pts)} ${T("ptsShort")})</span>`:""}`;
  if(q.type==="mc"){
    if(f<1) h += `<br>${T("rightAnswer")} <b>${esc(q.o[q.a][L])}</b>.`;
  } else if(q.type==="open"){
    const found = openFound(q, ans);
    h += `<div style="margin-top:6px">${T("keyIdeas")} (${found.filter(Boolean).length}/${q.groups.length}, ${T("needed")} ${q.need}):</div><ul class="ideas">${q.groups.map((g,i)=>`<li class="${found[i]?"yes":"no"}">${found[i]?"✔":"✘"} ${esc(g[L])}</li>`).join("")}</ul>
      <div>${T("modelAnswer")} <i>${esc(q.model[L])}</i></div><div class="muted" style="font-size:.88rem;margin-top:4px">${T("openNote")}</div>`;
  } else if(f<1){
    h += `<br>${T("rightAnswer")} <b>${esc(answerText(q,L))}</b>`;
  }
  if(q.x) h += `<div style="margin-top:4px">${esc(q.x[L])}</div>`;
  return h + `</div>`;
}

const pr = { topic:"all", qtype:"all", list:[], i:0, orders:{}, answers:{}, checked:{}, started:false };

  pr.list = shuffle(studyOpen().filter(q=>(pr.topic==="all"||q.t===pr.topic) && TYPE_GROUPS[pr.qtype](q)).map(q=>q.id));
  pr.orders = {}; pr.list.forEach(id=>{ const q=QUESTIONS[id]; if(q.type==="mc") pr.orders[id]=shuffle(q.o.map((_,i)=>i)); });

    body = `<div class="card q-card" style="margin-top:16px">
      <div class="q-meta"><span>${T("question")} ${pr.i+1} ${T("of")} ${pr.list.length} · ${esc(topicName(q.t,LANG))} · <span class="tag">${typeLabel(q)}</span></span>

      <div id="prArea">${answerAreaHTML(q, st)}</div>

// ---------- EXAM ----------
const ex = { phase:"setup", n:20, kind:"mix", name:"", list:[], orders:{}, answers:{}, i:0, date:null };
function roundRobin(pool, n){
  const byT = TOPICS.map(t=>shuffle(pool.filter(q=>q.t===t.id).map(q=>q.id))).filter(p=>p.length);
  const order = shuffle(byT.map((_,i)=>i)); const out=[]; let k=0;
  while(out.length<n && byT.some(p=>p.length)){ const p=byT[order[k%order.length]]; if(p.length) out.push(p.shift()); k++; }
  return out;
}
function pickExam(n, kind){
  if(kind==="model") return STUDY.filter(q=>q.src==="model").sort((a,b)=>a.n-b.n).map(q=>q.id);
  if(kind==="test") return shuffle(roundRobin(STUDY.filter(TYPE_GROUPS.test), n));
  if(kind==="written") return shuffle(roundRobin(STUDY.filter(TYPE_GROUPS.written), n));
  const written = STUDY.filter(TYPE_GROUPS.written);
  const nW = Math.min(written.length, Math.round(n*0.4));
  return shuffle(roundRobin(written, nW).concat(roundRobin(STUDY.filter(TYPE_GROUPS.test), n-nW)));
}
function examMaxN(kind){
  if(kind==="test") return STUDY.filter(TYPE_GROUPS.test).length;
  if(kind==="written") return STUDY.filter(TYPE_GROUPS.written).length;
  if(kind==="model") return STUDY.filter(q=>q.src==="model").length;
  return STUDY.length;
}

const secById = id => SECTIONS.find(s=>s.id===id);
const fichaTitle = (f,L) => secById(f.sec)[L].title;

/* device id (random, created once per browser profile) */
const DEVICE = (function(){
  let d = store.get("dev", null);
  if(typeof d!=="string" || !/^[0-9A-Z]{6}$/.test(d)){
    d = ""; const c="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    try{ const a=new Uint32Array(6); crypto.getRandomValues(a); a.forEach(x=>d+=c[x%36]); }
    catch(e){ for(let i=0;i<6;i++) d+=c[Math.floor(Math.random()*36)]; }
    store.set("dev", d);
  }
  return d;
})();
/* small deterministic hash (cyrb53) */
function cyrb53(str, seed=0){
  let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
function seededOrder(n, seedStr){ // stable option order per device + question
  const idx=[...Array(n).keys()]; let s=cyrb53(seedStr)%2147483647||1;
  for(let i=n-1;i>0;i--){ s=(s*48271)%2147483647; const j=s%(i+1); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return idx;
}
const EPOCH = Date.UTC(2026,0,1);
const b36 = (n,w)=>Math.max(0,Math.floor(n)).toString(36).toUpperCase().padStart(w,"0").slice(-w);
function codeSig(P, name, group){ return cyrb53(CONFIG.SALT+"|"+UNIT.code+"|"+P+"|"+norm(name)+"|"+norm(group)).toString(36).toUpperCase().padStart(11,"0").slice(-6); }
function makeCode(f, score, first, attempts, date, name, group){
  const P = String(f + (LANG==="en"?50:0)).padStart(2,"0") + b36(score,2) + b36(first,2) + b36(Math.min(attempts,1295),2) + b36((date.getTime()-EPOCH)/60000,5) + DEVICE;
  return UNIT.code + P + codeSig(P, name, group);
}
const fmtCode = c => c.slice(0,2)+"-"+c.slice(2).match(/.{1,5}/g).join("-");
function decodeCode(raw, name, group){
  const c = String(raw||"").toUpperCase().replace(/[^0-9A-Z]/g,"");
  if(c.length!==27 || c.slice(0,2)!==UNIT.code) return {ok:false, err:"format"};
  const P=c.slice(2,21), sig=c.slice(21);
  let f=parseInt(P.slice(0,2),10); const lang = f>50 ? "en" : "es"; if(f>50) f-=50;
  const score=parseInt(P.slice(2,4),36), first=parseInt(P.slice(4,6),36), att=parseInt(P.slice(6,8),36);
  const min=parseInt(P.slice(8,13),36), dev=P.slice(13,19);
  if(!(f>=1&&f<=FICHA_DEF.length) || score>100 || first>100 || isNaN(min)) return {ok:false, err:"format"};
  return {ok:true, valid: sig===codeSig(P,name,group), f, lang, score, first, att, date:new Date(EPOCH+min*60000), dev, code:c};
}

function renderCuaderno(){
  const v=$("#view-cuaderno"), L=LANG;
  const sheetHead = title=>`<div class="paper-head"><div><div class="muted">${esc(T("subject"))} · ${UNIT.code}</div><h2 style="border:0;margin:0">${title}</h2></div>
    <div class="student"><div>${T("fullName")}: <span>&nbsp;</span></div><div>${T("groupLbl")}: <span style="min-width:70px">&nbsp;</span></div><div>${T("date")}: <span style="min-width:90px">&nbsp;</span></div></div></div>`;
  let body;
  if(cu.mode==="guide"){
    let n=0;
    body = `<section class="paper doc">${sheetHead(T("guideTitle"))}
      <p>${T("guideIntro")}</p>
      <table><tr><th style="width:40px">Nº</th><th>${T("guideWhat")}</th><th style="width:110px">${T("guideType")}</th><th style="width:60px">✓</th></tr>
      ${GUIDE.map(g=>`<tr><td colspan="4" class="gsec"><b>${SECTIONS.indexOf(secById(g.sec))+1}. ${esc(secById(g.sec)[L].title)}</b></td></tr>`+
        g.e.map(e=>{ n++; return `<tr><td>${n}</td><td>${esc(e[L==="es"?1:2])}</td><td>${T("gt_"+e[0])}</td><td><span class="cbox"></span></td></tr>`; }).join("")).join("")}
      </table>
      <div style="break-inside:avoid"><h3>${T("rubricTitle")}</h3>
      <table><tr><th>${T("criterion")}</th><th style="width:90px">${T("maxPts")}</th><th style="width:90px">${T("mark")}</th></tr>
        <tr><td>${T("rb1")}</td><td>4</td><td></td></tr>
        <tr><td>${T("rb2")}</td><td>2</td><td></td></tr>
        <tr><td>${T("rb3")}</td><td>2</td><td></td></tr>
        <tr><td>${T("rb4")}</td><td>2</td><td></td></tr>
        <tr><td><b>${T("total")}</b></td><td><b>10</b></td><td></td></tr></table>
      <p style="margin-top:18px">${T("teacherSign")}: ______________________ &nbsp; ${T("date")}: ____________</p></div>
    </section>`;
  } else {
    const list = (cu.ficha==="all" ? FICHAS : [FICHAS[+cu.ficha-1]]).filter(f=>secOpen(f.sec));
    body = !list.length ? lockedCardHTML(T("nothingOpen")) : list.map(f=>{ const sec=secById(f.sec);
      return `<section class="paper doc">${sheetHead(`${T("ficha")} ${f.num}: ${esc(sec[L].title)}`)}
        ${cu.withText ? `<div class="paper-text"><h3>${T("step1")}</h3>${sec[L].html()}</div><h3>${T("step2")}</h3>` : `<p class="muted">${T("paperRead")} ${SECTIONS.indexOf(sec)+1}.</p>`}
        ${f.ids.map((id,k)=>paperQHTML(QUESTIONS[id],k,L)).join("")}</section>`; }).join("");
  }
  v.innerHTML = `<h2 class="no-print">${T("navCuaderno")}</h2>
  <div class="card print-controls no-print">
    <p style="margin-top:0">${T("cuIntro")}</p>
    <div class="row" style="gap:28px;align-items:flex-start">
      <fieldset><legend>${T("cuWhat")}</legend>
        <label><input type="radio" name="cum" value="guide"${cu.mode==="guide"?" checked":""}> ${T("guideTitle")}</label>
        <label><input type="radio" name="cum" value="paper"${cu.mode==="paper"?" checked":""}> ${T("paperFichas")}</label></fieldset>
      ${cu.mode==="paper"?`<label class="field">${T("ficha")}<select id="cuF"><option value="all">${T("allFichas")}</option>${FICHAS.filter(f=>secOpen(f.sec)).map(f=>`<option value="${f.num}"${String(f.num)===String(cu.ficha)?" selected":""}>${f.num}. ${esc(fichaTitle(f,L))}</option>`).join("")}</select></label>
      <label style="margin-top:22px"><input type="checkbox" id="cuTxt"${cu.withText?" checked":""}> ${T("withText")}</label>`:""}
      <fieldset><legend>${T("printMode")}</legend>
        <label><input type="radio" name="cub" value="color"${!cu.bw?" checked":""}> ${T("color")}</label>
        <label><input type="radio" name="cub" value="bw"${cu.bw?" checked":""}> ${T("bw")}</label></fieldset>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn orange" type="button" id="cuPrint">🖨️ ${T("printBtn")}</button></div>
  </div>
  <article class="notes paper-wrap${cu.bw?" bw":""}">${body}</article>`;
  // static circuit in paper text
  staticWidgets(v, L);
  $$("details.sol",v).forEach(d=>d.remove());
  $$('input[name="cum"]',v).forEach(r=>r.onchange=()=>{ if(r.checked){ cu.mode=r.value; renderCuaderno(); } });
  $$('input[name="cub"]',v).forEach(r=>r.onchange=()=>{ if(r.checked){ cu.bw=(r.value==="bw"); store.set("bwCu",cu.bw); renderCuaderno(); } });
  const sf=$("#cuF"); if(sf) sf.onchange=e=>{ cu.ficha=e.target.value; renderCuaderno(); };
  const tx=$("#cuTxt"); if(tx) tx.onchange=e=>{ cu.withText=e.target.checked; renderCuaderno(); };
  $("#cuPrint").onclick=()=>window.print();
}

// ---------- PROFESOR (not linked in the menu) ----------
function renderProfesor(){
  const v=$("#view-profesor"), L=LANG;
  let params={}; try{ const h=location.hash.split("?")[1]||""; params=Object.fromEntries(new URLSearchParams(h)); }catch(e){}
  v.innerHTML = `<h2 class="no-print">${T("profTitle")}</h2>
  <div class="card no-print" style="margin-bottom:16px">
    <h3 style="margin-top:0">👩‍🏫 ${T("teacherTitle")}</h3>
    <p class="muted" style="margin-top:0">${T("teacherHelp")}</p>
    <div class="row">
      ${TEACHER ? `<button class="btn ghost" type="button" id="pvTOff">${T("teacherOff")}</button>`
                : `<label class="field">PIN<input type="password" id="pvTPin" autocomplete="off" style="min-width:120px;width:140px"></label>
                   <button class="btn" type="button" id="pvTOn" style="margin-top:18px">${T("teacherOn")}</button>`}
      <button class="btn ghost" type="button" id="pvReset" style="${TEACHER?"":"margin-top:18px"}">${T("resetUnl")}</button>
      <span id="pvTMsg" class="muted" role="status" style="${TEACHER?"":"margin-top:18px"}"></span>
    </div>
    ${TEACHER ? `<h3 style="margin-top:20px">${T("codesTitle")}</h3><p class="muted" style="margin-top:0">${T("codesHelp")}</p>
      <div class="doc tbl-scroll"><table class="codes-tbl"><tr><th>${T("session")}</th><th>${T("codeEs")}</th><th>${T("codeEn")}</th></tr>
      ${UNLOCK_KEYS.map(k=>`<tr><td>${esc(keyLabel(k))}</td><td class="code">${unlockCode(k,"es")}</td><td class="code">${unlockCode(k,"en")}</td></tr>`).join("")}</table></div>` : ""}
  </div>
  <div class="card no-print" style="margin-bottom:16px">
    <h3 style="margin-top:0">${T("lockTitle")}</h3>
    <p style="margin-top:0">${T("lockState")}: <b>${LOCK?T("lockedEn"):T("unlocked")}</b> · ${T("device")}: <b>${DEVICE}</b></p>
    <div class="row">
      <label class="field">PIN<input type="password" id="pvPin" autocomplete="off" style="min-width:120px;width:140px"></label>
      <button class="btn" type="button" id="pvLock" style="margin-top:18px">🔒 ${T("lockBtn")}</button>
      <button class="btn ghost" type="button" id="pvUnlock" style="margin-top:18px">🔓 ${T("unlockBtn")}</button>
      <span id="pvLockMsg" class="muted" style="margin-top:18px" role="status"></span>
    </div>
  </div>
  <div class="card no-print" style="margin-bottom:16px">
    <h3 style="margin-top:0">${T("verifyTitle")}</h3>
    <p class="muted" style="margin-top:0">${T("verifyHelp")}</p>
    <div class="row">
      <label class="field">${T("codeLbl")}<input type="text" id="pvC" style="min-width:300px" autocomplete="off"></label>
      <label class="field">${T("fullName")}<input type="text" id="pvN" autocomplete="off"></label>
      <label class="field">${T("groupLbl")}<input type="text" id="pvG" autocomplete="off" style="min-width:90px;width:110px"></label>
      <button class="btn green" type="button" id="pvGo" style="margin-top:18px">${T("verifyBtn")}</button>
    </div>
    <div id="pvOut" style="margin-top:12px"></div>
  </div>
  ${!TEACHER ? "" : `<div class="card">
    <div class="row no-print" style="justify-content:space-between"><h3 style="margin:0">${T("keyTitle")}</h3><button class="btn ghost" type="button" id="pvPrint">🖨️ ${T("printBtn")}</button></div>
    <div class="doc">${FICHAS.map(f=>`<h3>${T("ficha")} ${f.num}: ${esc(fichaTitle(f,L))}</h3>${f.ids.map((id,k)=>{ const q=QUESTIONS[id];
      return `<div class="bank-q"><b>${k+1}. ${esc(promptText(q,L))}</b> <span class="muted">(${fmtPts(q.pts)} ${T("ptsShort")})</span>${fcExtra(q,L)}<br>✔ ${esc(answerText(q,L))}</div>`; }).join("")}`).join("")}</div>
  </div>`}`;
  $("#pvC").value=params.c||""; $("#pvN").value=params.n||""; $("#pvG").value=params.g||"";
  const run=()=>{
    const r=decodeCode($("#pvC").value, $("#pvN").value, $("#pvG").value), out=$("#pvOut"), loc=L==="es"?"es-ES":"en-GB";
    if(!r.ok){ out.innerHTML=`<div class="fb ko">${T("badCode")}</div>`; return; }
    out.innerHTML = `<div class="fb ${r.valid?"ok":"ko"}"><b>${r.valid?T("validYes"):T("validNo")}</b>
      <ul style="margin:6px 0 0"><li>${T("ficha")} ${r.f}: ${esc(fichaTitle(FICHAS[r.f-1],L))}</li>
      <li>${T("finalMark")}: <b>${(r.score/10).toLocaleString(loc)}</b> / 10 · ${T("firstTry")}: ${(r.first/10).toLocaleString(loc)} · ${T("attempts")}: ${r.att}</li>
      <li>${T("deliveredAt")}: ${r.date.toLocaleString(loc)}</li><li>${T("device")}: <b>${r.dev}</b></li><li>${T("langDone")}: <b>${r.lang==="en"?"English":"Español"}</b></li></ul>
      <p style="margin:6px 0 0" class="muted">${T("verifyNote")}</p></div>`;
  };
  $("#pvGo").onclick=run;
  const tOn=$("#pvTOn"); if(tOn) tOn.onclick=()=>{ if($("#pvTPin").value!==String(CONFIG.TEACHER_PIN)){ $("#pvTMsg").textContent=T("badPin"); return; } TEACHER=true; store.set("teacher",true); applyStaticI18n(); renderProfesor(); };
  const tOff=$("#pvTOff"); if(tOff) tOff.onclick=()=>{ TEACHER=false; store.set("teacher",null); if(LOCK){ LANG=LOCK; } applyStaticI18n(); renderProfesor(); };
  $("#pvReset").onclick=()=>{ UNL={}; store.set("unl",null); $("#pvTMsg").textContent=T("resetDone"); };
  const pinOK=()=>{ if($("#pvPin").value===String(CONFIG.TEACHER_PIN)) return true; $("#pvLockMsg").textContent=T("badPin"); return false; };
  $("#pvLock").onclick=()=>{ if(!pinOK()) return; store.set("lock","en"); LOCK="en"; LANG="en"; store.set("lang","en"); applyStaticI18n(); renderProfesor(); };
  $("#pvUnlock").onclick=()=>{ if(!pinOK()) return; store.set("lock",null); LOCK=null; applyStaticI18n(); renderProfesor(); };
  const pp=$("#pvPrint"); if(pp) pp.onclick=()=>window.print();
  if(params.c) run();
}

// ---------- NOTES (printable) ----------
const nt = { bw: store.get("bw",false), sol: store.get("incSol",true), bank: store.get("incBank",false) };
function renderNotes(){
  const v=$("#view-apuntes");
  if(!openSecs().length){ v.innerHTML = `<h2>${T("navNotes")}</h2>`+lockedCardHTML(T("nothingOpen")); bindOpenCode(v); return; }
  const secs = SECTIONS.map((s,i)=> !secOpen(s.id) ? "" : `
    <section class="nsec doc"><h2><span class="n">${i+1}.</span> ${s[LANG].title}</h2>${s[LANG].html()}${nbBoxHTML(s.id,LANG)}</section>`).join("");
  const bank = !nt.bank ? "" : `<section class="nsec doc"><h2>${T("bankTitle")}</h2>
    ${TOPICS.map((t,ti)=>{ const qs=studyOpen().filter(q=>q.t===t.id); if(!qs.length) return ""; return `<h3>${ti+1}. ${esc(t[LANG])}</h3>`+
      qs.map((q,k)=>`<div class="bank-q"><b>${k+1}. ${esc(promptText(q,LANG))}</b>${fcExtra(q,LANG)}✔ ${esc(answerText(q,LANG))}</div>`).join(""); }).join("")}</section>`;
  v.innerHTML = `
  <h2 class="no-print">${T("navNotes")}</h2>
  <div class="card print-controls no-print">
    <p style="margin-top:0">${T("notesIntro")}</p>
    <div class="row" style="gap:28px;align-items:flex-start">
      <fieldset><legend>${T("printMode")}</legend>
        <label><input type="radio" name="pm" value="color"${!nt.bw?" checked":""}> ${T("color")}</label>
        <label><input type="radio" name="pm" value="bw"${nt.bw?" checked":""}> ${T("bw")}</label></fieldset>
      <fieldset><legend>${T("include")}</legend>
        <label><input type="checkbox" id="ntSol"${nt.sol?" checked":""}> ${T("incSol")}</label>
        <label><input type="checkbox" id="ntBank"${nt.bank?" checked":""}> ${T("incBank")}</label></fieldset>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn orange" type="button" id="ntPrint">🖨️ ${T("printBtn")}</button></div>
    <p class="muted" style="margin:10px 0 0;font-size:.9rem">${T("printTip")}</p>
  </div>
  <article class="notes${nt.bw?" bw":""}${nt.sol?" show-sol":""}" id="notesDoc">
    <div class="cover">
      <span class="tag orange">${T("heroKicker")}</span>
      <h1>${T("unitTitle").replace(/^U\d+ · /,"")}</h1>
      <div class="sub">${T("coverSub")}</div>
      <div class="student"><div>${T("name")} <span>&nbsp;</span></div><div>${T("group")} <span style="min-width:90px">&nbsp;</span></div></div>
      <div class="toc doc" style="text-align:left;margin-top:22px"><h3>${T("toc")}</h3>
        <ol>${openSecs().map(s=>`<li>${s[LANG].title}</li>`).join("")}${nt.bank?`<li>${T("bankTitle")}</li>`:""}</ol></div>
    </div>
    ${secs}
    ${bank}
  </article>`;
  // static versions of interactive bits
  const doc=$("#notesDoc");
  staticWidgets(doc, LANG);
  $$("details.sol",doc).forEach(d=>{
    const div=document.createElement("div"); div.className="sol-print";
    const sm=d.querySelector("summary"); if(sm) sm.remove();
    div.innerHTML = `<b class="sl">${T("solution")}:</b>` + d.innerHTML;
    d.replaceWith(div);
  });
  $$('input[name="pm"]',v).forEach(r=>r.onchange=()=>{ if(!r.checked) return; nt.bw = (r.value==="bw"); store.set("bw",nt.bw); doc.classList.toggle("bw",nt.bw); });
  $("#ntSol").onchange=e=>{ nt.sol=e.target.checked; store.set("incSol",nt.sol); doc.classList.toggle("show-sol",nt.sol); };
  $("#ntBank").onchange=e=>{ nt.bank=e.target.checked; store.set("incBank",nt.bank); renderNotes(); };
  $("#ntPrint").onclick=()=>window.print();
}

/* =========================================================
   8. ROUTER + LANGUAGE
   ========================================================= */
const VIEWS = {inicio:renderHome, contenidos:renderContents, fichas:renderFichas, cuaderno:renderCuaderno, flashcards:renderFlash, practica:renderPractice, examen:renderExam, apuntes:renderNotes, profesor:renderProfesor};
/* extra tabs defined by the unit: UNIT.tabs = [{id, es, en, icon, descEs, descEn, after, sec, render(el)}] */
(UNIT.tabs||[]).forEach(tb=>{
  UI.es["tab_"+tb.id]=tb.es; UI.en["tab_"+tb.id]=tb.en;
  const a=document.createElement("a"); a.href="#"+tb.id; a.dataset.view=tb.id; a.dataset.i18n="tab_"+tb.id; a.textContent=tb.es;
  const ref=document.querySelector(`nav.tabs a[data-view="${tb.after||"apuntes"}"]`); if(ref) ref.after(a); else $("nav.tabs").appendChild(a);
  const sec=document.createElement("section"); sec.className="view"; sec.id="view-"+tb.id; $("main").appendChild(sec);
  VIEWS[tb.id]=()=>{ const el=$("#view-"+tb.id); if(tb.sec && !secOpen(tb.sec)){ el.innerHTML=`<h2>${T("tab_"+tb.id)}</h2>`+lockedCardHTML(); bindOpenCode(el); return; } tb.render(el); };
});
window.addEventListener("beforeprint", ()=>{
  if(currentView==="fichas" && fs.open){ const r=$("#fReport"); if(r && !r.innerHTML.trim() && fd(fs.open).attempts && fs.ident.name && fs.ident.group) r.innerHTML = reportHTML(fs.open, new Date()).html; }
});
let currentView = "inicio";
function applyStaticI18n(){
  document.documentElement.lang = LANG;
  $$("[data-i18n]").forEach(el=>{ el.textContent = T(el.dataset.i18n); });
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===LANG)));
  document.body.classList.toggle("lang-locked", !!LOCK && !TEACHER);
  $("#teacherBadge").hidden = !TEACHER;
  document.title = T("unitTitle");
}
function route(){
  const h = (location.hash||"#inicio").slice(1).split("?")[0];
  currentView = VIEWS[h] ? h : "inicio";
  $$(".view").forEach(v=>v.classList.toggle("active", v.id==="view-"+currentView));
  $$("nav.tabs a").forEach(a=>{ if(a.dataset.view===currentView) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  VIEWS[currentView]();
}
function setLang(l){
  if(l!=="es" && l!=="en") return;
  if(LOCK && !TEACHER && l!==LOCK) return;
  LANG=l; store.set("lang",l);
  try{ const u=new URL(location.href); if(u.searchParams.has("lang")){ u.searchParams.set("lang",l); history.replaceState(null,"",u.toString()); } }catch(e){}
  applyStaticI18n(); VIEWS[currentView]();
}
$$(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
$("#keyBtn").addEventListener("click",()=>{ const p=$("#codePanel"); if(p.hidden) openCodePanel(); else { p.hidden=true; $("#keyBtn").setAttribute("aria-expanded","false"); } });
function submitCode(){
  const r = tryCode($("#codeIn").value), m=$("#codeMsg");
  m.textContent = r.msg; m.className = "code-msg " + (r.ok?"ok":"ko");
  if(r.ok){ $("#codeIn").value=""; applyStaticI18n(); VIEWS[currentView](); }
}
$("#codeGo").addEventListener("click", submitCode);
$("#codeIn").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); submitCode(); } });
window.addEventListener("hashchange", ()=>{ route(); window.scrollTo({top:0}); });
applyStaticI18n();
route();
/* offline support (only when served over http/https, e.g. GitHub Pages) */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
