<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organizador de escritorio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Guía paso a paso, diario de taller y memoria técnica del organizador de escritorio (kit OPITEC 122.979) para 1.º ESO.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: banda superior (pestañas Guía/Diario/Memoria + ajustes) · columna de pasos + ficha grande · en móvil, un solo flujo */
:root{
  --scale:1;
  --paper:#f3f5f9; --card:#ffffff; --ink:#1b2742; --ink-soft:#4a5672; --line:#d6dce8;
  --navy:#1f3a6e; --band:#1f3a6e; --on-navy:#ffffff; --navy-soft:#e4eaf6;
  --accent:#e2681a; --accent-soft:#fdeee2; --on-accent:#ffffff;
  --ok:#23804a; --ok-soft:#e1f3e8; --warn:#c23a2b; --warn-soft:#fbe7e4;
  --wood:#ecd3a4; --wood2:#d8b479; --wood-line:#9a7440; --grain:#c9a467;
  --metal:#9aa6b8; --metal-dark:#5d6a80; --sheet:#ffffff; --tape:rgba(226,104,26,.55);
  --phone:#26303f; --glue:#eaf3ff;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Consolas",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11161f; --card:#1a212e; --ink:#e8edf6; --ink-soft:#aab4c7; --line:#2e384a;
    --navy:#8fb1ee; --band:#16233d; --on-navy:#0f1726; --navy-soft:#22304a;
    --accent:#f08a43; --accent-soft:#3a2617; --on-accent:#1a1006;
    --ok:#5cc489; --ok-soft:#173326; --warn:#f07b6d; --warn-soft:#3a1c19;
    --wood:#d9bd8a; --wood2:#b8945c; --wood-line:#7a5a2e; --grain:#b8945c;
    --metal:#8792a6; --metal-dark:#c3ccda; --sheet:#eef1f6; --tape:rgba(240,138,67,.6);
    --phone:#0b0f16; --glue:#cfe0f7;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161f; --card:#1a212e; --ink:#e8edf6; --ink-soft:#aab4c7; --line:#2e384a;
  --navy:#8fb1ee; --band:#16233d; --on-navy:#0f1726; --navy-soft:#22304a;
  --accent:#f08a43; --accent-soft:#3a2617; --on-accent:#1a1006;
  --ok:#5cc489; --ok-soft:#173326; --warn:#f07b6d; --warn-soft:#3a1c19;
  --wood:#d9bd8a; --wood2:#b8945c; --wood-line:#7a5a2e; --grain:#b8945c;
  --metal:#8792a6; --metal-dark:#c3ccda; --sheet:#eef1f6; --tape:rgba(240,138,67,.6);
  --phone:#0b0f16; --glue:#cfe0f7;
  color-scheme:dark;
}
html{font-size:calc(16px * var(--scale))}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:1.1875rem;line-height:1.55}
:root[data-spacing="wide"] body{line-height:1.8;letter-spacing:.03em;word-spacing:.1em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%}

/* ---------- Cabecera ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--band);color:#fff;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0;margin-right:auto}
.brand small{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.08em;opacity:.85;text-transform:uppercase}
.brand strong{font-family:var(--font-display);font-size:1.5rem;font-weight:800}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:1rem;cursor:pointer}
.tab:hover{background:rgba(255,255,255,.22)}
.tab[aria-current="page"]{background:#fff;color:#1b2742}
.tab.icon{display:inline-flex;align-items:center;gap:6px}
.tab svg{width:18px;height:18px}
.prog{flex:1 1 100%;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#ffffff;opacity:.85;border-radius:99px;transition:width .4s}
.prog span{font-family:var(--font-mono);font-size:.8125rem;white-space:nowrap}

/* ---------- Estructura ---------- */
.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 60px}
.wrap.single{grid-template-columns:minmax(0,1fr);max-width:1000px}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr);gap:16px}}
@media (max-width:600px){.top{position:relative;top:0}.tab{padding:7px 11px;font-size:.95rem}}

.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 110px);align-self:start;max-height:calc(100vh - 130px);overflow:auto;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.nav h2{font-family:var(--font-display);font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:6px 10px 8px}
.nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{width:100%;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;text-align:left;background:none;border:0;
  padding:7px 8px;border-radius:10px;cursor:pointer;font-size:1rem;line-height:1.25}
.nav button:hover{background:var(--navy-soft)}
.nav button[aria-current="step"]{background:var(--navy);color:var(--on-navy)}
.nav .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.05rem;
  background:var(--navy-soft);color:var(--navy)}
.nav button[aria-current="step"] .n{background:var(--on-navy);color:var(--navy)}
.nav .done{font-size:.875rem;color:var(--ok);font-weight:700}
.nav button[aria-current="step"] .done{color:inherit}
.mnav{display:none}
@media (max-width:900px){
  .nav{display:none}
  .mnav{display:flex;gap:10px;align-items:center}
  .mnav label{font-weight:700;font-size:1rem}
  .mnav select{flex:1;min-width:0;font-size:1.05rem;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
}

/* ---------- Tarjetas ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.step-head{padding:22px 28px 18px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:flex-start}
.big-n{flex:none;width:64px;height:64px;border-radius:16px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;
  font-family:var(--font-display);font-size:2.25rem;font-weight:800;line-height:1}
.phase{font-family:var(--font-mono);font-size:.8125rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700}
.step-head h1,.page-head h1{font-family:var(--font-display);font-size:clamp(1.75rem,4vw,2.5rem);line-height:1.1;margin:2px 0 6px;text-wrap:balance;font-weight:800}
.step-head p,.page-head p{margin:0;font-size:1.25rem;color:var(--ink-soft);max-width:60ch}
.page-head{padding:22px 28px 18px;border-bottom:1px solid var(--line)}
.body{padding:22px 28px 28px;display:flex;flex-direction:column;gap:22px}
@media (max-width:600px){.step-head,.page-head{padding:18px 16px 14px;gap:12px}.big-n{width:50px;height:50px;font-size:1.75rem}.body{padding:18px 16px 22px}}
h2.sec{font-family:var(--font-display);font-size:1.5rem;margin:0 0 10px;line-height:1.2}
h3.sub{font-family:var(--font-display);font-size:1.2rem;margin:0 0 6px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools b{font-size:1rem;margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:99px;background:var(--navy-soft);font-size:1rem;font-weight:700}
.chip svg{width:26px;height:26px}

figure{margin:0}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:zoom-in}
.fig svg{display:block;width:100%;height:auto;max-height:520px}
figcaption{font-size:1rem;color:var(--ink-soft);margin-top:8px;font-style:italic;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.zoom{flex:none;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.95rem;font-weight:700;cursor:pointer;font-style:normal}

.howto ol{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.howto li{counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;font-size:1.25rem}
.howto li::before{content:counter(s);width:40px;height:40px;border-radius:50%;border:2.5px solid var(--navy);color:var(--navy);display:grid;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:1.25rem;line-height:1}
.howto li strong{color:var(--navy)}
.mm{font-family:var(--font-mono);font-weight:700;background:var(--navy-soft);padding:0 6px;border-radius:5px;white-space:nowrap;font-size:.92em}

.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.box{border-radius:14px;padding:14px 16px;font-size:1.125rem}
.box h3{margin:0 0 6px;font-family:var(--font-display);font-size:1.25rem;display:flex;align-items:center;gap:8px}
.box ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.box.warn{background:var(--warn-soft);border:2px solid var(--warn)} .box.warn h3{color:var(--warn)}
.box.tip{background:var(--ok-soft);border:2px solid var(--ok)} .box.tip h3{color:var(--ok)}
.box.word{background:var(--navy-soft);border:2px solid var(--navy)} .box.word h3{color:var(--navy)}
.box.info{background:var(--navy-soft);border:0}
.box .ico{width:28px;height:28px;flex:none}

.check{background:var(--accent-soft);border-radius:14px;padding:16px 18px}
.check ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.check label{display:flex;gap:12px;align-items:flex-start;font-size:1.2rem;cursor:pointer;padding:6px 8px;border-radius:10px}
.check label:hover{background:var(--card)}
.check input{width:26px;height:26px;flex:none;margin-top:1px;accent-color:var(--ok);cursor:pointer}
.check input:checked + span{text-decoration:line-through;color:var(--ink-soft)}
.allok{margin:10px 0 0;font-weight:700;color:var(--ok)}

.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 28px;border-top:1px solid var(--line);background:var(--paper)}
@media (max-width:600px){.pager{padding:14px 16px}}
.btn{border:0;border-radius:12px;padding:12px 20px;font-size:1.125rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;text-align:center}
.btn.prev,.btn.ghost{background:var(--card);border:2px solid var(--line)}
.btn.next,.btn.main{background:var(--accent);color:var(--on-accent)}
.btn.next{margin-left:auto}
.btn.danger{background:var(--card);border:2px solid var(--warn);color:var(--warn)}
.btn.small{min-height:40px;padding:8px 14px;font-size:1rem}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:1.125rem;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--font-display);font-size:1.05rem;background:var(--navy-soft)}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.grid-tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tool{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.tool svg{width:70px;height:70px}
.tool b{font-size:1.05rem;line-height:1.2}
.tool span{font-size:.9rem;color:var(--ink-soft);line-height:1.3}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.role{border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.role b{font-family:var(--font-display);font-size:1.25rem;color:var(--navy);display:block}
.role span{font-size:1.05rem}

/* ---------- Formularios ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-weight:700;font-size:1.05rem}
.field .hint{font-size:.95rem;color:var(--ink-soft);margin:-2px 0 2px}
.field input[type=text],.field input[type=date],.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-size:1.1rem}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--navy);outline:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:1rem;background:var(--paper)}
.pill input{width:18px;height:18px;accent-color:var(--navy);margin:0}
.pill:has(input:checked){border-color:var(--navy);background:var(--navy-soft);font-weight:700}
.member{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:center}
@media (max-width:600px){.member{grid-template-columns:minmax(0,1fr) auto}.member select{grid-column:1/2}}
.iconbtn{border:2px solid var(--line);background:var(--card);border-radius:10px;min-width:44px;padding:0 8px;height:44px;cursor:pointer;font-size:1.25rem;line-height:1}
.panel-sec{border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:14px;background:var(--card)}
.secnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--on-navy);font-family:var(--font-display);font-weight:800;margin-right:8px;font-size:1.05rem;vertical-align:middle}
.note{font-size:1rem;color:var(--ink-soft)}
.msg{font-weight:700;color:var(--ok);font-size:1rem}
.msg.err{color:var(--warn)}

/* Diario */
.entry{border:2px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--paper);display:flex;flex-direction:column;gap:8px}
.entry-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.entry-h b{font-family:var(--font-display);font-size:1.3rem}
.entry-h .d{font-family:var(--font-mono);color:var(--ink-soft);font-size:.95rem}
.entry dl{margin:0;display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:4px 14px}
.entry dt{font-weight:700;color:var(--navy)}
.entry dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:600px){.entry dl{grid-template-columns:minmax(0,1fr)} .entry dd{margin-bottom:6px}}
.tagstep{display:inline-block;background:var(--navy-soft);border-radius:99px;padding:1px 10px;margin:2px 4px 2px 0;font-size:.95rem}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.photo{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.photo .pc{padding:8px;display:flex;gap:6px}
.photo .pc input{flex:1;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:.95rem}

/* Ajustes */
.drawer{position:fixed;inset:0;z-index:30;background:rgba(10,14,22,.55);display:flex;justify-content:flex-end}
.drawer-in{background:var(--card);width:min(440px,100%);height:100%;overflow:auto;padding:20px max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) 20px;
  padding-top:max(20px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:20px;box-shadow:-10px 0 30px rgba(0,0,0,.25)}
.drawer-in h2{font-family:var(--font-display);font-size:1.6rem;margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:1rem}
.seg button[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--on-navy)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.sw{border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;background:var(--paper);display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-weight:700;font-size:.95rem}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.sw i{display:flex;gap:4px}
.sw i span{width:22px;height:22px;border-radius:6px;display:block;border:1px solid rgba(0,0,0,.15)}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:20;background:rgba(10,14,22,.82);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb-in{background:var(--paper);border-radius:16px;width:min(1400px,100%);max-height:100%;overflow:auto;padding:16px}
.lb-in svg{width:100%;height:auto;display:block}
.lb-close{position:sticky;top:0;float:right;background:var(--accent);color:var(--on-accent);border:0;border-radius:99px;padding:8px 18px;font-size:1.1rem;font-weight:700;cursor:pointer;z-index:2}
.reset{margin-top:14px;font-size:.9rem;background:none;border:1px dashed var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--ink-soft);width:100%}
.reset.sure{border-color:var(--warn);color:var(--warn);font-weight:700}
.foot{font-size:.875rem;color:var(--ink-soft);margin-top:16px;text-align:center}

/* Documento de la memoria (vista previa e impresión) */
.doc{background:#fff;color:#16203a;border:1px solid var(--line);border-radius:12px;padding:32px;font-size:16px;line-height:1.5;font-family:var(--font-body);letter-spacing:normal;word-spacing:normal}
.doc h1{font-family:var(--font-display);font-size:30px;margin:0 0 6px;color:#1f3a6e}
.doc h2{font-family:var(--font-display);font-size:22px;color:#1f3a6e;border-bottom:2px solid #e2681a;padding-bottom:4px;margin:28px 0 10px}
.doc h3{font-size:17px;margin:16px 0 6px}
.doc p{margin:0 0 8px;white-space:pre-wrap}
.doc table{min-width:0;font-size:14px}
.doc th{background:#e4eaf6;color:#16203a;font-family:var(--font-body)}
.doc th,.doc td{border:1px solid #c9d1e0;padding:6px 8px}
.doc .cover{text-align:center;padding:30px 0 10px}
.doc .cover .sub{font-size:18px;color:#4a5672}
.doc .cover dl{display:inline-grid;grid-template-columns:auto auto;gap:6px 16px;text-align:left;margin:20px auto 0;font-size:16px}
.doc .cover dt{font-weight:700}
.doc .cover dd{margin:0}
.doc .figs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.doc .figs figure{border:1px solid #c9d1e0;border-radius:8px;padding:6px;break-inside:avoid}
.doc .figs figcaption{font-size:13px;color:#4a5672;display:block}
.doc .pimg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.doc .pimg figure{break-inside:avoid}

    css+=':root[data-pal="'+k+'"]{'+decl(PAL[k].l)+'}';

function applySettings(){
  var r=document.documentElement;
  if(!PAL[S.pal]) S.pal='taller';
  r.setAttribute('data-pal',S.pal);
  if(S.theme==='light'||S.theme==='dark') r.setAttribute('data-theme',S.theme); else r.removeAttribute('data-theme');
  if(SCALES.indexOf(S.scale)<0) S.scale=1;
  r.style.setProperty('--scale',String(S.scale));
  r.setAttribute('data-spacing',S.spacing==='wide'?'wide':'normal');
  r.setAttribute('lang',S.lang);
  document.title=S.lang==='en'?'Desk organiser':'Organizador de escritorio';
}

function extraBlock(kind){
  if(kind==='intro'){
    return '<section class="howto"><h2 class="sec">'+I('partsT')+'</h2><ol><li><span>'+I('p1')+'</span></li><li><span>'+I('p2')+'</span></li><li><span>'+I('p3')+'</span></li></ol></section>'+
      '<section><h2 class="sec">'+I('rolesT')+'</h2><div class="roles">'+ROLE_KEYS.map(function(r){ return '<div class="role"><b>'+t('roles')[r]+'</b><span>'+ROLE_DESC[S.lang][r]+'</span></div>'; }).join('')+'</div><p style="font-size:1.125rem;margin:10px 0 0">'+I('rolesN')+'</p></section>'+
      '<div class="box info"><h3>'+I('diaryT')+'</h3><p style="margin:0">'+I('diaryP')+'</p></div>';
  }
  if(kind==='material'){
    var h=t('docMatT');
    return '<div class="tbl"><table><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>'+KIT[S.lang].map(function(r){ return '<tr><td>'+r[0]+'</td><td class="num">'+r[1]+'</td><td>'+r[2]+'</td><td class="num">'+r[3]+'</td></tr>'; }).join('')+'</tbody></table></div>'+
      '<section><h2 class="sec">'+I('toolsT')+'</h2><div class="grid-tools">'+TOOL_LIST.map(function(k){ var u=TOOL_USE[S.lang][k].split('|'); return '<div class="tool">'+ico(k)+'<b>'+(u[0]||TN(k))+'</b><span>'+u[1]+'</span></div>'; }).join('')+'</div></section>';
  }
  if(kind==='safety'){
    return '<div class="grid-tools" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">'+SAFETY[S.lang].map(function(r){ return '<div class="tool">'+ico(r[0])+'<b>'+r[1]+'</b><span style="font-size:1rem">'+r[2]+'</span></div>'; }).join('')+'</div>'+
      '<div class="box warn"><h3>'+(S.lang==='en'?'Hair, clothes and jewellery':'Pelo, ropa y joyas')+'</h3><ul>'+(S.lang==='en'?'<li>Tie long hair back.</li><li>No bracelets, necklaces or loose sleeves near the drill.</li>':'<li>Pelo largo recogido.</li><li>Nada de pulseras, colgantes ni mangas sueltas cerca del taladro.</li>')+'</ul></div>';

      '<div class="row"><button class="btn main" type="button" data-view="memo">'+I('memoGo')+'</button></div>';

function figHTML(k,cap){
  return '<figure><div class="fig" data-fig="'+k+'" tabindex="0" role="button" aria-label="'+esc(t('zoom'))+'">'+FIG[k]()+'</div><figcaption><span>'+(cap||'')+'</span><button class="zoom" type="button" data-fig="'+k+'">'+t('zoom')+'</button></figcaption></figure>';
}

var view='guide', cur=0;
var elWrap=document.getElementById('wrap');
function isDone(i){ var s=STEPS()[i]; if(!s.check||!s.check.length) return false; for(var j=0;j<s.check.length;j++){ if(!D.checks[s.id+'_'+j]) return false; } return true; }
function totals(){ var tt=0,d=0; STEPS_ES.forEach(function(s){ s.check.forEach(function(c,j){ tt++; if(D.checks[s.id+'_'+j]) d++; }); }); return {t:tt,d:d}; }

function renderTop(){
  document.getElementById('brandSmall').textContent=t('brandSmall');
  document.getElementById('brandTitle').textContent=t('brandTitle');
  var gear='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>';
  document.getElementById('tabs').innerHTML=
    tabBtn('guide',t('tabGuide'))+tabBtn('diary',t('tabDiary'))+tabBtn('memo',t('tabMemo'))+
    '<button class="tab" type="button" data-lang="'+(S.lang==='es'?'en':'es')+'" aria-label="'+(S.lang==='es'?'English':'Español')+'" lang="'+(S.lang==='es'?'en':'es')+'">'+(S.lang==='es'?'EN':'ES')+'</button>'+
    '<button class="tab icon" type="button" id="openSet">'+gear+t('tabSet')+'</button>';
  var tt=totals(), p=tt.t?Math.round(tt.d*100/tt.t):0;
  document.getElementById('bar').style.width=p+'%';
  document.getElementById('progtxt').textContent=t('progress')(p);
}
function tabBtn(v,label){ return '<button class="tab" type="button" data-view="'+v+'"'+(view===v?' aria-current="page"':'')+'>'+label+'</button>'; }

function render(){
  applySettings(); renderTop();
  if(view==='guide') renderGuide();
  else if(view==='diary') renderDiary();
  else renderMemo();
}

function renderGuide(){
  var st=STEPS(); cur=Math.max(0,Math.min(st.length-1,cur)); var s=st[cur];
  elWrap.className='wrap';
  var nav='<aside class="nav noprint" aria-label="'+esc(t('stepsTitle'))+'"><h2>'+t('stepsTitle')+'</h2><ol>'+st.map(function(x,i){
    return '<li><button type="button" data-go="'+i+'"'+(i===cur?' aria-current="step"':'')+'><span class="n">'+i+'</span><span>'+x.title+'</span>'+(isDone(i)?'<span class="done" aria-label="ok">✔</span>':'<span></span>')+'</button></li>'; }).join('')+
    '</ol><button class="reset" id="reset" type="button">'+t('resetChecks')+'</button></aside>';
  var h='<header class="step-head"><div class="big-n" aria-hidden="true">'+cur+'</div><div style="min-width:0"><div class="phase">'+s.phase+'</div><h1>'+s.title+'</h1><p>'+s.lead+'</p></div></header><div class="body">';
  if(s.tools) h+='<div class="tools"><b>'+t('need')+'</b>'+s.tools.map(function(k){return '<span class="chip">'+ico(k)+TN(k)+'</span>';}).join('')+'</div>';
  if(s.fig) h+=figHTML(s.fig,s.cap);

}

function saveEntryFromForm(){
  var g=function(id){ var el=document.getElementById(id); return el?el.value.trim():''; };
  var did=g('e_did'), msg=document.getElementById('entryMsg');
  if(!did){ msg.textContent=t('needText'); msg.className='msg err'; document.getElementById('e_did').focus(); return; }
  var steps=[].slice.call(document.querySelectorAll('input[name=e_steps]:checked')).map(function(x){return x.value;});
  var mEl=document.querySelector('input[name=e_mood]:checked');
  var obj={date:g('e_date')||todayISO(),steps:steps,did:did,prob:g('e_prob'),sol:g('e_sol'),who:g('e_who'),next:g('e_next'),mood:mEl?parseInt(mEl.value,10):0};
  if(editing){ D.diary.forEach(function(x){ if(x.id===editing){ Object.keys(obj).forEach(function(k){ x[k]=obj[k]; }); } }); }
  else { obj.id='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); obj.created=Date.now(); D.diary.push(obj); }
  editing=null; D.draft=null; D.draftFor=null;
  var ok=save(); render();
  var m2=document.getElementById('entryMsg'); if(m2){ m2.textContent=ok?t('entrySaved'):t('saveFail'); m2.className=ok?'msg':'msg err'; }
}

    var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();

  h+='<h2>8. '+t('m9')+'</h2>'+(D.photos.length?'<div class="pimg">'+D.photos.map(function(p){ return '<figure><img src="'+p.data+'" alt="'+esc(p.cap||'')+'"'+(forWord?' width="300"':'')+'><figcaption>'+esc(p.cap||'')+'</figcaption></figure>'; }).join('')+'</div>':'<p class="empty">'+t('docEmpty')+'</p>');
  var fin=STEPS()[14];
  h+='<h2>9. '+t('m10')+'</h2><h3>'+t('m10a')+'</h3>'+val(D.memo.learned)+'<h3>'+t('m10b')+'</h3>'+val(D.memo.improve)+'<h3>'+t('m10c')+'</h3>'+val(D.memo.team)+
    '<h3>'+t('docCheck')+'</h3><ul>'+fin.check.map(function(c,j){ return '<li>'+(D.checks['final_'+j]?'☑ ':'☐ ')+esc(c)+'</li>'; }).join('')+'</ul>'+
    '<h3>'+t('m10d')+'</h3>'+val(D.memo.grade);
  h+='<h2>10. '+t('annex')+'</h2>'+(diary.length?'<table><thead><tr>'+t('docDiaryCols').map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>'+diary.map(function(e,i){
      return '<tr><td>'+(i+1)+'</td><td>'+fmtDate(e.date)+'</td><td>'+(e.steps||[]).map(function(id){return stepNum(id);}).join(', ')+'</td><td>'+esc(e.did)+'</td><td>'+esc(e.who)+'</td><td>'+(e.mood?t('moods')[e.mood-1]:'')+'</td></tr>'; }).join('')+'</tbody></table>':'<p class="empty">'+t('docEmpty')+'</p>');
  return h;
}
function docText(){
  var tmp=document.createElement('div'); tmp.innerHTML=buildDoc(true);
  tmp.querySelectorAll('h1,h2,h3,p,li,tr,dt,dd,figcaption').forEach(function(el){ el.insertAdjacentText('afterend','\n'); });
  tmp.querySelectorAll('h2').forEach(function(el){ el.insertAdjacentText('beforebegin','\n'); });
  tmp.querySelectorAll('td,th').forEach(function(el){ el.insertAdjacentText('afterend',' | '); });
  return tmp.textContent.replace(/\n{3,}/g,'\n\n').trim();
}
function wordDoc(){
  var css='body{font-family:Calibri,Arial,sans-serif;font-size:12pt;color:#16203a}h1{color:#1f3a6e}h2{color:#1f3a6e;border-bottom:2px solid #e2681a}table{border-collapse:collapse;width:100%}th,td{border:1px solid #c9d1e0;padding:4px 6px;text-align:left;vertical-align:top}th{background:#e4eaf6}.empty{color:#8a93a8;font-style:italic}.cover{text-align:center}';
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>'+esc(t('docTitle'))+'</title><style>'+css+'</style></head><body>'+buildDoc(true)+'</body></html>';
}

/* ---------- Fotos ---------- */
function addPhotos(files){
  var msg=document.getElementById('photoMsg');
  var room=6-D.photos.length; if(room<=0){ if(msg){msg.textContent=t('photoMax');msg.className='msg err';} return; }
  var arr=[].slice.call(files).filter(function(f){return /^image\//.test(f.type);}).slice(0,room), done=0, failed=false;
  if(!arr.length) return;
  arr.forEach(function(f){
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        try{
          var max=1100, w=img.width, hgt=img.height, k=Math.min(1,max/Math.max(w,hgt));
          var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(hgt*k);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          D.photos.push({data:c.toDataURL('image/jpeg',0.72),cap:''});
          if(!save()){ D.photos.pop(); failed=true; }
        }catch(e){ failed=true; }
        finish();
      };
      img.onerror=function(){ failed=true; finish(); };
      img.src=r.result;
    };
    r.onerror=function(){ failed=true; finish(); };
    r.readAsDataURL(f);
  });
  function finish(){ done++; if(done===arr.length){ render(); var m=document.getElementById('photoMsg'); if(m&&failed){ m.textContent=t('photoErr'); m.className='msg err'; } } }
}

/* ---------- Ajustes ---------- */
function renderSettings(){
  var el=document.getElementById('drawerIn');
  function seg(name,opts,curV){ return '<div class="seg" role="group">'+opts.map(function(o){ return '<button type="button" data-set="'+name+'" data-v="'+o[0]+'" aria-pressed="'+(String(curV)===String(o[0]))+'">'+o[1]+'</button>'; }).join('')+'</div>'; }
  var h='<div class="row" style="justify-content:space-between"><h2 id="setTitle">'+t('setTitle')+'</h2><button class="btn ghost small" type="button" id="closeSet">'+t('setClose')+'</button></div>';
  h+='<div class="field"><span class="lab">'+t('setLang')+'</span>'+seg('lang',[['es','Español'],['en','English']],S.lang)+'</div>';
  h+='<div class="field"><span class="lab">'+t('setSize')+'</span>'+seg('scale',SCALES.map(function(sc,i){return [sc,t('sizes')[i]];}),S.scale)+'</div>';
  h+='<div class="field"><span class="lab">'+t('setTheme')+'</span>'+seg('theme',[['auto',t('themes').auto],['light',t('themes').light],['dark',t('themes').dark]],S.theme)+'</div>';
  h+='<div class="field"><span class="lab">'+t('setPal')+'</span><div class="swatches">'+Object.keys(PAL).map(function(k){ var p=PAL[k].l;
    return '<button type="button" class="sw" data-set="pal" data-v="'+k+'" aria-pressed="'+(S.pal===k)+'"><i><span style="background:'+p.band+'"></span><span style="background:'+p.accent+'"></span><span style="background:'+p['navy-soft']+'"></span></i>'+t('pal')[k]+'</button>'; }).join('')+'</div></div>';
  h+='<div class="field"><span class="lab">'+t('setSpacing')+'</span>'+seg('spacing',[['normal',t('spacings').normal],['wide',t('spacings').wide]],S.spacing)+'</div>';
  h+='<p class="note" style="margin:0">'+t('setNote')+'</p><div><button class="btn ghost small" type="button" id="resetSet">'+t('setReset')+'</button></div>';
  el.innerHTML=h;
}
var setReturn=null;
function openSettings(){ setReturn=document.activeElement; renderSettings(); document.getElementById('drawer').hidden=false; var b=document.getElementById('closeSet'); if(b) b.focus(); }
function closeSettings(){ document.getElementById('drawer').hidden=true; var o=document.getElementById('openSet'); if(o) o.focus(); }

/* ===================================================================
   8. EVENTOS
   =================================================================== */
function setHash(h){ try{ history.replaceState(null,'','#'+h); }catch(e){} }
function goStep(i,scroll){ cur=i; view='guide'; render(); setHash('paso-'+cur); if(scroll) window.scrollTo({top:0,behavior:'smooth'}); }
function goView(v){ if(view==='diary'&&document.getElementById('e_did')) D.draft=readForm(),D.draftFor=editing||null,save(); view=v; render(); setHash(v==='guide'?'paso-'+cur:(v==='diary'?'diario':'memoria')); window.scrollTo({top:0}); }

var confirmState={};
function twoStep(btn,key,sureText,action){
  if(confirmState[key]){ clearTimeout(confirmState[key].t); delete confirmState[key]; action(); return; }
  var orig=btn.textContent; btn.textContent=sureText; btn.classList.add('sure');
  confirmState[key]={t:setTimeout(function(){ delete confirmState[key]; if(document.body.contains(btn)){ btn.textContent=orig; btn.classList.remove('sure'); } },4500)};
}
var pendingImport=null;

document.addEventListener('click',function(e){
  var el;
  if((el=e.target.closest('[data-view]'))){ goView(el.getAttribute('data-view')); return; }
  if((el=e.target.closest('[data-lang]'))){ S.lang=el.getAttribute('data-lang'); save(); render(); return; }
  if((el=e.target.closest('#openSet'))){ openSettings(); return; }
  if((el=e.target.closest('#closeSet'))){ closeSettings(); return; }
  if(e.target.id==='drawer'){ closeSettings(); return; }
  if((el=e.target.closest('[data-set]'))){
    var k=el.getAttribute('data-set'), v=el.getAttribute('data-v');
    if(k==='scale') v=parseFloat(v);
    S[k]=v; save(); render(); renderSettings(); var again=document.querySelector('[data-set="'+k+'"][data-v="'+el.getAttribute('data-v')+'"]'); if(again) again.focus(); return; }
  if((el=e.target.closest('#resetSet'))){ Object.keys(DEFAULT_SETTINGS).forEach(function(k2){ S[k2]=DEFAULT_SETTINGS[k2]; }); save(); render(); renderSettings(); return; }
  if((el=e.target.closest('[data-go]'))){ if(!el.disabled) goStep(parseInt(el.getAttribute('data-go'),10),true); return; }
  if((el=e.target.closest('[data-fig]'))){ if(!e.target.closest('.doc')) openLb(el.getAttribute('data-fig')); return; }
  if((el=e.target.closest('#reset'))){ twoStep(el,'reset',t('resetSure'),function(){ D.checks={}; save(); render(); }); return; }
  /* grupo */
  if((el=e.target.closest('#addMem'))){ if(D.group.members.length<6){ D.group.members.push({name:'',role:'other'}); save(); render(); var n=document.getElementById('mem_n_'+(D.group.members.length-1)); if(n) n.focus(); } return; }
  if((el=e.target.closest('[data-delmem]'))){ D.group.members.splice(parseInt(el.getAttribute('data-delmem'),10),1); save(); render(); return; }
  /* diario */
  if((el=e.target.closest('#saveEntry'))){ saveEntryFromForm(); return; }
  if((el=e.target.closest('#cancelEntry'))){ editing=null; D.draft=null; D.draftFor=null; save(); render(); return; }
  if((el=e.target.closest('[data-editentry]'))){ editing=el.getAttribute('data-editentry'); D.draft=null; D.draftFor=null; render(); var f=document.getElementById('entryForm'); if(f){ f.scrollIntoView({behavior:'smooth',block:'start'}); var d2=document.getElementById('e_did'); if(d2) d2.focus({preventScroll:true}); } return; }
  if((el=e.target.closest('[data-delentry]'))){ var id=el.getAttribute('data-delentry'); twoStep(el,'del_'+id,t('delSure'),function(){ D.diary=D.diary.filter(function(x){return x.id!==id;}); save(); render(); }); return; }
  /* fotos */
  if((el=e.target.closest('#addPhoto'))){ document.getElementById('filePhoto').click(); return; }
  if((el=e.target.closest('[data-delph]'))){ var pi=parseInt(el.getAttribute('data-delph'),10); twoStep(el,'ph_'+pi,t('delQ'),function(){ D.photos.splice(pi,1); save(); render(); }); return; }
  /* memoria */
  if((el=e.target.closest('#togglePrev'))){ showPreview=!showPreview; render(); if(showPreview){ var d3=document.getElementById('doc'); if(d3) d3.scrollIntoView({behavior:'smooth'}); } return; }
  if((el=e.target.closest('#printBtn'))){
    if(!showPreview){ showPreview=true; render(); }
    var msg=document.getElementById('memoMsg');
    setTimeout(function(){ try{ window.print(); }catch(err){ if(msg){ msg.textContent=t('printFail'); msg.className='msg err'; } } },60);
    return; }
  if((el=e.target.closest('#docBtn'))){ var ok=download(t('fileDoc')+'-'+stamp()+'.doc','application/msword',wordDoc()); var m=document.getElementById('memoMsg'); if(m&&!ok){ m.textContent=t('printFail'); m.className='msg err'; } return; }
  if((el=e.target.closest('#copyBtn'))){
    var text=docText(), m3=document.getElementById('memoMsg');
    function fail(){ if(m3){ m3.textContent=t('copyFail'); m3.className='msg err'; } if(!showPreview){ showPreview=true; render(); } }
    try{ navigator.clipboard.writeText(text).then(function(){ if(m3){ m3.textContent=t('copied'); m3.className='msg'; } },fail); }catch(err){ fail(); }
    return; }
  /* copia */
  if((el=e.target.closest('#exportBtn'))){ var ok2=download(t('fileBackup')+'-'+stamp()+'.json','application/json',JSON.stringify(D)); var bm=document.getElementById('backupMsg'); if(bm&&!ok2){ bm.textContent=t('printFail'); bm.className='msg err'; } return; }
  if((el=e.target.closest('#importBtn'))){ document.getElementById('fileImport').click(); return; }
  if((el=e.target.closest('#confirmImport'))){ if(pendingImport){ D=pendingImport; S=D.settings; pendingImport=null; save(); render(); var bm2=document.getElementById('backupMsg'); if(bm2){ bm2.textContent=t('importOk'); bm2.className='msg'; } } return; }
  if((el=e.target.closest('#wipeBtn'))){ twoStep(el,'wipe',t('wipeSure'),function(){ var keep=JSON.parse(JSON.stringify(S)); D=blankData(); D.settings=keep; S=D.settings; save(); render(); var bm3=document.getElementById('backupMsg'); if(bm3){ bm3.textContent=t('wiped'); bm3.className='msg'; } }); return; }
});

document.addEventListener('change',function(e){
  var tg=e.target;
  if(tg.id==='msel'){ goStep(parseInt(tg.value,10),true); return; }
  if(tg.matches('input[type=checkbox][data-k]')){
    D.checks[tg.getAttribute('data-k')]=tg.checked; save(); renderTop();
    var ok=document.getElementById('allok'); if(ok) ok.hidden=!isDone(cur);
    var nb=document.querySelector('.nav button[data-go="'+cur+'"] span:last-child'); if(nb){ nb.className=isDone(cur)?'done':''; nb.textContent=isDone(cur)?'✔':''; }
    return; }
  if(tg.matches('[data-tool]')){ D.memo.tools[tg.getAttribute('data-tool')]=tg.checked; save(); return; }
  if(tg.matches('select[data-mem]')){ D.group.members[parseInt(tg.getAttribute('data-mem'),10)].role=tg.value; save(); return; }
  if(tg.matches('select[data-m]')){ D.memo[tg.getAttribute('data-m')]=tg.value; save(); return; }
  if(tg.matches('input[type=date][data-g]')){ D.group[tg.getAttribute('data-g')]=tg.value; save(); return; }
  if(tg.id==='e_date'||tg.name==='e_steps'||tg.name==='e_mood'){ keepDraft(); return; }
  if(tg.id==='filePhoto'){ addPhotos(tg.files); tg.value=''; return; }
  if(tg.id==='fileImport'){
    var f=tg.files&&tg.files[0]; tg.value=''; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      var bm=document.getElementById('backupMsg');
      try{ var o=JSON.parse(r.result); if(!o||o.v!==2||typeof o.checks!=='object') throw 0; pendingImport=merge(blankData(),o);
        if(bm){ bm.innerHTML=esc(t('importSure'))+' <button class="btn main small" type="button" id="confirmImport">'+esc(t('importBtn'))+'</button>'; bm.className='msg'; } }
      catch(err){ pendingImport=null; if(bm){ bm.textContent=t('importErr'); bm.className='msg err'; } }
    };
    r.readAsText(f);
    return; }
});
var saveT=null;
document.addEventListener('input',function(e){
  var tg=e.target, changed=false;
  if(tg.matches('input[type=text][data-g]')){ D.group[tg.getAttribute('data-g')]=tg.value; changed=true; }
  else if(tg.matches('input[type=text][data-mem]')){ D.group.members[parseInt(tg.getAttribute('data-mem'),10)].name=tg.value; changed=true; }
  else if(tg.matches('textarea[data-m]')){ D.memo[tg.getAttribute('data-m')]=tg.value; changed=true; }
  else if(tg.matches('input[data-ph]')){ var p=D.photos[parseInt(tg.getAttribute('data-ph'),10)]; if(p){ p.cap=tg.value; changed=true; } }
  if(tg.id&&/^e_(did|prob|sol|who|next)$/.test(tg.id)){ keepDraft(); return; }
  if(changed){ clearTimeout(saveT); saveT=setTimeout(function(){ save(); if(showPreview&&view==='memo'){ var d=document.getElementById('doc'); if(d) d.innerHTML=buildDoc(false); } },400); }
});
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lb').hidden){ if(e.key==='Escape') closeLb(); return; }
  if(!document.getElementById('drawer').hidden){ if(e.key==='Escape') closeSettings(); return; }
  if(e.target&&e.target.classList&&e.target.classList.contains('fig')&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); openLb(e.target.getAttribute('data-fig')); return; }
  var tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='BUTTON'||view!=='guide') return;
  if(e.key==='ArrowRight'&&cur<STEPS().length-1) goStep(cur+1,true);
  if(e.key==='ArrowLeft'&&cur>0) goStep(cur-1,true);
});
window.addEventListener('beforeprint',function(){ if(view==='memo'&&!showPreview){ showPreview=true; render(); } });

/* Lightbox */
var lastFocus=null;
function openLb(k){ if(!FIG[k]) return; lastFocus=document.activeElement; document.getElementById('lbbody').innerHTML=FIG[k](); document.getElementById('lbdlg').setAttribute('aria-label',t('enlarge')); var c=document.getElementById('lbclose'); c.textContent=t('close'); document.getElementById('lb').hidden=false; c.focus(); }
function closeLb(){ document.getElementById('lb').hidden=true; document.getElementById('lbbody').innerHTML=''; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
document.getElementById('lbclose').addEventListener('click',function(e){ e.stopPropagation(); closeLb(); });
document.getElementById('lb').addEventListener('click',function(e){ if(e.target.id==='lb') closeLb(); });

/* Inicio y enlaces directos (#paso-3, #diario, #memoria) */
function route(){
  var h=location.hash||'', m=/^#paso-(\d+)$/.exec(h);
  if(m){ cur=parseInt(m[1],10); view='guide'; }
  else if(h==='#diario') view='diary';
  else if(h==='#memoria') view='memo';
  render();
}
window.addEventListener('hashchange',function(){ route(); window.scrollTo({top:0}); });
route();
})();
