// ---------- EXAM ----------
const ex = { phase:"setup", n:20, kind:"mix", name:"", list:[], orders:{}, answers:{}, i:0, date:null };
function roundRobin(pool, n){
  const byT = TOPICS.map(t=>shuffle(pool.filter(q=>q.t===t.id).map(q=>q.id))).filter(p=>p.length);
  const order = shuffle(byT.map((_,i)=>i)); const out=[]; let k=0;
  while(out.length<n && byT.some(p=>p.length)){ const p=byT[order[k%order.length]]; if(p.length) out.push(p.shift()); k++; }
  return out;
}
function pickExam(n, kind){
  if(kind==="model") return QUESTIONS.filter(q=>q.src==="model").sort((a,b)=>a.n-b.n).map(q=>q.id);
  if(kind==="test") return shuffle(roundRobin(QUESTIONS.filter(TYPE_GROUPS.test), n));
  if(kind==="written") return shuffle(roundRobin(QUESTIONS.filter(TYPE_GROUPS.written), n));
  const written = QUESTIONS.filter(TYPE_GROUPS.written);
  const nW = Math.min(written.length, Math.round(n*0.4));
  return shuffle(roundRobin(written, nW).concat(roundRobin(QUESTIONS.filter(TYPE_GROUPS.test), n-nW)));
}
function examMaxN(kind){
  if(kind==="test") return QUESTIONS.filter(TYPE_GROUPS.test).length;
  if(kind==="written") return QUESTIONS.filter(TYPE_GROUPS.written).length;
  if(kind==="model") return QUESTIONS.filter(q=>q.src==="model").length;
  return QUESTIONS.length;
}
function renderExam(focusSel){
  const v=$("#view-examen");
  if(ex.phase==="setup"){
    const max = examMaxN(ex.kind);
    const counts = [10,20,30].filter(n=>n<max).concat([max]);
    if(!counts.includes(ex.n)) ex.n = counts.includes(20)?20:counts[0];
    v.innerHTML = `<h2>${T("navExam")}</h2>
    <div class="card q-card"><p style="margin-top:0">${T("examIntro")}</p>
      <div class="row">
        <label class="field">${T("yourName")}<input type="text" id="exName" maxlength="60" autocomplete="off"></label>
        <label class="field">${T("examKind")}<select id="exKind">${["mix","test","written","model"].map(k=>`<option value="${k}"${ex.kind===k?" selected":""}>${T("ek_"+k)}</option>`).join("")}</select></label>
        <label class="field">${T("numQ")}<select id="exN"${ex.kind==="model"?" disabled":""}>${counts.map(n=>`<option value="${n}"${n===ex.n?" selected":""}>${n===max&&n>30?(LANG==="es"?`Todas (${n})`:`All (${n})`):n}</option>`).join("")}</select></label>
      </div>
      <p class="muted" style="font-size:.92rem">${T("writtenNote")}</p>
      <div style="margin-top:12px"><button class="btn orange" type="button" id="exStart">${T("startExam")} ▶</button></div>
    </div>`;
    $("#exName").value = ex.name;
    $("#exName").oninput = e=>{ ex.name = e.target.value; };
    $("#exKind").onchange = e=>{ ex.kind=e.target.value; renderExam(); };
    $("#exN").onchange = e=>{ ex.n=+e.target.value; };
    $("#exStart").onclick = ()=>{
      ex.name = $("#exName").value.trim().slice(0,60);
      ex.n = +$("#exN").value;
      ex.list = pickExam(ex.n, ex.kind);
      ex.orders={}; ex.list.forEach(id=>{ const q=QUESTIONS[id]; if(q.type==="mc") ex.orders[id]=shuffle(q.o.map((_,i)=>i)); });
      ex.answers={}; ex.i=0; ex.phase="run"; ex.date=new Date();
      renderExam(); window.scrollTo({top:0});
    };
    return;
  }
  if(ex.phase==="run"){
    const id=ex.list[ex.i], q=QUESTIONS[id];
    const st={ans:ex.answers[id], order:ex.orders[id], done:false};
    const nAns = ex.list.filter(x=>isAnswered(QUESTIONS[x],ex.answers[x])).length;
    v.innerHTML = `<h2>${T("navExam")}</h2>
    <div class="card q-card">
      <div class="q-meta"><span><b>${T("question")} ${ex.i+1} ${T("of")} ${ex.list.length}</b> · <span class="tag">${typeLabel(q)}</span> · ${fmtPts(q.pts)} ${T("ptsShort")}</span><span id="exAnsCount">${T("answered")}: ${nAns}/${ex.list.length}</span></div>
      <div class="progress" style="margin-bottom:14px"><span id="exBar" style="width:${nAns/ex.list.length*100}%"></span></div>
      ${q.type==="fill"?`<div class="q-text">${T("fillIntro")}</div>`:`<div class="q-text">${esc(q.q[LANG])}</div>`}
      <div id="exArea">${answerAreaHTML(q, st)}</div>
      <div class="dots" aria-label="${T("goTo")}">${ex.list.map((qid,k)=>`<button type="button" data-go="${k}" class="${isAnswered(QUESTIONS[qid],ex.answers[qid])?"ans":""}${k===ex.i?" cur":""}" aria-label="${T("question")} ${k+1}">${k+1}</button>`).join("")}</div>
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost" type="button" id="exPrev"${ex.i===0?" disabled":""}>◀ ${T("prev")}</button>
        <button class="btn red" type="button" id="exFinish">${T("finish")}</button>
        <button class="btn ghost" type="button" id="exNext"${ex.i>=ex.list.length-1?" disabled":""}>${T("next")} ▶</button>
      </div>
    </div>`;
    bindAnswerArea($("#exArea"), q, st, (a, rerender, fsel)=>{
      ex.answers[id]=a;
      if(rerender){ renderExam(fsel); return; }
      // light update without re-rendering (keeps typing focus)
      const n = ex.list.filter(x=>isAnswered(QUESTIONS[x],ex.answers[x])).length;
      $("#exAnsCount").textContent = `${T("answered")}: ${n}/${ex.list.length}`;
      $("#exBar").style.width = (n/ex.list.length*100)+"%";
      const dot = v.querySelector(`[data-go="${ex.i}"]`); if(dot) dot.classList.toggle("ans", isAnswered(q,a));
    });
    $$("[data-go]",v).forEach(b=>b.onclick=()=>{ ex.i=+b.dataset.go; renderExam(); });
    $("#exPrev").onclick=()=>{ if(ex.i>0){ex.i--; renderExam();} };
    $("#exNext").onclick=()=>{ if(ex.i<ex.list.length-1){ex.i++; renderExam();} };
    $("#exFinish").onclick=()=>{
      const missing = ex.list.filter(x=>!isAnswered(QUESTIONS[x],ex.answers[x])).length;
      if(missing>0 && !window.confirm(T("confirmFinish").replace("{n}",missing))) return;
      ex.phase="done"; renderExam(); window.scrollTo({top:0});
    };
    if(focusSel){ const f=v.querySelector(focusSel); if(f && !f.disabled) f.focus({preventScroll:true}); }
    return;
  }
  // results
  const L=LANG;
  const total=ex.list.length;
  const max = ex.list.reduce((s,id)=>s+QUESTIONS[id].pts,0);
  const got = ex.list.reduce((s,id)=>s+scoreQ(QUESTIONS[id],ex.answers[id])*QUESTIONS[id].pts,0);
  const full = ex.list.filter(id=>scoreQ(QUESTIONS[id],ex.answers[id])===1).length;
  const grade = Math.round(got/max*100)/10;
  const msg = T("gradeMsg").find(([min])=>grade>=min)[1];
  const byT = {}; ex.list.forEach(id=>{ const q=QUESTIONS[id]; byT[q.t]=byT[q.t]||{h:0,n:0}; byT[q.t].n+=q.pts; byT[q.t].h+=scoreQ(q,ex.answers[id])*q.pts; });
  const loc = L==="es"?"es-ES":"en-GB";
  const dateStr = ex.date ? ex.date.toLocaleDateString(loc,{day:"2-digit",month:"2-digit",year:"numeric"})+" "+ex.date.toLocaleTimeString(loc,{hour:"2-digit",minute:"2-digit"}) : "";
  v.innerHTML = `<h2 class="no-print">${T("navExam")}</h2>
  <div class="card result-print">
    <p class="muted" style="margin:0 0 6px">${T("examOf")} · ${esc(T("unitTitle"))} · ${T("ek_"+ex.kind)}<br>${ex.name?`<b id="exNameOut"></b> · `:""}${T("date")}: ${dateStr}</p>
    <div class="score-wrap">
      <div><div class="muted">${T("yourGrade")}</div><div class="score-big">${grade.toLocaleString(loc,{minimumFractionDigits:1,maximumFractionDigits:1})}</div><div class="muted">${T("outOf")}</div></div>
      <div style="flex:1;min-width:220px"><p style="font-size:1.15rem;font-weight:700;color:var(--navy)">${msg}</p>
        <div class="stats"><span>${T("points")}: ${fmtPts(got)} / ${fmtPts(max)}</span><span>✔ ${full} / ${total}</span><span>${Math.round(got/max*100)} %</span></div></div>
    </div>
    <h3 style="margin-top:18px">${T("byTopic")}</h3>
    <div class="doc tbl-scroll"><table><tr><th>${T("topic")}</th><th style="width:140px">${T("points")}</th></tr>
      ${TOPICS.filter(t=>byT[t.id]).map(t=>`<tr><td>${esc(t[L])}</td><td>${fmtPts(byT[t.id].h)} / ${fmtPts(byT[t.id].n)}</td></tr>`).join("")}</table></div>
    <div class="row no-print" style="margin:8px 0 6px">
      <button class="btn orange" type="button" id="exAgain">${T("repeatExam")}</button>
      <button class="btn ghost" type="button" id="exPrint">🖨️ ${T("printResult")}</button>
    </div>
    <h3 style="margin-top:18px">${T("reviewTitle")}</h3>
    ${ex.list.map((id,k)=>{ const q=QUESTIONS[id], a=ex.answers[id], f=scoreQ(q,a), gt=givenText(q,a,L);
      const cls = f===1?"ok":(f>0?"part":"ko");
      let extra = "";
      if(q.type==="open" && isAnswered(q,a)){ const found=openFound(q,a); extra = `<br><span class="muted">${T("keyIdeas")}: ${q.groups.map((g,i)=>`${found[i]?"✔":"✘"} ${esc(g[L])}`).join(" · ")}</span>`; }
      return `<div class="review-item ${cls}"><b>${k+1}. ${esc(promptText(q,L))}</b> <span class="muted">(${fmtPts(f*q.pts)} / ${fmtPts(q.pts)} ${T("ptsShort")})</span><br>
        ${T("yourAnswer")} ${gt===null?`<i>${T("noAnswer")}</i>`:esc(gt)} ${f===1?"✔":(f>0?"◐":"✘")}${extra}
        ${f<1?`<br>${q.type==="open"?T("modelAnswer"):T("rightAnswer")} <b>${esc(answerText(q,L))}</b>`:""}
        ${q.x?`<br><span class="muted">${esc(q.x[L])}</span>`:""}</div>`;}).join("")}
  </div>`;
  const no=$("#exNameOut"); if(no) no.textContent = ex.name;
  $("#exAgain").onclick=()=>{ ex.phase="setup"; renderExam(); };
  $("#exPrint").onclick=()=>window.print();
}

// ---------- NOTES (printable) ----------
const nt = { bw: store.get("bw",false), sol: store.get("incSol",true), bank: store.get("incBank",false) };
function renderNotes(){
  const v=$("#view-apuntes");
  const secs = SECTIONS.map((s,i)=>`
    <section class="nsec doc"><h2><span class="n">${i+1}.</span> ${s[LANG].title}</h2>${s[LANG].html()}</section>`).join("");
  const bank = !nt.bank ? "" : `<section class="nsec doc"><h2>${T("bankTitle")}</h2>
    ${TOPICS.map((t,ti)=>{ const qs=QUESTIONS.filter(q=>q.t===t.id); return `<h3>${ti+1}. ${esc(t[LANG])}</h3>`+
      qs.map((q,k)=>`<div class="bank-q"><b>${k+1}. ${esc(promptText(q,LANG))}</b>${fcExtra(q,LANG)}✔ ${esc(answerText(q,LANG))}</div>`).join(""); }).join("")}</section>`;
  v.innerHTML = `
  <h2 class="no-print">${T("navNotes")}</h2>
  <div class="card print-controls no-print">
    <p style="margin-top:0">${T("notesIntro")}</p>
    <div class="row" style="gap:28px;align-items:flex-start">
      <fieldset><legend>${T("printMode")}</legend>
        <label><input type="radio" name="pm" value="color"${!nt.bw?" checked":""}> ${T("color")}</label>
        <label><input type="radio" name="pm" value="bw"${nt.bw?" checked":""}> ${T("bw")}</label></fieldset>
      <fieldset><legend>${T("include")}</legend>
        <label><input type="checkbox" id="ntSol"${nt.sol?" checked":""}> ${T("incSol")}</label>
        <label><input type="checkbox" id="ntBank"${nt.bank?" checked":""}> ${T("incBank")}</label></fieldset>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn orange" type="button" id="ntPrint">🖨️ ${T("printBtn")}</button></div>
    <p class="muted" style="margin:10px 0 0;font-size:.9rem">${T("printTip")}</p>
  </div>
  <article class="notes${nt.bw?" bw":""}${nt.sol?" show-sol":""}" id="notesDoc">
    <div class="cover">
      <span class="tag orange">${T("heroKicker")}</span>
      <h1>${T("unitTitle").replace(/^U1 · /,"")}</h1>
      <div class="sub">${T("coverSub")}</div>
      <div class="student"><div>${T("name")} <span>&nbsp;</span></div><div>${T("group")} <span style="min-width:90px">&nbsp;</span></div></div>
      <div class="toc doc" style="text-align:left;margin-top:22px"><h3>${T("toc")}</h3>
        <ol>${SECTIONS.map(s=>`<li>${s[LANG].title}</li>`).join("")}${nt.bank?`<li>${T("bankTitle")}</li>`:""}</ol></div>
    </div>
    ${secs}
    ${bank}
  </article>`;
  // static versions of interactive bits
  const doc=$("#notesDoc");
  $$('[data-widget="circuit"]',doc).forEach(h=>{
    h.innerHTML = `<ul class="circuit-static">${CIRCUIT.shown.map(c=>`<li><span class="blank"></span>${esc(c[LANG])}</li>`).join("")}</ul>`;
  });
  $$("details.sol",doc).forEach(d=>{
    const div=document.createElement("div"); div.className="sol-print";
    const sm=d.querySelector("summary"); if(sm) sm.remove();
    div.innerHTML = `<b class="sl">${T("solution")}:</b>` + d.innerHTML;
    d.replaceWith(div);
  });
  $$('input[name="pm"]',v).forEach(r=>r.onchange=()=>{ if(!r.checked) return; nt.bw = (r.value==="bw"); store.set("bw",nt.bw); doc.classList.toggle("bw",nt.bw); });
  $("#ntSol").onchange=e=>{ nt.sol=e.target.checked; store.set("incSol",nt.sol); doc.classList.toggle("show-sol",nt.sol); };
  $("#ntBank").onchange=e=>{ nt.bank=e.target.checked; store.set("incBank",nt.bank); renderNotes(); };
  $("#ntPrint").onclick=()=>window.print();
}

/* =========================================================
   8. ROUTER + LANGUAGE
   ========================================================= */
const VIEWS = {inicio:renderHome, contenidos:renderContents, flashcards:renderFlash, practica:renderPractice, examen:renderExam, apuntes:renderNotes};
let currentView = "inicio";
function applyStaticI18n(){
  document.documentElement.lang = LANG;
  $$("[data-i18n]").forEach(el=>{ el.textContent = T(el.dataset.i18n); });
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===LANG)));
  document.title = T("unitTitle");
}
function route(){
  const h = (location.hash||"#inicio").slice(1).split("?")[0];
  currentView = VIEWS[h] ? h : "inicio";
  $$(".view").forEach(v=>v.classList.toggle("active", v.id==="view-"+currentView));
  $$("nav.tabs a").forEach(a=>{ if(a.dataset.view===currentView) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  VIEWS[currentView]();
}
function setLang(l){
  if(l!=="es" && l!=="en") return;
  LANG=l; store.set("lang",l);
  try{ const u=new URL(location.href); if(u.searchParams.has("lang")){ u.searchParams.set("lang",l); history.replaceState(null,"",u.toString()); } }catch(e){}
  applyStaticI18n(); VIEWS[currentView]();
}
$$(".lang button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
window.addEventListener("hashchange", ()=>{ route(); window.scrollTo({top:0}); });
applyStaticI18n();
route();
</script>
</body>
