<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U1 · El Proceso Tecnológico, el Taller y los Proyectos</title>
<meta name="description" content="Tecnología y Digitalización 1.º ESO · Unidad 1 · Estudio bilingüe (ES/EN): contenidos, flashcards, práctica, examen y apuntes imprimibles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16365c; --blue:#1f6fb2; --blue-soft:#e3eef9;
  --orange:#e8710a; --orange-soft:#fdeedd;
  --green:#2e8540; --green-soft:#e2f2e5;
  --red:#c0392b; --red-soft:#fbe5e2;
  --yellow:#f2b705; --yellow-soft:#fdf5d6;
  --purple:#7b3fa0; --purple-soft:#f1e7f7;
  --ink:#1d2733; --muted:#5b6876; --line:#c9d6e3;
  --paper:#fbfcfe; --card:#ffffff; --grid:rgba(31,111,178,.07);
  --radius:12px;
  --font-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-head:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; font-family:var(--font-body); color:var(--ink); font-size:17px; line-height:1.55;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
h1,h2,h3,h4{font-family:var(--font-head); color:var(--navy); line-height:1.15; margin:0 0 .5em; letter-spacing:.01em}
h1{font-size:2.2rem} h2{font-size:1.75rem} h3{font-size:1.3rem} h4{font-size:1.1rem}
p{margin:0 0 .8em}
button{font:inherit; cursor:pointer}
button:focus-visible, summary:focus-visible, select:focus-visible, input:focus-visible{outline:3px solid var(--orange); outline-offset:2px}
.wrap{max-width:1040px; margin:0 auto; padding:0 16px}

/* ---------- header / nav ---------- */
header.top{background:var(--navy); color:#fff; position:sticky; top:0; z-index:20; box-shadow:0 2px 8px rgba(0,0,0,.18)}
.top-row{display:flex; align-items:center; gap:12px; padding:10px 0; flex-wrap:wrap}
.brand{display:flex; flex-direction:column; flex:1; min-width:200px}
.brand small{opacity:.8; font-size:.8rem; letter-spacing:.04em; text-transform:uppercase}
.brand b{font-family:var(--font-head); font-size:1.25rem; letter-spacing:.02em}
.lang{display:flex; border:2px solid rgba(255,255,255,.6); border-radius:999px; overflow:hidden}
.lang button{background:transparent; color:#fff; border:0; padding:6px 14px; font-weight:700; font-size:.95rem}
.lang button[aria-pressed="true"]{background:var(--orange); color:#fff}
nav.tabs{display:flex; gap:4px; overflow-x:auto; padding-bottom:8px; scrollbar-width:thin}
nav.tabs a{color:#dbe7f5; text-decoration:none; padding:7px 12px; border-radius:8px; white-space:nowrap; font-weight:700; font-size:.95rem}
nav.tabs a:hover{background:rgba(255,255,255,.12); color:#fff}
nav.tabs a[aria-current="page"]{background:#fff; color:var(--navy)}

main{padding:24px 0 60px}
.view{display:none}
.view.active{display:block}

/* ---------- generic ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:0 1px 3px rgba(22,54,92,.06)}
.btn{display:inline-flex; align-items:center; gap:6px; border:2px solid var(--navy); background:var(--navy); color:#fff; padding:9px 16px; border-radius:10px; font-weight:700; font-size:.98rem; text-decoration:none}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:#fff; color:var(--navy)}
.btn.orange{background:var(--orange); border-color:var(--orange)}
.btn.green{background:var(--green); border-color:var(--green)}
.btn.red{background:var(--red); border-color:var(--red)}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.muted{color:var(--muted)}
label.field{display:flex; flex-direction:column; gap:4px; font-weight:700; font-size:.92rem; color:var(--navy)}
select,input[type=text]{font:inherit; padding:8px 10px; border:2px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); min-width:180px}
.tag{display:inline-block; font-family:var(--font-head); font-weight:700; letter-spacing:.05em; text-transform:uppercase; font-size:.85rem; padding:2px 10px; border-radius:6px; background:var(--blue-soft); color:var(--blue)}
.tag.orange{background:var(--orange-soft); color:#a34d00}
.tag.green{background:var(--green-soft); color:var(--green)}
.progress{height:10px; background:var(--blue-soft); border-radius:999px; overflow:hidden}
.progress > span{display:block; height:100%; background:var(--orange); width:0; transition:width .25s}

/* ---------- home ---------- */
.hero{display:grid; gap:18px; grid-template-columns:1.3fr 1fr; align-items:center; margin-bottom:24px}
.hero h1{font-size:2.6rem}
.hero .formula-mini{font-family:var(--font-head); font-size:1.6rem; color:var(--navy)}
.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px}
.mode{display:flex; flex-direction:column; gap:6px; text-decoration:none; color:inherit; border-top:6px solid var(--blue)}
.mode:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(22,54,92,.12)}
.mode .ico{font-size:1.8rem}
.mode h3{margin:0}
.mode.c2{border-top-color:var(--orange)} .mode.c3{border-top-color:var(--green)} .mode.c4{border-top-color:var(--red)} .mode.c5{border-top-color:var(--purple)}

/* ---------- contents (accordion) ---------- */
.acc-tools{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
details.sec{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px; overflow:hidden}
details.sec > summary{list-style:none; cursor:pointer; padding:14px 18px; display:flex; align-items:center; gap:12px; font-family:var(--font-head); font-size:1.35rem; font-weight:700; color:var(--navy)}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary .num{flex:none; width:34px; height:34px; border-radius:8px; background:var(--navy); color:#fff; display:grid; place-items:center; font-size:1.1rem}
details.sec > summary::after{content:"+"; margin-left:auto; font-size:1.6rem; color:var(--orange); font-family:var(--font-body)}
details.sec[open] > summary::after{content:"–"}
details.sec[open] > summary{border-bottom:1px solid var(--line); background:var(--blue-soft)}
.sec-body{padding:16px 20px 20px}

/* ---------- content blocks (shared by screen + print) ---------- */
.doc h3{margin-top:1.1em; color:var(--blue)}
.doc ul,.doc ol{margin:0 0 .9em; padding-left:1.3em}
.doc li{margin-bottom:.25em}
.doc table{width:100%; border-collapse:collapse; margin:0 0 1em; font-size:.95rem; background:#fff}
.doc th,.doc td{border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top}
.doc th{background:var(--navy); color:#fff; font-weight:700}
.doc tr:nth-child(even) td{background:#f5f8fc}
.tbl-scroll{overflow-x:auto}
.key{border-left:6px solid var(--orange); background:var(--orange-soft); padding:10px 14px; border-radius:8px; margin:0 0 1em}
.key b:first-child{color:#a34d00}
.note{border-left:6px solid var(--blue); background:var(--blue-soft); padding:10px 14px; border-radius:8px; margin:0 0 1em}
.activity{border:2px dashed var(--orange); border-radius:10px; padding:12px 16px; margin:0 0 1em; background:#fffaf4}
.activity > .tag{margin-bottom:6px}
.activity h4{margin:.2em 0 .4em}
details.sol{margin-top:8px}
details.sol > summary{cursor:pointer; font-weight:700; color:var(--green)}
.sol-print{display:none; margin-top:8px; border-top:1px solid var(--line); padding-top:6px}
.sol-print b.sl{color:var(--green)}
.formula{display:flex; flex-wrap:wrap; align-items:stretch; gap:8px; margin:0 0 1em}
.formula .fx{flex:1 1 130px; border-radius:10px; padding:10px; text-align:center; border:2px solid}
.formula .fx b{display:block; font-family:var(--font-head); font-size:1.45rem}
.formula .op{align-self:center; font-family:var(--font-head); font-size:2rem; font-weight:700; color:var(--navy)}
.fx.c{border-color:var(--blue); background:var(--blue-soft)} .fx.c b{color:var(--blue)}
.fx.t{border-color:var(--green); background:var(--green-soft)} .fx.t b{color:var(--green)}
.fx.h{border-color:var(--orange); background:var(--orange-soft)} .fx.h b{color:#b85600}
.fx.r{border-color:var(--purple); background:var(--purple-soft)} .fx.r b{color:var(--purple)}
.twocol{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:1em}
.box{border:2px solid var(--line); border-radius:10px; padding:10px 14px; background:#fff}
.box h4{margin-top:0}
.box.blue{border-color:var(--blue)} .box.blue h4{color:var(--blue)}
.box.orange{border-color:var(--orange)} .box.orange h4{color:#b85600}
.box.green{border-color:var(--green)} .box.green h4{color:var(--green)}
.box.red{border-color:var(--red)} .box.red h4{color:var(--red)}
.box.yellow{border-color:var(--yellow)} .box.yellow h4{color:#8a6900}
.box.purple{border-color:var(--purple)} .box.purple h4{color:var(--purple)}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:1em}
.grid2{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:1em}
.mantra{font-family:var(--font-head); font-size:1.3rem; font-weight:700; text-align:center; background:var(--yellow-soft); border:3px solid var(--yellow); border-radius:10px; padding:10px; margin:0 0 1em; color:var(--ink)}
.steps{counter-reset:st; list-style:none; padding:0!important}
.steps li{counter-increment:st; position:relative; padding:6px 0 6px 44px; margin:0!important; border-bottom:1px dashed var(--line)}
.steps li::before{content:counter(st); position:absolute; left:0; top:6px; width:30px; height:30px; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:700; font-size:.95rem}
.fig{margin:0 0 1em; text-align:center}
.fig svg{max-width:100%; height:auto}
.fig figcaption{font-size:.88rem; color:var(--muted)}
.quote{font-family:var(--font-head); font-size:1.4rem; text-align:center; color:var(--navy); border:3px solid var(--navy); border-radius:12px; padding:12px 16px; margin:1em 0}

/* circuit widget */
.circuit{list-style:none; padding:0!important; margin:8px 0}
.circuit li{display:flex; align-items:center; gap:8px; background:#f3e3c8; border:1px solid #d9bf95; border-radius:8px; padding:7px 8px; margin-bottom:6px!important}
.circuit li .pos{flex:none; width:28px; height:28px; border-radius:6px; background:#fff; border:2px solid #b38b4d; display:grid; place-items:center; font-weight:700}
.circuit li .txt{flex:1}
.circuit li button{border:1px solid #b38b4d; background:#fff; border-radius:6px; width:34px; height:30px; font-weight:700}
.circuit li.ok{background:var(--green-soft); border-color:var(--green)}
.circuit li.bad{background:var(--red-soft); border-color:var(--red)}
.circuit-static{list-style:none; padding:0!important}
.circuit-static li{display:flex; gap:10px; align-items:center; margin-bottom:6px!important}
.circuit-static .blank{flex:none; width:30px; height:26px; border:2px solid var(--ink); border-radius:4px}

/* ---------- flashcards ---------- */
.fc-stage{perspective:1400px; margin:14px auto; max-width:720px}
.fc{display:grid; cursor:pointer; transition:transform .5s; transform-style:preserve-3d; min-height:280px}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:16px; padding:28px 26px; display:flex; flex-direction:column; justify-content:center; gap:10px; border:2px solid var(--navy); background:#fff; box-shadow:0 6px 18px rgba(22,54,92,.12)}
.fc-face.back{transform:rotateY(180deg); background:var(--green-soft); border-color:var(--green)}
.fc-face .lbl{font-family:var(--font-head); text-transform:uppercase; letter-spacing:.08em; font-size:.85rem; color:var(--muted)}
.fc-face .big{font-size:1.35rem; font-weight:700; color:var(--navy)}
.fc-face.back .big{color:var(--green)}
.fc-face .hint{font-size:.85rem; color:var(--muted); margin-top:auto}
.fc-nav{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; max-width:720px; margin:0 auto}

/* ---------- quiz ---------- */
.q-card{max-width:780px; margin:0 auto}
.q-meta{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:.9rem; color:var(--muted); margin-bottom:8px}
.q-text{font-size:1.25rem; font-weight:700; color:var(--navy); margin-bottom:14px}
.opts{display:flex; flex-direction:column; gap:8px}
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; border:2px solid var(--line); background:#fff; border-radius:10px; padding:10px 14px; color:var(--ink); font-size:1rem}
.opt .lt{flex:none; width:28px; height:28px; border-radius:50%; background:var(--blue-soft); color:var(--blue); display:grid; place-items:center; font-weight:700}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--blue)}}
.opt.sel{border-color:var(--blue); background:var(--blue-soft)}
.opt.sel .lt{background:var(--blue); color:#fff}
.opt.right{border-color:var(--green); background:var(--green-soft)}
.opt.right .lt{background:var(--green); color:#fff}
.opt.wrong{border-color:var(--red); background:var(--red-soft)}
.opt.wrong .lt{background:var(--red); color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:12px; padding:10px 14px; border-radius:10px; font-size:.98rem}
.fb.ok{background:var(--green-soft); border-left:6px solid var(--green)}
.fb.ko{background:var(--red-soft); border-left:6px solid var(--red)}
.dots{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0}
.dots button{width:34px; height:34px; border-radius:8px; border:2px solid var(--line); background:#fff; font-weight:700; font-size:.85rem; color:var(--ink)}
.dots button.ans{background:var(--blue-soft); border-color:var(--blue)}
.dots button.cur{border-color:var(--orange); box-shadow:0 0 0 2px var(--orange)}
.score-big{font-family:var(--font-head); font-size:4rem; font-weight:700; line-height:1; color:var(--navy)}
.score-wrap{display:flex; gap:24px; align-items:center; flex-wrap:wrap}
.review-item{border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:8px; background:#fff}
.review-item.ok{border-left:6px solid var(--green)}
.review-item.ko{border-left:6px solid var(--red)}
.review-item.part{border-left:6px solid var(--yellow)}
.fb.part{background:var(--yellow-soft); border-left:6px solid var(--yellow)}
.fill-text{font-size:1.15rem; line-height:2.2; color:var(--ink)}
input.blank{font:inherit; font-weight:700; width:12ch; max-width:100%; padding:2px 8px; border:0; border-bottom:3px solid var(--blue); background:var(--blue-soft); border-radius:6px 6px 0 0; color:var(--navy); text-align:center}
input.blank.right{border-color:var(--green); background:var(--green-soft)}
input.blank.wrong{border-color:var(--red); background:var(--red-soft)}
.match{display:flex; flex-direction:column; gap:8px}
.match-row{display:grid; grid-template-columns:1fr minmax(200px,1fr); gap:8px; align-items:center; border:2px solid var(--line); border-radius:10px; padding:8px 10px; background:#fff}
.match-row select{min-width:0; width:100%}
.match-row.right{border-color:var(--green); background:var(--green-soft)}
.match-row.wrong{border-color:var(--red); background:var(--red-soft)}
.match-row .mfix{grid-column:1/-1; color:var(--green); font-weight:700; font-size:.92rem}
textarea.open-ans{width:100%; font:inherit; padding:10px 12px; border:2px solid var(--line); border-radius:10px; resize:vertical; min-height:120px}
textarea.open-ans:focus{border-color:var(--blue); outline:none}
ul.ideas{list-style:none; padding-left:0; margin:4px 0 8px}
ul.ideas li.yes{color:var(--green)} ul.ideas li.no{color:var(--red)}
.fc-list{font-size:.95rem; color:var(--ink)}
.bank-q .fc-list{font-size:.9rem; color:var(--muted)}
.stats{display:flex; gap:14px; flex-wrap:wrap; font-weight:700}
.stats span{background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 12px}

/* ---------- notes (apuntes) ---------- */
.print-controls{margin-bottom:18px}
.print-controls fieldset{border:0; padding:0; margin:0; display:flex; gap:14px; flex-wrap:wrap}
.print-controls legend{font-weight:700; color:var(--navy); margin-bottom:4px}
.print-controls label{display:flex; gap:6px; align-items:center}
.notes{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:28px 34px}
.notes .cover{text-align:center; border-bottom:4px solid var(--navy); padding-bottom:18px; margin-bottom:18px}
.notes .cover h1{font-size:2.3rem; margin-bottom:.2em}
.notes .cover .sub{font-size:1.05rem; color:var(--muted)}
.notes .student{display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:14px; font-weight:700}
.notes .student span{border-bottom:1.5px solid var(--ink); min-width:220px; display:inline-block; text-align:left}
.notes .toc ol{columns:2; column-gap:30px}
.notes section.nsec{margin-top:26px}
.notes section.nsec > h2{border-bottom:3px solid var(--orange); padding-bottom:4px}
.notes section.nsec > h2 .n{color:var(--orange)}
.bank-q{margin-bottom:8px; break-inside:avoid}
.bank-q b{color:var(--navy)}
.notes.show-sol .sol-print{display:block}

/* B/N (black & white) mode — screen preview + print */
.notes.bw, .notes.bw *{
  --navy:#000; --blue:#000; --blue-soft:#fff; --orange:#000; --orange-soft:#fff;
  --green:#000; --green-soft:#fff; --red:#000; --red-soft:#fff; --yellow:#000; --yellow-soft:#fff;
  --purple:#000; --purple-soft:#fff; --ink:#000; --muted:#333; --line:#777;
}
.notes.bw .doc th{background:#fff; color:#000; border-bottom:2px solid #000}
.notes.bw .doc tr:nth-child(even) td{background:#fff}
.notes.bw .activity{background:#fff}
.notes.bw .circuit-static li, .notes.bw .tag{background:#fff; border:1px solid #000; color:#000}
.notes.bw .steps li::before{background:#fff; color:#000; border:2px solid #000}
.notes.bw .key b:first-child, .notes.bw .fx b, .notes.bw .box h4{color:#000}

.footer{font-size:.85rem; color:var(--muted); text-align:center; padding:20px 0}

@media (max-width:760px){
  body{font-size:16px}
  header.top{position:static}
  .brand b{font-size:1.1rem}
  .hero{grid-template-columns:1fr}
  .hero h1{font-size:2rem}
  .twocol,.grid2,.grid3{grid-template-columns:1fr}
  .match-row{grid-template-columns:1fr}
  .notes{padding:18px 16px}
  .notes .toc ol{columns:1}
  .score-big{font-size:3rem}
}

@media print{
  @page{size:A4; margin:14mm 13mm}
  body{background:#fff!important; font-size:11pt; line-height:1.45}
  header.top, .no-print, .footer{display:none!important}
  main{padding:0}
  .wrap{max-width:none; padding:0}
  .card, .notes{border:0!important; box-shadow:none!important; padding:0!important}
  .notes:not(.bw){-webkit-print-color-adjust:exact; print-color-adjust:exact}
  .notes .cover{break-after:page}
  h2,h3,h4{break-after:avoid}
  .activity,.key,.note,.box,.fig,.formula,.mantra,.quote,tr,.review-item{break-inside:avoid}
  .tbl-scroll{overflow:visible}
  a{color:inherit; text-decoration:none}
  .review-item, .result-print *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <small data-i18n="subject">Tecnología y Digitalización · 1.º ESO</small>
        <b data-i18n="unitTitle">U1 · El Proceso Tecnológico, el Taller y los Proyectos</b>
      </div>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <nav class="tabs" aria-label="Secciones">
      <a href="#inicio" data-view="inicio" data-i18n="navHome">Inicio</a>
      <a href="#contenidos" data-view="contenidos" data-i18n="navContents">Contenidos</a>
      <a href="#flashcards" data-view="flashcards" data-i18n="navFlash">Flashcards</a>
      <a href="#practica" data-view="practica" data-i18n="navPractice">Práctica</a>
      <a href="#examen" data-view="examen" data-i18n="navExam">Examen</a>
      <a href="#apuntes" data-view="apuntes" data-i18n="navNotes">Apuntes (PDF)</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-inicio"></section>
  <section class="view" id="view-contenidos"></section>
  <section class="view" id="view-flashcards"></section>
  <section class="view" id="view-practica"></section>
  <section class="view" id="view-examen"></section>
  <section class="view" id="view-apuntes"></section>
</main>

<div class="footer wrap" data-i18n="footer">Material de estudio basado exclusivamente en las presentaciones de la Unidad 1.</div>

<script>
"use strict";
/* =========================================================
   1. UI STRINGS
   ========================================================= */

/* =========================================================
   3. FIGURES (SVG, language-aware, colour via CSS variables)
   ========================================================= */
function processSVG(L){
  const labels = L==="es"
    ? [["Identificar","el problema"],["Buscar","información"],["Generar","ideas"],["Elegir la","mejor solución"],["Planificar y","organizar"],["Construir el","prototipo"],["Evaluar y","comprobar"],["Presentar y","comercializar"]]
    : [["Identify","the problem"],["Research","information"],["Generate","ideas"],["Choose the","best solution"],["Plan and","organise"],["Build the","prototype"],["Test and","evaluate"],["Present and","market"]];
  const center = L==="es" ? ["Si falla,","rediseña"] : ["If it fails,","redesign"];
  const cx=320, cy=232, R=184, r=44, n=8;
  let s = `<svg viewBox="0 0 640 464" role="img" aria-label="${L==="es"?"Ciclo del proceso tecnológico en 8 fases":"8-stage technological process cycle"}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<defs><marker id="arw-${L}" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--orange)"/></marker></defs>`;
  const ang = i => -Math.PI/2 + i*2*Math.PI/n;
  const d = (r+5)/R;
  for(let i=0;i<n;i++){
    const a1=ang(i)+d, a2=ang(i+1)-d;
    const x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1), x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
    s += `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)}" style="fill:none;stroke:var(--orange);stroke-width:4" marker-end="url(#arw-${L})"/>`;
  }
  // redesign arrow: from node 7 (index 6) back toward node 3 (index 2), through centre
  const p7={x:cx+R*Math.cos(ang(6)), y:cy+R*Math.sin(ang(6))}, p3={x:cx+R*Math.cos(ang(2)), y:cy+R*Math.sin(ang(2))};
  s += `<path d="M${(p7.x+r+6).toFixed(1)},${(p7.y+14).toFixed(1)} Q${cx},${cy+70} ${(p3.x-r-8).toFixed(1)},${(p3.y+14).toFixed(1)}" style="fill:none;stroke:var(--red);stroke-width:3;stroke-dasharray:8 6" marker-end="url(#arw-${L})"/>`;
  s += `<text x="${cx}" y="${cy-8}" text-anchor="middle" style="font:700 22px var(--font-head);fill:var(--red)">${center[0]}</text>`;
  s += `<text x="${cx}" y="${cy+18}" text-anchor="middle" style="font:700 22px var(--font-head);fill:var(--red)">${center[1]}</text>`;
  for(let i=0;i<n;i++){
    const x=cx+R*Math.cos(ang(i)), y=cy+R*Math.sin(ang(i));
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" style="fill:var(--card,#fff);stroke:var(--navy);stroke-width:3"/>`;
    s += `<text x="${x.toFixed(1)}" y="${(y-15).toFixed(1)}" text-anchor="middle" style="font:700 17px var(--font-head);fill:var(--orange)">${i+1}</text>`;
    s += `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" style="font:700 11.5px var(--font-body);fill:var(--navy)">${labels[i][0]}</text>`;
    s += `<text x="${x.toFixed(1)}" y="${(y+18).toFixed(1)}" text-anchor="middle" style="font:700 11.5px var(--font-body);fill:var(--navy)">${labels[i][1]}</text>`;
  }
  return s + `</svg>`;
}
function linesSVG(L){
  const t = L==="es"
    ? [["Continua gruesa","contornos visibles"],["Continua fina","líneas auxiliares / de cota"],["Discontinua","aristas ocultas que no vemos desde ese ángulo"]]
    : [["Thick continuous","visible outlines"],["Thin continuous","auxiliary / dimension lines"],["Dashed","hidden edges we cannot see from that angle"]];
  return `<svg viewBox="0 0 620 150" role="img" aria-label="${L==="es"?"Tipos de línea":"Line types"}" xmlns="http://www.w3.org/2000/svg">
    <line x1="10" y1="25" x2="190" y2="25" style="stroke:var(--ink);stroke-width:5"/>
    <text x="210" y="31" style="font:700 16px var(--font-body);fill:var(--ink)">${t[0][0]}: <tspan style="font-weight:400">${t[0][1]}</tspan></text>
    <line x1="10" y1="75" x2="190" y2="75" style="stroke:var(--ink);stroke-width:1.5"/>
    <text x="210" y="81" style="font:700 16px var(--font-body);fill:var(--ink)">${t[1][0]}: <tspan style="font-weight:400">${t[1][1]}</tspan></text>
    <line x1="10" y1="125" x2="190" y2="125" style="stroke:var(--ink);stroke-width:3;stroke-dasharray:14 9"/>
    <text x="210" y="131" style="font:700 16px var(--font-body);fill:var(--ink)">${t[2][0]}: <tspan style="font-weight:400">${t[2][1]}</tspan></text>
  </svg>`;
}

  <div class="box green"><h4>2. Servicios</h4><p><b>Intangibles</b> (no son un objeto que se pueda tocar).</p><p>Ejemplos: la conexión wifi, el autobús urbano.</p></div>
  <div class="box orange"><h4>3. Procesos</h4><p><b>Sistemas.</b></p><p>Ejemplo: el reciclaje de botellas de plástico.</p></div>
</div>
`}, en:{ title:"Technological products", html:()=>`
<p>What technology produces to meet our needs is not always an object you can touch. <b>Technological products</b> are classified into three groups:</p>
<div class="grid3">
  <div class="box blue"><h4>1. Goods</h4><p><b>Physical objects.</b></p><p>Examples: a bicycle, a mobile phone.</p></div>
  <div class="box green"><h4>2. Services</h4><p><b>Intangible</b> (they are not an object you can touch).</p><p>Examples: a wifi connection, the city bus.</p></div>
  <div class="box orange"><h4>3. Processes</h4><p><b>Systems.</b></p><p>Example: recycling plastic bottles.</p></div>
</div>
`}},
/* 4 ------------------------------------------------------------------ */
{ id:"analysis", es:{ title:"Análisis de objetos", html:()=>`
<p>Para entender bien un objeto tecnológico hay que mirarlo con «visión de rayos X»: lo diseccionamos aplicándole <b>5 tipos de análisis</b> (las «5 lupas»). Cada análisis responde a una pregunta distinta. Como ejemplo, analizamos una <b>mochila</b>:</p>
<div class="tbl-scroll"><table>
<tr><th>Análisis</th><th>Qué estudia</th><th>Pregunta clave</th><th>Ejemplo: la mochila</th></tr>
<tr><td><b>1. Anatómico</b></td><td>Forma y piezas que lo componen.</td><td>¿Qué forma tiene y de qué partes está compuesto?</td><td>Correas, bolsillos, cremalleras.</td></tr>
<tr><td><b>2. Técnico</b></td><td>Materiales y herramientas usadas en su fabricación.</td><td>¿De qué materiales está hecho? ¿Qué técnicas se han usado para fabricarlo?</td><td>Tela de nailon, plástico resistente.</td></tr>
<tr><td><b>3. Funcional</b></td><td>Utilidad y función principal.</td><td>¿Para qué sirve? ¿Cuál es su función principal?</td><td>Transportar libros sin dañar la espalda.</td></tr>
<tr><td><b>4. Estético</b></td><td>Belleza, color y acabado exterior.</td><td>¿Cómo es su apariencia? ¿Qué colores y acabados tiene?</td><td>Colores llamativos, diseño deportivo.</td></tr>
<tr><td><b>5. Económico-social</b></td><td>Coste económico e impacto en la sociedad y el medio ambiente.</td><td>¿Cuánto cuesta y qué impacto tiene en la sociedad y en el medio ambiente?</td><td>Precio accesible, huella de carbono de sus materiales.</td></tr>
</table></div>
<div class="activity"><span class="tag orange">Actividad</span>
  <h4>Análisis forense (3 minutos)</h4>
  <p>Observa el objeto que el profesor muestre en pantalla. En voz alta y levantando la mano, aplícale los 5 análisis tecnológicos: anatómico, técnico, funcional, estético y económico-social. ¿Quién se atreve?</p>
</div>
<div class="activity"><span class="tag orange">Actividad</span>
  <h4>Análisis rápido en vivo</h4>
  <p>Elige UNO de estos dos objetos que tienes delante, <b>un bolígrafo</b> o <b>un pupitre</b>, y aplícale las 5 lupas. Copia esta tabla en tu cuaderno y complétala:</p>
  <table><tr><th style="width:30%">Análisis</th><th>Mi objeto: ____________</th></tr>
  <tr><td>Anatómico</td><td>&nbsp;</td></tr><tr><td>Técnico</td><td>&nbsp;</td></tr><tr><td>Funcional</td><td>&nbsp;</td></tr><tr><td>Estético</td><td>&nbsp;</td></tr><tr><td>Económico-social</td><td>&nbsp;</td></tr></table>
</div>
`}, en:{ title:"Analysing objects", html:()=>`
<p>To understand a technological object properly, we look at it with “X-ray vision”: we dissect it by applying <b>5 types of analysis</b> (the “5 magnifying glasses”). Each analysis answers a different question. As an example, we analyse a <b>backpack</b>:</p>
<div class="tbl-scroll"><table>
<tr><th>Analysis</th><th>What it studies</th><th>Key question</th><th>Example: the backpack</th></tr>
<tr><td><b>1. Anatomical</b></td><td>Shape and the parts it is made of.</td><td>What shape is it and what parts is it made of?</td><td>Straps, pockets, zips.</td></tr>
<tr><td><b>2. Technical</b></td><td>Materials and tools used to make it.</td><td>What materials is it made of? What techniques were used to make it?</td><td>Nylon fabric, strong plastic.</td></tr>
<tr><td><b>3. Functional</b></td><td>Usefulness and main function.</td><td>What is it for? What is its main function?</td><td>Carrying books without hurting your back.</td></tr>
<tr><td><b>4. Aesthetic</b></td><td>Beauty, colour and outer finish.</td><td>What does it look like? What colours and finishes does it have?</td><td>Bright colours, sporty design.</td></tr>
<tr><td><b>5. Socio-economic</b></td><td>Economic cost and impact on society and the environment.</td><td>How much does it cost and what impact does it have on society and the environment?</td><td>Affordable price, carbon footprint of its materials.</td></tr>
</table></div>
<div class="activity"><span class="tag orange">Activity</span>
  <h4>Forensic analysis (3 minutes)</h4>
  <p>Look at the object your teacher shows on the screen. Out loud, raising your hand, apply the 5 technological analyses: anatomical, technical, functional, aesthetic and socio-economic. Who dares?</p>
</div>
<div class="activity"><span class="tag orange">Activity</span>
  <h4>Quick live analysis</h4>
  <p>Choose ONE of these two objects in front of you, <b>a ballpoint pen</b> or <b>a school desk</b>, and apply the 5 magnifying glasses. Copy this table into your notebook and fill it in:</p>
  <table><tr><th style="width:30%">Analysis</th><th>My object: ____________</th></tr>
  <tr><td>Anatomical</td><td>&nbsp;</td></tr><tr><td>Technical</td><td>&nbsp;</td></tr><tr><td>Functional</td><td>&nbsp;</td></tr><tr><td>Aesthetic</td><td>&nbsp;</td></tr><tr><td>Socio-economic</td><td>&nbsp;</td></tr></table>
</div>
`}},
/* 5 ------------------------------------------------------------------ */
{ id:"process", es:{ title:"El proceso tecnológico", html:()=>`
<p>Los inventores no improvisan: siguen un método ordenado, el <b>proceso tecnológico</b> (también llamado <b>método de proyectos</b>). Es como una brújula que nos guía desde el problema hasta la solución. Tiene <b>8 fases</b>:</p>
<figure class="fig">${processSVG("es")}<figcaption>La brújula del inventor: el proceso tecnológico.</figcaption></figure>
<ol class="steps">
  <li><b>Identificar el problema:</b> ¿qué necesidad tenemos?</li>
  <li><b>Buscar información:</b> investigar cómo lo han resuelto otros.</li>
  <li><b>Generar ideas:</b> tormenta de ideas (bocetos).</li>
  <li><b>Elegir la mejor solución:</b> seleccionar la más viable.</li>
  <li><b>Planificar y organizar:</b> tareas, herramientas y materiales.</li>
  <li><b>Construir el prototipo:</b> ¡manos a la obra en el taller!</li>
  <li><b>Evaluar y comprobar:</b> ¿funciona? ¿resuelve el problema?</li>
  <li><b>Presentar y comercializar:</b> elaborar la memoria y mostrarlo.</li>
</ol>
<div class="note"><b>Otra forma de verlo: el método de proyectos.</b> En otro esquema de la unidad las 8 fases se nombran así: <b>1.</b> Identificar la necesidad → <b>2.</b> Buscar información → <b>3.</b> Generar ideas → <b>4.</b> Diseñar → <b>5.</b> Planificar → <b>6.</b> Construir → <b>7.</b> Evaluar → <b>8.</b> Presentar la memoria. Es el mismo camino, con algunas fases nombradas de otra forma.</div>
<div class="key"><b>Importante:</b> el proceso es un ciclo. Si al evaluar descubrimos que el prototipo falla, <b>volvemos atrás y rediseñamos</b>.</div>
<div class="activity"><span class="tag orange">Actividad</span>
  <h4>El circuito roto</h4>
  <p><b>Planteamiento:</b> los perros del barrio pasan mucho frío en invierno y ensucian las calles buscando refugio.</p>
  <p><b>Reto:</b> aquí tenéis 8 tarjetas de acción desordenadas. Ordenadlas del 1 al 8 siguiendo las fases del proceso tecnológico.</p>
  <div data-widget="circuit"></div>
  <details class="sol"><summary>Ver solución</summary>${circuitSolution("es")}</details>
</div>
`}, en:{ title:"The technological process", html:()=>`
<p>Inventors do not improvise: they follow an orderly method, the <b>technological process</b> (also called the <b>project method</b>). It is like a compass that guides us from the problem to the solution. It has <b>8 stages</b>:</p>
<figure class="fig">${processSVG("en")}<figcaption>The inventor’s compass: the technological process.</figcaption></figure>
<ol class="steps">
  <li><b>Identify the problem:</b> what need do we have?</li>
  <li><b>Research information:</b> find out how others have solved it.</li>
  <li><b>Generate ideas:</b> brainstorming (sketches).</li>
  <li><b>Choose the best solution:</b> select the most viable one.</li>
  <li><b>Plan and organise:</b> tasks, tools and materials.</li>
  <li><b>Build the prototype:</b> get to work in the workshop!</li>
  <li><b>Test and evaluate:</b> does it work? Does it solve the problem?</li>
  <li><b>Present and market:</b> write the report and show it.</li>
</ol>
<div class="note"><b>Another way to see it: the project method.</b> In another diagram of the unit the 8 stages are named like this: <b>1.</b> Identify the need → <b>2.</b> Research information → <b>3.</b> Generate ideas → <b>4.</b> Design → <b>5.</b> Plan → <b>6.</b> Build → <b>7.</b> Evaluate → <b>8.</b> Present the report. It is the same path, with some stages named differently.</div>
<div class="key"><b>Important:</b> the process is a cycle. If we discover during testing that the prototype fails, <b>we go back and redesign</b>.</div>
<div class="activity"><span class="tag orange">Activity</span>
  <h4>The broken circuit</h4>
  <p><b>Situation:</b> the dogs in the neighbourhood are very cold in winter and make the streets dirty looking for shelter.</p>
  <p><b>Challenge:</b> here are 8 action cards in the wrong order. Put them in order from 1 to 8 following the stages of the technological process.</p>
  <div data-widget="circuit"></div>
  <details class="sol"><summary>Show solution</summary>${circuitSolution("en")}</details>
</div>
`}},
/* 6 ------------------------------------------------------------------ */
{ id:"team", es:{ title:"Trabajo en equipo en el taller", html:()=>`
<p>El taller no es de solitarios. Al igual que en el equipo de boxes de la Fórmula 1, <b>nadie gana solo</b>: cada miembro tiene una tarea y todos dependen de todos. En el taller trabajaréis en equipo y <b>rotaréis por 4 roles fundamentales</b>:</p>
<div class="grid2">
  <div class="box blue"><h4>Coordinador/a – Secretario/a</h4><p>Dirige al equipo, toma decisiones, completa los documentos y lleva el registro.</p></div>
  <div class="box yellow"><h4>Materiales y herramientas</h4><p>Vigila, recoge, reparte y asegura el buen estado del instrumental.</p></div>
  <div class="box red"><h4>Orden, limpieza y seguridad</h4><p>Su superpoder es la prevención: garantiza que la mesa esté despejada y que se cumplan las normas.</p></div>
  <div class="box green"><h4>Calidad y convivencia</h4><p>Fomenta el respeto, revisa que el trabajo esté bien hecho y media en los conflictos.</p></div>
</div>
`}, en:{ title:"Teamwork in the workshop", html:()=>`
<p>The workshop is not for loners. Just like a Formula 1 pit crew, <b>nobody wins alone</b>: each member has a job and everyone depends on everyone else. In the workshop you will work in teams and <b>rotate through 4 key roles</b>:</p>
<div class="grid2">
  <div class="box blue"><h4>Coordinator – Secretary</h4><p>Leads the team, makes decisions, fills in the documents and keeps the records.</p></div>
  <div class="box yellow"><h4>Materials and tools</h4><p>Watches over, collects, hands out and makes sure the tools are in good condition.</p></div>
  <div class="box red"><h4>Order, cleaning and safety</h4><p>Their superpower is prevention: they make sure the table is clear and the rules are followed.</p></div>
  <div class="box green"><h4>Quality and coexistence</h4><p>Encourages respect, checks that the work is well done and mediates in conflicts.</p></div>
</div>
`}},
/* 7 ------------------------------------------------------------------ */
{ id:"tools", es:{ title:"Herramientas del taller", html:()=>`
<h3>El arsenal del taller: clasificación básica</h3>
<p>Las herramientas del taller se agrupan en <b>tres familias</b> según el momento del trabajo en que se usan, y cubren <b>8 operaciones</b>:</p>
<div class="grid3">
  <div class="box blue"><h4>La Mente (preparación)</h4><ol><li>Medir</li><li>Marcar</li><li>Sujetar</li></ol></div>
  <div class="box orange"><h4>La Fuerza (transformación)</h4><ol start="4"><li>Golpear</li><li>Cortar / serrar</li></ol></div>
  <div class="box green"><h4>La Precisión (finalización)</h4><ol start="6"><li>Perforar</li><li>Unir</li><li>Acabar</li></ol></div>
</div>
<div class="mantra">Antes de fabricar, sigue SIEMPRE este orden:<br>Mide → Marca → Corta → Perfora → Monta → Acaba</div>

<h3>Familia 1: La Mente (preparar la pieza)</h3>
<div class="tbl-scroll"><table>
<tr><th>Operación</th><th>Herramienta</th><th>Para qué sirve</th></tr>
<tr><td rowspan="4">Medir y marcar</td><td>Regla metálica</td><td>Medir.</td></tr>
<tr><td>Escuadra</td><td>Comprobar ángulos rectos (90º).</td></tr>
<tr><td>Compás</td><td>Trazar circunferencias.</td></tr>
<tr><td>Lápiz / punzón</td><td>Marcar.</td></tr>
<tr><td rowspan="2">Sujetar</td><td>Tornillo de banco</td><td>Sujetar la pieza; va fijo en la mesa.</td></tr>
<tr><td>Gato o sargento</td><td>Sujeción móvil, para fijar la pieza.</td></tr>
</table></div>
<div class="note"><b>Consejo experto:</b> mide dos veces, corta una vez. Una pieza mal sujeta es una pieza arruinada… y un peligro.</div>

<h3>Familia 2: La Fuerza (transformar la pieza)</h3>
<div class="tbl-scroll"><table>
<tr><th>Operación</th><th>Herramienta</th><th>Para qué sirve</th></tr>
<tr><td>Golpear</td><td>Martillo</td><td>Clavar.</td></tr>
<tr><td rowspan="2">Cortar y serrar</td><td>Serrucho</td><td>Cortes rectos y largos en madera.</td></tr>
<tr><td>Sierra de calar / segueta</td><td>Cortes curvos o finos.</td></tr>
</table></div>
<p>Al serrar, la pieza debe estar bien sujeta a la mesa (por ejemplo, con un gato o sargento).</p>

<h3>Familia 3: La Precisión (el toque final)</h3>
<div class="tbl-scroll"><table>
<tr><th>Operación</th><th>Herramienta</th><th>Para qué sirve</th></tr>
<tr><td>Perforar</td><td>Taladro y brocas de madera (por ejemplo, la broca Forstner)</td><td>Hacer agujeros; la broca Forstner, para agujeros anchos.</td></tr>
<tr><td rowspan="3">Unir</td><td>Cola térmica</td><td>Unir piezas.</td></tr>
<tr><td>Cola para madera</td><td>Unir piezas de madera: lenta, pero fortísima.</td></tr>
<tr><td>Destornilladores</td><td>Unir piezas con tornillos.</td></tr>
<tr><td rowspan="2">Acabar</td><td>Limas</td><td>Desbastar bordes duros.</td></tr>
<tr><td>Papel de lija</td><td>Suavizar superficies.</td></tr>
</table></div>
<div class="note"><b>Nota:</b> el acabado es la diferencia entre un trabajo de principiante y uno de maestro.</div>

<div class="activity"><span class="tag orange">Actividad</span>
  <h4>El cirujano del taller (10 segundos)</h4>
  <p>Se plantea una operación de taller. Tenéis 10 segundos para decir qué herramienta necesita el «cirujano».</p>
  <ol>
    <li>Quiero comprobar si esta esquina tiene exactamente 90 grados.</li>
    <li>Necesito hacer un corte curvo en una chapa de contrachapado fino.</li>
    <li>Voy a serrar un listón, pero se mueve mucho encima de la mesa.</li>
    <li>Necesito suavizar un borde de madera que está lleno de astillas.</li>
  </ol>
  <details class="sol"><summary>Ver solución</summary>
    <ol><li>La escuadra.</li><li>La sierra de calar / segueta.</li><li>El tornillo de banco o el gato / sargento (para sujetar la pieza).</li><li>El papel de lija.</li></ol>
  </details>
</div>
`}, en:{ title:"Workshop tools", html:()=>`
<h3>The workshop arsenal: basic classification</h3>
<p>Workshop tools are grouped into <b>three families</b> according to the moment of the work when they are used, and they cover <b>8 operations</b>:</p>
<div class="grid3">
  <div class="box blue"><h4>The Mind (preparation)</h4><ol><li>Measure</li><li>Mark</li><li>Hold</li></ol></div>
  <div class="box orange"><h4>The Strength (transformation)</h4><ol start="4"><li>Hit</li><li>Cut / saw</li></ol></div>
  <div class="box green"><h4>The Precision (finishing)</h4><ol start="6"><li>Drill</li><li>Join</li><li>Finish</li></ol></div>
</div>
<div class="mantra">Before making anything, ALWAYS follow this order:<br>Measure → Mark → Cut → Drill → Assemble → Finish</div>

<h3>Family 1: The Mind (preparing the piece)</h3>
<div class="tbl-scroll"><table>
<tr><th>Operation</th><th>Tool</th><th>What it is for</th></tr>
<tr><td rowspan="4">Measure and mark</td><td>Steel ruler</td><td>Measuring.</td></tr>
<tr><td>Try square</td><td>Checking right angles (90º).</td></tr>
<tr><td>Compass</td><td>Drawing circles.</td></tr>
<tr><td>Pencil / awl</td><td>Marking.</td></tr>
<tr><td rowspan="2">Hold</td><td>Bench vice</td><td>Holding the piece; it is fixed to the table.</td></tr>
<tr><td>Clamp (G-clamp)</td><td>Movable holding tool, to fix the piece.</td></tr>
</table></div>
<div class="note"><b>Expert tip:</b> measure twice, cut once. A badly held piece is a ruined piece… and a danger.</div>

<h3>Family 2: The Strength (transforming the piece)</h3>
<div class="tbl-scroll"><table>
<tr><th>Operation</th><th>Tool</th><th>What it is for</th></tr>
<tr><td>Hit</td><td>Hammer</td><td>Driving nails.</td></tr>
<tr><td rowspan="2">Cut and saw</td><td>Handsaw</td><td>Long, straight cuts in wood.</td></tr>
<tr><td>Coping saw / fretsaw</td><td>Curved or fine cuts.</td></tr>
</table></div>
<p>When sawing, the piece must be held firmly to the table (for example, with a clamp).</p>

<h3>Family 3: The Precision (the final touch)</h3>
<div class="tbl-scroll"><table>
<tr><th>Operation</th><th>Tool</th><th>What it is for</th></tr>
<tr><td>Drill</td><td>Drill and wood drill bits (for example, the Forstner bit)</td><td>Making holes; the Forstner bit, for wide holes.</td></tr>
<tr><td rowspan="3">Join</td><td>Hot glue</td><td>Joining pieces.</td></tr>
<tr><td>Wood glue</td><td>Joining wooden pieces: slow, but super strong.</td></tr>
<tr><td>Screwdrivers</td><td>Joining pieces with screws.</td></tr>
<tr><td rowspan="2">Finish</td><td>Files</td><td>Smoothing down hard edges.</td></tr>
<tr><td>Sandpaper</td><td>Smoothing surfaces.</td></tr>
</table></div>
<div class="note"><b>Note:</b> the finish is the difference between a beginner’s work and a master’s.</div>

<div class="activity"><span class="tag orange">Activity</span>
  <h4>The workshop surgeon (10 seconds)</h4>
  <p>A workshop operation is described. You have 10 seconds to say which tool the “surgeon” needs.</p>
  <ol>
    <li>I want to check whether this corner is exactly 90 degrees.</li>
    <li>I need to make a curved cut in a thin sheet of plywood.</li>
    <li>I am going to saw a wooden strip, but it moves a lot on the table.</li>
    <li>I need to smooth a wooden edge that is full of splinters.</li>
  </ol>
  <details class="sol"><summary>Show solution</summary>
    <ol><li>The try square.</li><li>The coping saw / fretsaw.</li><li>The bench vice or the clamp (to hold the piece).</li><li>Sandpaper.</li></ol>
  </details>
</div>
`}},
/* 8 ------------------------------------------------------------------ */
{ id:"safety", es:{ title:"Seguridad en el taller", html:()=>`
<h3>El decálogo de supervivencia: 5 normas básicas</h3>
<ol class="steps">
  <li><b>Orden y tranquilidad:</b> entra sin correr, escucha al profesor y mantén tu mesa limpia de objetos innecesarios.</li>
  <li><b>Uso correcto:</b> utiliza cada herramienta SOLO para su función real (¡nunca uses un destornillador como martillo!).</li>
  <li><b>Seguridad al cortar:</b> sujeta firmemente la pieza y corta siempre alejándote de tu cuerpo, manteniendo los dedos lejos de la hoja.</li>
  <li><b>Máquinas eléctricas:</b> utilízalas de uno en uno, únicamente con autorización y bajo la supervisión del profesor.</li>
  <li><b>Indumentaria:</b> pelo recogido, sin bufandas ni ropa suelta que pueda engancharse en las máquinas.</li>
</ol>
<h3>Tolerancia cero al riesgo</h3>
<div class="twocol">
  <div class="box green"><h4>✔ Qué hacer</h4><ul><li>Entrar con tranquilidad (no corras).</li><li>Sujetar bien la pieza antes de cortar.</li><li>Cortar alejándote del cuerpo.</li><li>Mantener la mesa despejada.</li></ul></div>
  <div class="box red"><h4>✘ Qué no hacer</h4><ul><li>Correr o jugar con las herramientas.</li><li>Usar una herramienta para lo que no fue diseñada (nunca improvises).</li><li>Colocar la mano delante de la herramienta.</li><li>Ocultar un accidente al profesor.</li></ul></div>
</div>
<div class="activity"><span class="tag orange">Actividad</span>
  <h4>Encuentra el peligro</h4>
  <p>En la ilustración de la presentación aparece un taller lleno de errores. Señala las <b>5 infracciones críticas de seguridad</b>. ¿Qué norma están rompiendo?</p>
  <details class="sol"><summary>Ver solución</summary>
    <ul>
      <li>Un alumno <b>corre con unas tijeras</b> en la mano → Norma 1 (orden y tranquilidad: no correr ni jugar con las herramientas).</li>
      <li>Hay <b>herramientas tiradas por el suelo</b> → Norma 1 (orden: puesto de trabajo despejado).</li>
      <li>Un alumno <b>sierra sin sujetar bien la pieza</b>, con la mano delante de la herramienta → Norma 3 (seguridad al cortar).</li>
      <li>Una alumna usa el <b>taladro con el pelo largo suelto</b> → Norma 5 (indumentaria: pelo recogido).</li>
      <li>Un alumno <b>manipula el enchufe de una máquina eléctrica</b> por su cuenta → Norma 4 (máquinas eléctricas: solo con autorización y supervisión del profesor).</li>
    </ul>
  </details>
</div>
`}, en:{ title:"Workshop safety", html:()=>`
<h3>The survival code: 5 basic rules</h3>
<ol class="steps">
  <li><b>Order and calm:</b> come in without running, listen to the teacher and keep your table free of unnecessary objects.</li>
  <li><b>Correct use:</b> use each tool ONLY for its real purpose (never use a screwdriver as a hammer!).</li>
  <li><b>Cutting safely:</b> hold the piece firmly and always cut away from your body, keeping your fingers away from the blade.</li>
  <li><b>Electric machines:</b> use them one person at a time, only with permission and under the teacher’s supervision.</li>
  <li><b>Clothing:</b> hair tied back, no scarves or loose clothes that could get caught in the machines.</li>
</ol>
<h3>Zero tolerance for risk</h3>
<div class="twocol">
  <div class="box green"><h4>✔ What to do</h4><ul><li>Come in calmly (do not run).</li><li>Hold the piece firmly before cutting.</li><li>Cut away from your body.</li><li>Keep the table clear.</li></ul></div>
  <div class="box red"><h4>✘ What not to do</h4><ul><li>Run or play with the tools.</li><li>Use a tool for something it was not designed for (never improvise).</li><li>Put your hand in front of the tool.</li><li>Hide an accident from the teacher.</li></ul></div>
</div>
<div class="activity"><span class="tag orange">Activity</span>
  <h4>Spot the danger</h4>
  <p>The illustration in the presentation shows a workshop full of mistakes. Point out the <b>5 critical safety breaches</b>. Which rule are they breaking?</p>
  <details class="sol"><summary>Show solution</summary>
    <ul>
      <li>A student is <b>running with scissors</b> in his hand → Rule 1 (order and calm: do not run or play with tools).</li>
      <li>There are <b>tools lying on the floor</b> → Rule 1 (order: a clear workspace).</li>
      <li>A student is <b>sawing without holding the piece firmly</b>, with his hand in front of the tool → Rule 3 (cutting safely).</li>
      <li>A student is using the <b>drill with her long hair loose</b> → Rule 5 (clothing: hair tied back).</li>
      <li>A student is <b>handling the plug of an electric machine</b> on his own → Rule 4 (electric machines: only with permission and the teacher’s supervision).</li>
    </ul>
  </details>
</div>
`}},

{ id:"drawing", es:{ title:"Expresión gráfica", html:()=>`
<p>El dibujo es el <b>idioma universal</b> de la tecnología: nos permite comunicar una idea antes de construirla. Para pasar de la idea al objeto se siguen <b>3 pasos</b>, cada uno más preciso que el anterior:</p>
<div class="tbl-scroll"><table>
<tr><th>Paso</th><th>Cómo se hace</th><th>Características</th></tr>
<tr><td><b>1. Boceto</b></td><td>Dibujo rápido a mano alzada.</td><td>Muestra la idea principal, pero sin reglas ni medidas exactas.</td></tr>
<tr><td><b>2. Croquis</b></td><td>A mano alzada.</td><td>Incorpora proporciones reales y <b>acotación</b> (las medidas del objeto en milímetros).</td></tr>
<tr><td><b>3. Dibujo técnico</b></td><td>Con instrumentos (regla, escuadra).</td><td>Preciso y exacto, empleando los tipos de línea normalizados.</td></tr>
</table></div>
<h3>Tipos de línea</h3>
<figure class="fig">${linesSVG("es")}</figure>
<div class="key"><b>Recuerda:</b> el croquis SIEMPRE lleva medidas (cotas).</div>

  <p><b>Reto:</b> abrid el cuaderno. Tenéis 5 minutos exactos para dibujar un <b>BOCETO</b> (a mano alzada, rápido pero claro) de un objeto único capaz de organizar y sujetar esos cuatro elementos a la vez.</p>

<p>Drawing is the <b>universal language</b> of technology: it lets us communicate an idea before we build it. To go from the idea to the object we follow <b>3 steps</b>, each one more precise than the one before:</p>
<div class="tbl-scroll"><table>
<tr><th>Step</th><th>How it is done</th><th>Features</th></tr>
<tr><td><b>1. Sketch</b> (boceto)</td><td>Quick freehand drawing.</td><td>Shows the main idea, but without rulers or exact measurements.</td></tr>
<tr><td><b>2. Dimensioned sketch</b> (croquis)</td><td>Freehand.</td><td>Includes real proportions and <b>dimensions</b> (the measurements of the object in millimetres).</td></tr>
<tr><td><b>3. Technical drawing</b></td><td>With instruments (ruler, try square).</td><td>Precise and exact, using the standard line types.</td></tr>

<h3>Line types</h3>

<div class="key"><b>Remember:</b> a dimensioned sketch ALWAYS has measurements (dimensions).</div>
<div class="activity"><span class="tag orange">Activity</span>

  <p><b>Challenge:</b> open your notebook. You have exactly 5 minutes to draw a <b>SKETCH</b> (freehand, quick but clear) of a single object that can organise and hold those four things at the same time.</p>
</div>

{ id:"project", es:{ title:"Nuestro proyecto: el organizador", html:()=>`
<p>Nuestra misión final es construir el <b>Organizador OPITEC 122.979</b>: esto es lo que construiréis con vuestras propias manos. Sus partes son:</p>
<div class="tbl-scroll"><table>
<tr><th>Parte</th><th>Descripción</th></tr>
<tr><td><b>Soporte principal</b></td><td>Madera de contrachapado resistente.</td></tr>
<tr><td><b>Fijaciones cilíndricas</b></td><td>Varillas de madera redondas (para llaves y soporte).</td></tr>
<tr><td><b>Listones de freno</b></td><td>Piezas de madera rectangulares para evitar que el móvil deslice.</td></tr>
<tr><td><b>Base ranurada</b></td><td>Diseñada milimétricamente para encajar el respaldo.</td></tr>
</table></div>
<h3>Hoja de ruta del proyecto: de la teoría a la práctica</h3>
<ol class="steps">
  <li><b>Medir y cortar</b> (fase La Fuerza): transportar las medidas a los listones y varillas. Uso preciso del serrucho / segueta.</li>
  <li><b>Marcar y perforar</b> (fase La Precisión): marcar con punzón los orificios del contrachapado y taladrar las muescas (orificios de ø10 mm y ø15 mm).</li>
  <li><b>Unir y encolar</b> (fase de ensamblaje): fijar las varillas de retención asegurando que las muescas miren hacia arriba.</li>
  <li><b>Montar el soporte</b> (geometría): encajar ortogonalmente la placa base en el respaldo ranurado.</li>
  <li><b>Acabar</b> (estética): lijar exhaustivamente todos los bordes de corte y aplicar el diseño estético final.</li>
</ol>
`}, en:{ title:"Our project: the organiser", html:()=>`
<p>Our final mission is to build the <b>OPITEC 122.979 Organiser</b>: this is what you will build with your own hands. Its parts are:</p>
<div class="tbl-scroll"><table>
<tr><th>Part</th><th>Description</th></tr>
<tr><td><b>Main support</b></td><td>Strong plywood.</td></tr>
<tr><td><b>Cylindrical fixings</b></td><td>Round wooden rods (for keys and as a support).</td></tr>
<tr><td><b>Stopper strips</b></td><td>Rectangular wooden pieces to stop the mobile phone from sliding.</td></tr>
<tr><td><b>Slotted base</b></td><td>Designed to the millimetre to fit the backrest.</td></tr>
</table></div>
<h3>Project roadmap: from theory to practice</h3>
<ol class="steps">
  <li><b>Measure and cut</b> (The Strength stage): transfer the measurements to the strips and rods. Precise use of the handsaw / fretsaw.</li>
  <li><b>Mark and drill</b> (The Precision stage): mark the holes in the plywood with an awl and drill the notches (holes of ø10 mm and ø15 mm).</li>
  <li><b>Join and glue</b> (assembly stage): fix the retaining rods, making sure the notches face upwards.</li>
  <li><b>Assemble the support</b> (geometry): fit the base plate at right angles into the slotted backrest.</li>
  <li><b>Finish</b> (aesthetics): sand all the cut edges thoroughly and apply the final aesthetic design.</li>
</ol>
`}},

MODEL_Q.forEach(m=>{
  const q = {id:QUESTIONS.length, src:"model", type:m.type, pts:m.pts, n:m.n, t:m.t, q:m.q, fixed:!!m.fixed};
  const pair = p=>({es:p[0],en:p[1]});
  if(m.type==="mc"){ q.o=m.o.map(pair); q.a=m.a; }
  if(m.type==="fill"){ q.blanks=m.blanks; }
  if(m.type==="match"){ q.items=m.items.map(pair); q.opts=m.opts.map(pair); q.ans=m.ans; }
  if(m.type==="order"){ q.items=m.items.map(pair); q.start=m.start; }
  if(m.type==="open"){ q.model=pair(m.model); q.groups=m.groups; q.need=m.need; }

/* ---------- answer checking (case, accents and punctuation are ignored) ---------- */
function norm(s){
  return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9€\s]/g," ").replace(/\s+/g," ").trim();
}
function stripArt(s){ return s.replace(/^(el|la|los|las|un|una|unos|unas|lo|the|a|an) /,""); }
function stem(s){ return s.replace(/(es|s)$/,""); }
function blankOK(input, b){
  const v = stripArt(norm(input)); if(!v) return false;
  const alts = [].concat(b.es||[], b.en||[], b.alt||[]);
  return alts.some(a=>{ const w=stripArt(norm(a));
    if(v===w || stem(v)===stem(w)) return true;
    return w.length>=5 && lev(v,w)<=1; // tolerate one small typo in longer words
  });
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>1) return 2;
  let prev=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){ const cur=[i];
    for(let j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur; }
  return prev[b.length];
}
function openFound(q, text){
  const t = " "+norm(text)+" ";
  return q.groups.map(g=>g.k.some(k=>{ const n=norm(k); return n && t.includes(n); }));
}
/* returns fraction 0..1 */
function scoreQ(q, ans){
  if(ans===undefined || ans===null) return 0;
  switch(q.type){
    case "mc":    return ans===q.a ? 1 : 0;
    case "fill":  return q.blanks.filter((b,i)=>blankOK((ans||[])[i], b)).length / q.blanks.length;
    case "match": return q.ans.filter((c,i)=>ans[i]===c).length / q.ans.length;
    case "order": return ans.filter((it,pos)=>it===pos).length / q.items.length;
    case "open":  { const f=openFound(q,ans).filter(Boolean).length; return Math.min(1, f/q.need); }
  }
  return 0;
}
function isAnswered(q, ans){
  if(ans===undefined || ans===null) return false;
  switch(q.type){
    case "mc": return true;
    case "fill": return ans.some(v=>String(v||"").trim()!=="");
    case "match": return ans.some(v=>v>=0);
    case "order": return true;
    case "open": return String(ans).trim()!=="";
  }
  return false;
}
function promptText(q, L){ return q.q[L].replace(/\{\{\d+\}\}/g, "________"); }
function answerText(q, L){
  switch(q.type){
    case "mc": return q.o[q.a][L];
    case "fill": return q.blanks.map(b=>b[L][0]).join(" / ");
    case "match": return q.items.map((it,i)=>`${it[L]} → ${q.opts[q.ans[i]][L]}`).join(" · ");
    case "order": return q.items.map((it,i)=>`${i+1}. ${it[L]}`).join(" → ");
    case "open": return q.model[L];
  }
  return "";
}
function givenText(q, ans, L){
  if(!isAnswered(q,ans)) return null;
  switch(q.type){
    case "mc": return q.o[ans][L];
    case "fill": return ans.map(v=>String(v||"").trim()||"—").join(" / ");
    case "match": return q.items.map((it,i)=>`${it[L]} → ${ans[i]>=0?q.opts[ans[i]][L]:"—"}`).join(" · ");
    case "order": return ans.map((it,i)=>`${i+1}. ${q.items[it][L]}`).join(" → ");
    case "open": return String(ans);
  }
  return "";
}
function fmtPts(n){ return (Math.round(n*100)/100).toLocaleString(LANG==="es"?"es-ES":"en-GB",{maximumFractionDigits:2}); }

// Broken-circuit interactive ordering
let circuitOrder = null;
function mountCircuit(host){
  if(!circuitOrder) circuitOrder = CIRCUIT.shown.map((_,i)=>i); // start in slide order (already mixed)
  const draw = (check=false)=>{
    host.innerHTML = `<ol class="circuit">${circuitOrder.map((ci,idx)=>{
      const c = CIRCUIT.shown[ci];
      const cls = check ? (c.pos===idx+1?"ok":"bad") : "";
      return `<li class="${cls}"><span class="pos">${idx+1}</span><span class="txt">${esc(c[LANG])}</span>
        <button type="button" data-mv="up" data-i="${idx}" aria-label="${LANG==="es"?"Subir":"Move up"}"${idx===0?" disabled":""}>▲</button>
        <button type="button" data-mv="down" data-i="${idx}" aria-label="${LANG==="es"?"Bajar":"Move down"}"${idx===circuitOrder.length-1?" disabled":""}>▼</button></li>`;}).join("")}</ol>
      <div class="row"><button type="button" class="btn green" data-act="check">${LANG==="es"?"Comprobar orden":"Check order"}</button>
      <button type="button" class="btn ghost" data-act="mix">${T("shuffle")}</button>
      <span class="muted" data-res></span></div>`;
    if(check){
      const ok = circuitOrder.filter((ci,idx)=>CIRCUIT.shown[ci].pos===idx+1).length;
      $("[data-res]",host).textContent = (LANG==="es"?`Bien colocadas: ${ok} de 8`:`Correctly placed: ${ok} of 8`) + (ok===8?" 🎉":"");
    }
  };
  host.onclick = e=>{
    const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.mv){
      const i=+b.dataset.i, j = b.dataset.mv==="up"? i-1 : i+1;
      if(j<0||j>=circuitOrder.length) return;
      [circuitOrder[i],circuitOrder[j]]=[circuitOrder[j],circuitOrder[i]];
      draw(); const btn = host.querySelector(`button[data-mv="${b.dataset.mv}"][data-i="${j}"]`); if(btn && !btn.disabled) btn.focus();
    } else if(b.dataset.act==="check"){ draw(true); }
    else if(b.dataset.act==="mix"){ circuitOrder = shuffle(circuitOrder); draw(); }
  };
  draw();
}

const TYPE_GROUPS = { all:()=>true, test:q=>q.type==="mc", written:q=>q.type!=="mc" };
function typeOptions(sel){

function typeLabel(q){

/* st = {ans, order(for mc), done(bool, show correction)} */
function answerAreaHTML(q, st){
  const ans = st.ans, done = st.done, L = LANG;
  if(q.type==="mc"){
    const ord = q.fixed ? q.o.map((_,i)=>i) : st.order;
    return `<div class="opts">${ord.map((oi,k)=>{
      let cls="";
      if(done){ if(oi===q.a) cls=" right"; else if(oi===ans) cls=" wrong"; }
      else if(ans===oi) cls=" sel";
      return `<button type="button" class="opt${cls}" data-oi="${oi}" aria-pressed="${ans===oi}"${done?" disabled":""}><span class="lt">${LETTERS[k]}</span><span>${esc(q.o[oi][L])}</span></button>`;}).join("")}</div>`;
  }
  if(q.type==="fill"){
    let i=-1;
    const parts = esc(q.q[L]).split(/\{\{\d+\}\}/);
    let h = "";
    parts.forEach((p,k)=>{
      h += p;
      if(k<parts.length-1){ i++;
        const v = (ans||[])[i]||"";
        let cls = ""; if(done) cls = blankOK(v,q.blanks[i]) ? " right" : " wrong";
        h += `<input type="text" class="blank${cls}" data-b="${i}" value="${esc(v)}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${T("blank")} ${i+1}"${done?" disabled":""}>`;
      }
    });
    return `<p class="fill-text">${h}</p>`;
  }
  if(q.type==="match"){
    return `<div class="match">${q.items.map((it,i)=>{
      const v = ans ? ans[i] : -1;
      let cls=""; if(done) cls = v===q.ans[i] ? " right" : " wrong";
      return `<div class="match-row${cls}"><span class="mi"><b>${i+1}.</b> ${esc(it[L])}</span>
        <select data-m="${i}"${done?" disabled":""} aria-label="${esc(it[L])}"><option value="-1">${T("choose")}</option>${q.opts.map((o,k)=>`<option value="${k}"${v===k?" selected":""}>${LETTERS[k]}) ${esc(o[L])}</option>`).join("")}</select>
        ${done && v!==q.ans[i] ? `<span class="mfix">✔ ${esc(q.opts[q.ans[i]][L])}</span>`:""}</div>`;}).join("")}</div>`;
  }
  if(q.type==="order"){
    const cur = ans || q.start;
    return `<ol class="circuit qorder">${cur.map((it,pos)=>{
      let cls=""; if(done) cls = it===pos ? "ok" : "bad";
      return `<li class="${cls}"><span class="pos">${pos+1}</span><span class="txt">${esc(q.items[it][L])}${done&&it!==pos?` <span class="muted">(${T("goesIn")} ${it+1})</span>`:""}</span>
        <button type="button" data-mv="up" data-i="${pos}" aria-label="${T("moveUp")}"${pos===0||done?" disabled":""}>▲</button>
        <button type="button" data-mv="down" data-i="${pos}" aria-label="${T("moveDown")}"${pos===cur.length-1||done?" disabled":""}>▼</button></li>`;}).join("")}</ol>`;
  }
  if(q.type==="open"){
    return `<textarea class="open-ans" rows="5" placeholder="${T("writeHere")}"${done?" disabled":""}>${esc(ans||"")}</textarea>`;
  }
  return "";
}
/* wire inputs; onChange(newAns, rerender) */
function bindAnswerArea(host, q, st, onChange){
  if(q.type==="mc"){
    $$(".opt",host).forEach(b=>b.onclick=()=>onChange(+b.dataset.oi, true));
  } else if(q.type==="fill"){
    $$("input.blank",host).forEach(inp=>inp.addEventListener("input",()=>{
      const a = q.blanks.map((_,i)=>{ const el=host.querySelector(`input.blank[data-b="${i}"]`); return el?el.value:""; });
      onChange(a, false);
    }));
  } else if(q.type==="match"){
    $$("select[data-m]",host).forEach(sel=>sel.addEventListener("change",()=>{
      const a = q.items.map((_,i)=>{ const el=host.querySelector(`select[data-m="${i}"]`); return el?+el.value:-1; });
      onChange(a, false);
    }));
  } else if(q.type==="order"){
    $$("button[data-mv]",host).forEach(b=>b.onclick=()=>{
      const cur = (st.ans || q.start).slice();
      const i=+b.dataset.i, j = b.dataset.mv==="up"? i-1 : i+1;
      if(j<0||j>=cur.length) return;
      [cur[i],cur[j]]=[cur[j],cur[i]];
      onChange(cur, true, `button[data-mv="${b.dataset.mv}"][data-i="${j}"]`);
    });
  } else if(q.type==="open"){
    const ta=$("textarea.open-ans",host); if(ta) ta.addEventListener("input",()=>onChange(ta.value,false));
  }
}
function feedbackHTML(q, ans){
  const f = scoreQ(q, ans), L=LANG;
  const pts = f*q.pts;
  const cls = f===1 ? "ok" : (f>0 ? "part" : "ko");
  const head = f===1 ? T("correct") : (f>0 ? T("partial") : T("incorrect"));
  let h = `<div class="fb ${cls}" role="status"><b>${head}</b> ${q.type!=="mc"||q.src==="model"?`<span class="muted">(${fmtPts(pts)} / ${fmtPts(q.pts)} ${T("ptsShort")})</span>`:""}`;
  if(q.type==="mc"){
    if(f<1) h += `<br>${T("rightAnswer")} <b>${esc(q.o[q.a][L])}</b>.`;
  } else if(q.type==="open"){
    const found = openFound(q, ans);
    h += `<div style="margin-top:6px">${T("keyIdeas")} (${found.filter(Boolean).length}/${q.groups.length}, ${T("needed")} ${q.need}):</div><ul class="ideas">${q.groups.map((g,i)=>`<li class="${found[i]?"yes":"no"}">${found[i]?"✔":"✘"} ${esc(g[L])}</li>`).join("")}</ul>
      <div>${T("modelAnswer")} <i>${esc(q.model[L])}</i></div><div class="muted" style="font-size:.88rem;margin-top:4px">${T("openNote")}</div>`;
  } else if(f<1){
    h += `<br>${T("rightAnswer")} <b>${esc(answerText(q,L))}</b>`;
  }
  if(q.x) h += `<div style="margin-top:4px">${esc(q.x[L])}</div>`;
  return h + `</div>`;
}

const pr = { topic:"all", qtype:"all", list:[], i:0, orders:{}, answers:{}, checked:{}, started:false };
function startPractice(){
  pr.list = shuffle(QUESTIONS.filter(q=>(pr.topic==="all"||q.t===pr.topic) && TYPE_GROUPS[pr.qtype](q)).map(q=>q.id));
  pr.orders = {}; pr.list.forEach(id=>{ const q=QUESTIONS[id]; if(q.type==="mc") pr.orders[id]=shuffle(q.o.map((_,i)=>i)); });

      <button class="btn orange" type="button" id="prAgain">${T("restart")}</button></div>`;
  } else {
    const id = pr.list[pr.i], q = QUESTIONS[id], done = !!pr.checked[id];
    const st = {ans:pr.answers[id], order:pr.orders[id], done};
    body = `<div class="card q-card" style="margin-top:16px">
      <div class="q-meta"><span>${T("question")} ${pr.i+1} ${T("of")} ${pr.list.length} · ${esc(topicName(q.t,LANG))} · <span class="tag">${typeLabel(q)}</span></span>
      <span class="stats"><span>${T("points")}: ${fmtPts(got)} / ${fmtPts(max)}</span></span></div>
      <div class="progress" style="margin-bottom:14px"><span style="width:${(pr.i/pr.list.length*100)}%"></span></div>
      ${q.type==="fill"?`<div class="q-text">${T("fillIntro")}</div>`:`<div class="q-text">${esc(q.q[LANG])}</div>`}
      <div id="prArea">${answerAreaHTML(q, st)}</div>
      ${done ? feedbackHTML(q, pr.answers[id]) : ""}
      <div class="row" style="margin-top:12px;justify-content:flex-end">
        ${!done && q.type!=="mc" ? `<button class="btn green" type="button" id="prCheck">${T("check")}</button>`:""}
        ${done ? `<button class="btn" type="button" id="prNext">${T("next")} ▶</button>`:""}
      </div>
    </div>`;
  }
  v.innerHTML = head + body;
  bindPrHead();
  if(pr.started && pr.i<pr.list.length && pr.list.length){
    const id = pr.list[pr.i], q = QUESTIONS[id];
    const st = {ans:pr.answers[id], order:pr.orders[id], done:!!pr.checked[id]};
    if(!st.done){
      bindAnswerArea($("#prArea"), q, st, (a, rerender, fsel)=>{
        pr.answers[id]=a;

        else if(rerender) renderPractice(fsel);

      $$("input.blank",v).forEach(inp=>inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const c=$("#prCheck"); if(c) c.click(); } }));
    }

      if(pr.answers[id]===undefined && q.type==="order") pr.answers[id]=q.start.slice();

    };
  }
  const n=$("#prNext"); if(n) n.onclick=()=>{ pr.i++; renderPractice(); window.scrollTo({top:0}); };
  const ag=$("#prAgain"); if(ag) ag.onclick=()=>{ startPractice(); renderPractice(); };
  if(focusSel){ const f=v.querySelector(focusSel); if(f) f.focus({preventScroll:true}); }
